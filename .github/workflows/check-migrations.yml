name: Check migrations

# Builds a database from nothing — supabase/migrations/ then supabase/seed.sql —
# on a fresh local Supabase stack, and fails if any file refuses to apply or
# the result is missing what the site needs (create_product(), the rule
# tables, the storage buckets).
#
# This is the check MIGRATIONS.md promises: a schema change reaches
# production only as a migration file that has already applied cleanly to an
# empty database. Before this workflow the folder could not replay at all
# (a Supabase branch stopped at migration 9 of 223), so every change was
# tested in rolled-back transactions on production.
#
# It needs Docker, which GitHub's ubuntu runners have and this project's
# Netlify build does not — so it lives here, not in scripts/check-all.sh.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'supabase/tests/**'
      - '.github/workflows/check-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'supabase/tests/**'
      - '.github/workflows/check-migrations.yml'
  workflow_dispatch:

concurrency:
  group: check-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-from-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # `db start` brings up only the Postgres container (no API, auth,
      # studio) and applies supabase/migrations/ and then supabase/seed.sql.
      # `db reset` then does the same from a clean database and is what fails
      # the job if a file refuses to apply — it is the command a developer
      # runs locally, so a red run here reproduces with one command.
      - name: Start a fresh local database and apply every migration
        run: supabase db start

      - name: Reset and re-apply from zero (fails on any migration error)
        run: supabase db reset --local

      # Claims are not facts (CLAUDE.md, "A green result is not evidence the
      # work happened"). Ask the database what it holds.
      - name: Verify the result holds what the site needs
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          q() { psql "$PGURL" -X -A -t -v ON_ERROR_STOP=1 -c "$1"; }

          tables=$(q "select count(*) from pg_tables where schemaname='public'")
          functions=$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'")
          policies=$(q "select count(*) from pg_policies where schemaname='public'")
          rules=$(q "select count(*) from public.spec_field_rules")
          buckets=$(q "select count(*) from storage.buckets where id in ('avatars','build-photos','product-images')")
          has_create_product=$(q "select count(*) from pg_proc where proname='create_product'")
          mag_pos=$(q "select array_position(enum_range(null::public.product_category)::text[], 'magazine') - array_position(enum_range(null::public.product_category)::text[], 'magwell')")

          echo "public tables:    $tables"
          echo "public functions: $functions"
          echo "public policies:  $policies"
          echo "spec_field_rules: $rules"
          echo "storage buckets:  $buckets / 3"
          echo "create_product(): $has_create_product"
          echo "'magazine' sits this far after 'magwell' in product_category: $mag_pos"

          fail=0
          [ "$tables" -ge 60 ]           || { echo "::error::expected at least 60 public tables"; fail=1; }
          [ "$has_create_product" = 1 ]  || { echo "::error::create_product() is missing"; fail=1; }
          [ "$rules" -ge 100 ]           || { echo "::error::spec_field_rules is not seeded"; fail=1; }
          [ "$buckets" = 3 ]             || { echo "::error::a storage bucket is missing"; fail=1; }
          [ "$mag_pos" = 1 ]             || { echo "::error::product_category enum order is wrong: 'magazine' must come right after 'magwell'"; fail=1; }
          exit $fail

      # Drives the REAL create_product() against the database this job just
      # replayed, under the real spec_field_rules: a barrel/slide lock must
      # carry its provenance (source from the barrel's products.url,
      # compatibility_note from its requires_slide_text) in both p_fits
      # directions, with an explicit value still winning. The test file was
      # watched failing against the pre-fix function before the fix landed.
      - name: create_product() writes sourced barrel/slide locks
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/tests/create-product-lock-source.sql

      # The fit rule itself: v_barrel_slide_fit driven over created
      # fixtures — the three new refusals, both fits-variant verdicts, and
      # the precedence that keeps existing pairs' statuses byte-identical.
      - name: v_barrel_slide_fit refuses what the slides' makers refuse
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/tests/barrel-slide-fit.sql

      # v_comp_barrel_fit: a comp fits only on a matching, stated thread
      # pitch (no NULL pitch, so an Intra-Lok comp fits nothing), and a comp
      # sold with its own barrel fits no other barrel. Two of its statuses
      # have no live row, so this is the only place they run.
      - name: v_comp_barrel_fit demands a matching pitch and refuses kit comps
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/tests/comp-barrel-fit.sql

      # Finish families: the vocabulary seeded (11 families, 33 finishes),
      # a listed finish deriving its family through the real create_product(),
      # a NULL finish saving with a NULL family, an unlisted finish refused in
      # words, a direct write re-derived, a family move re-deriving its
      # variants, and anon read-only on both tables.
      - name: finish_family derives from finishes, and an unlisted finish is refused
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/tests/finish-families.sql

      # Photo changes: every product-photo write recorded by the triggers —
      # primary_image_url insert/change, variant_images insert/url/position/
      # delete — approved only for an admin's request or a declared
      # gunforma.photo_edit; a direct session, the service role and a
      # non-admin flagged; a write that changes no photo not recorded; the
      # table private; create_variant() closed to every API role.
      - name: photo changes are recorded, and only Alex's flow is approved
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/tests/photo-changes.sql

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup || true
