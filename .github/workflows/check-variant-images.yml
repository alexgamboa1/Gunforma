name: Variant image colours

# Asks the catalogue whether any variant is illustrated with a different
# colour's photo. See scripts/check-variant-image-sku.mjs for the full
# reasoning and the rule.
#
# NOT a build check, on the same grounds as check-price-freshness.yml: it reads
# live data, so it is time-dependent rather than tree-dependent. A deploy that
# changed nothing could fail it, and a bad CSV import would pass every deploy
# until somebody imported again. Refusing an unrelated deploy because a catalog
# row is wrong is the wrong lever — and it would put the failure in front of
# whoever happens to be deploying rather than whoever maintains the catalogue.
#
# Daily, not per-deploy, because the thing that breaks it is a CSV import, not
# a commit. Raises an issue rather than mailing, for the reasons set out at
# length in check-price-freshness.yml: no secret to provision, a standing
# signal that does not go quiet on day two, and issue notifications are on by
# default where scheduled-workflow-failure mail is not.

on:
  schedule:
    # 09:11 UTC. After the nightly sync (07:23) and after the 08:41 freshness
    # check, so a sync that refills primary_image_url has already run and this
    # grades the settled state rather than a half-written one.
    - cron: '11 9 * * *'
  workflow_dispatch:

concurrency:
  group: check-variant-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `npm ci` and no secret: the script imports nothing and uses the
      # public anon key, so it cannot die on a dependency or a missing secret.
      - name: Check variant image colours
        id: check
        run: |
          set -o pipefail
          node scripts/check-variant-image-sku.mjs 2>&1 | tee variant-images.log

      - name: Raise or update the alert issue
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('variant-images.log', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Stable marker, not the title — the count changes between runs and
            // matching on the title would open a fresh issue every time it
            // moved, which is the noise that gets alerting muted.
            const MARKER = '<!-- variant-image-colour-alert -->';
            const body = [
              MARKER,
              'One or more product variants are illustrated with a **different colour\'s photo**. ',
              'The image filename carries a sibling variant\'s SKU and not its own, which is provable rather than a guess.',
              '',
              'This matters more than it looks: `gunforma-build-detail.html` copies the chosen variant\'s image into ',
              '`parts_snapshot`, so a wrong photo stops being a fixable catalog row and becomes a permanent part of ',
              'someone\'s build. Default variants are the urgent ones — they are what a new build records.',
              '',
              'Fix by nulling `primary_image_url`. The nightly sync refills it per-colour from the feed wherever the ',
              'link carries a stored identifier; until then the picker and build row fall back to a colour swatch, ',
              'which is a correct answer where a wrong photo is not.',
              '',
              '```',
              log.trim(),
              '```',
              '',
              `[Run](${runUrl})`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const existing = open.data.find(i => (i.body || '').includes(MARKER));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.notice(`Commented on existing alert issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'A variant is illustrated with the wrong colour\'s photo',
                body,
              });
              core.notice(`Opened alert issue #${created.data.number}`);
            }
