name: Refresh affiliate prices

# Fetches Awin's COMBINED product datafeed (all joined merchants in one file)
# and updates street_price, in_stock and last_checked on the matching
# affiliate_links rows. Rows are routed to a partner by merchant_id, so this
# now covers OpticsPlanet (46059) and Olight (90861). Never touches partners
# that have no awin_merchant_id, never blanks a row that doesn't match.
#
# A partner whose match rate falls below its own floor is SKIPPED — the other
# partners still write — and the run then exits non-zero, so the job goes red
# with the other partners' updates already applied.
#
# Failure modes are surfaced by GitHub Actions itself — if this workflow
# fails, the account owner gets an email; no separate alerting to wire up.

on:
  schedule:
    # 07:23 UTC daily = 00:23 Pacific / 03:23 Eastern.
    # Off-peak for the site and well after Awin's nightly feed refresh.
    #
    # The odd minute is deliberate. GitHub queues scheduled workflows and
    # deprioritises them under load, and the top of the hour is the busiest
    # slot on the platform, so '0 8 * * *' consistently ran hours late:
    #   09-19  fired 12:21  (+4h21m)
    #   09-20  fired 12:56  (+4h56m)
    #   09-21  fired 14:56  (+6h56m)
    #   09-22  fired 12:51  (+4h51m)
    # Firing at :23 avoids that crowd. The delay is not just untidy — it makes
    # "has tonight's run landed?" unanswerable without checking, and it widens
    # the window where a migration can collide with a run.
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — parse and match but do not write to the database'
        required: false
        type: boolean
        default: true
      debug_samples:
        description: 'Dump first N raw feed rows to the log (for debugging column shapes). 0 = off.'
        required: false
        type: string
        default: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Unit tests
        working-directory: scripts
        # ONE file, named explicitly — do NOT widen this back to a glob or a
        # bare `node --test`. This step exists to run gtin-norm.test.mjs, the
        # sync's own guard, which cannot run in the site build because its
        # dependency (csv-parse, scripts/package.json) is only installed
        # here. Every other scripts test already runs on every deploy via
        # check-all.sh, so running them again here adds nothing and has now
        # killed the sync twice:
        #   - bare `node --test` used Node's own discovery, swept in
        #     scripts/smoke-test.mjs (whose SMOKE_TEST_* secrets this
        #     workflow rightly lacks), and silently killed the nightly
        #     refresh from 2026-09-25 to 2026-09-29.
        #   - the `*.test.mjs` glob that replaced it swept in every repo
        #     test, and guide-og.test.mjs (2026-11-01) imports
        #     @resvg/resvg-wasm from the ROOT package.json, which this
        #     workflow's `npm ci` (scripts/) never installs. ERR_MODULE_NOT_
        #     FOUND, step exits 1, and the sync was dead from 2026-11-01 to
        #     2026-11-16 — fifteen nights, every price on the site stale,
        #     and the job red for a reason that had nothing to do with
        #     prices. check-routes' sync-freshness assertion now catches the
        #     symptom; this line is the cause.
        run: node --test gtin-norm.test.mjs

      - name: Refresh affiliate prices
        working-directory: scripts
        env:
          # The combined multi-merchant feed. The old single-merchant
          # AWIN_FEED_URL secret is intentionally left in place until this has
          # had a week of clean runs; nothing reads it any more.
          AWIN_FEED_URL_V2:          ${{ secrets.AWIN_FEED_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs always write. Manual runs default to dry-run
          # (the input default is true); flip the checkbox to write.
          DRY_RUN:        ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run == 'true' && 'true' || 'false') }}
          DEBUG_SAMPLES:  ${{ github.event_name == 'schedule' && '0' || github.event.inputs.debug_samples }}
        run: node refresh-affiliate-prices.mjs
