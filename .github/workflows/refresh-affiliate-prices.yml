name: Refresh affiliate prices

# Fetches Awin's COMBINED product datafeed (all joined merchants in one file)
# and updates street_price, in_stock and last_checked on the matching
# affiliate_links rows. Rows are routed to a partner by merchant_id, so this
# now covers OpticsPlanet (46059) and Olight (90861). Never touches partners
# that have no awin_merchant_id, never blanks a row that doesn't match.
#
# A partner whose match rate falls below its own floor is SKIPPED — the other
# partners still write — and the run then exits non-zero, so the job goes red
# with the other partners' updates already applied.
#
# Failure modes are surfaced by GitHub Actions itself — if this workflow
# fails, the account owner gets an email; no separate alerting to wire up.

on:
  schedule:
    # 07:23 UTC daily = 00:23 Pacific / 03:23 Eastern.
    # Off-peak for the site and well after Awin's nightly feed refresh.
    #
    # The odd minute is deliberate. GitHub queues scheduled workflows and
    # deprioritizes them under load, and the top of the hour is the busiest
    # slot by a wide margin — everyone writes '0 * * * *'. Measured against
    # the previous '0 8 * * *':
    #   09-19  fired 12:21  (+4h21m)
    #   09-20  fired 12:56  (+4h56m)
    #   09-21  fired 14:56  (+6h56m)
    #   09-22  fired 12:51  (+4h51m)
    # Four to seven hours late, every time. A minute nobody else picks should
    # land far closer to the requested time. If it does not, the delay is not
    # contention and this comment should be corrected rather than trusted.
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — parse and match but do not write to the database'
        required: false
        type: boolean
        default: true
      debug_samples:
        description: 'Dump first N raw feed rows to the log (for debugging column shapes). 0 = off.'
        required: false
        type: string
        default: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Unit tests
        working-directory: scripts
        run: node --test

      - name: Refresh affiliate prices
        working-directory: scripts
        env:
          # The combined multi-merchant feed. The old single-merchant
          # AWIN_FEED_URL secret is intentionally left in place until this has
          # had a week of clean runs; nothing reads it any more.
          AWIN_FEED_URL_V2:          ${{ secrets.AWIN_FEED_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs always write. Manual runs default to dry-run
          # (the input default is true); flip the checkbox to write.
          DRY_RUN:        ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run == 'true' && 'true' || 'false') }}
          DEBUG_SAMPLES:  ${{ github.event_name == 'schedule' && '0' || github.event.inputs.debug_samples }}
        run: node refresh-affiliate-prices.mjs
