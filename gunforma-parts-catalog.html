<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/favicon-96x96.png?v=12026" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12026" />
<link rel="shortcut icon" href="/favicon.ico?v=12026" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=12026" />
<link rel="manifest" href="/site.webmanifest?v=12026" />
<title>Parts Catalog — Gunforma</title>
<meta name="description" content="Browse the Gunforma parts catalog — filter by platform, category, brand, and price. Favorite parts to save them to your account." />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafaf8; color: #1a1a1a; min-height: 100vh; }

/* NAV — shared nav.js renders into #nav-mount */
.nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 52px; border-bottom: 0.5px solid #2a2b2e; background: #0e0f11; }
.nav-logo { font-size: 15px; font-weight: 600; color: #e8e6e1; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
.nav-logo span { color: #4a9edd; }
.nav-links { display: flex; gap: 28px; }
.nav-link { font-size: 12px; color: #888780; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; transition: color 0.15s; }
.nav-link:hover, .nav-link.active { color: #e8e6e1; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-btn { font-size: 11px; color: #888780; border: 0.5px solid #2a2b2e; padding: 5px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
.nav-btn.cta { color: #4a9edd; border-color: #4a9edd; }

/* PAGE HEADER */
.page-header { max-width: 1400px; margin: 0 auto; padding: 28px 32px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.page-sub   { font-size: 12px; color: #888; margin-top: 4px; }

/* TABS — All parts | My Favorites */
.tab-row { max-width: 1400px; margin: 18px auto 0; padding: 0 32px; display: flex; gap: 4px; border-bottom: 0.5px solid #e5e5e5; }
.tab-btn { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
           padding: 10px 14px; background: transparent; border: none; cursor: pointer; color: #888;
           border-bottom: 2px solid transparent; margin-bottom: -0.5px; transition: color 0.15s, border-color 0.15s; }
.tab-btn:hover { color: #1a1a1a; }
.tab-btn.active { color: #1a1a1a; border-bottom-color: #4a9edd; }
.tab-btn .tab-count { font-size: 11px; color: #999; margin-left: 6px; font-weight: 600; }

/* LAYOUT — sidebar + main */
.catalog { max-width: 1400px; margin: 0 auto; padding: 22px 32px 64px; display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; }
.sidebar { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 18px; }
.main { display: flex; flex-direction: column; gap: 18px; }

/* SEARCH + META BAR */
.search-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 10px 12px; }
.search-input { flex: 1; min-width: 200px; font-family: inherit; font-size: 13px; padding: 8px 12px; border: 0.5px solid #e5e5e5; border-radius: 4px; background: #fafaf8; }
.search-input:focus { outline: none; border-color: #4a9edd; background: #fff; }
.result-count { font-size: 11px; color: #888; }
.clear-filters { font-family: inherit; font-size: 11px; padding: 6px 12px; background: transparent; border: 0.5px solid #d5d3ca; color: #666; border-radius: 4px; cursor: pointer; }
.clear-filters:hover:not(:disabled) { color: #a25334; border-color: #eec2ae; }
.clear-filters:disabled { opacity: 0.4; cursor: not-allowed; }

/* FILTER GROUPS */
.filter-group { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 14px 14px 12px; }
.filter-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1a1a1a; margin-bottom: 10px; }
.filter-option { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; color: #333; cursor: pointer; user-select: none; }
.filter-option input { accent-color: #4a9edd; cursor: pointer; margin: 0; }
.filter-option .filter-option-count { margin-left: auto; font-size: 10.5px; color: #999; }
.filter-scroll { max-height: 220px; overflow-y: auto; padding-right: 4px; }
.filter-scroll::-webkit-scrollbar { width: 6px; }
.filter-scroll::-webkit-scrollbar-thumb { background: #d9d6cc; border-radius: 3px; }
.filter-note { font-size: 10.5px; color: #999; margin-top: 6px; line-height: 1.5; }

.price-range { display: flex; align-items: center; gap: 6px; }
.price-range input { width: 100%; min-width: 0; font-family: inherit; font-size: 12.5px; padding: 6px 8px; border: 0.5px solid #e5e5e5; border-radius: 4px; }
.price-range input:focus { outline: none; border-color: #4a9edd; }
.price-range .price-dash { color: #888; font-size: 12px; }

/* PART CARDS GRID */
.parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.part-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s; position: relative; }
.part-card:hover { border-color: #cfcdc4; transform: translateY(-1px); }
.part-card-photo { position: relative; aspect-ratio: 4/3; background: #f4f3ee; overflow: hidden; }
.part-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.part-card-nophoto { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 10.5px; color: #b8b5ac; letter-spacing: 0.06em; text-transform: uppercase; }
.part-card-cat { position: absolute; top: 8px; left: 8px; font-size: 9px; color: #1d6fb8; background: #eaf4fc; border: 0.5px solid #a7cdec; padding: 3px 7px; border-radius: 20px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.part-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.part-card-brand { font-size: 10px; color: #2a7bbd; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.part-card-name  { font-size: 13.5px; font-weight: 700; line-height: 1.3; color: #1a1a1a; }
.part-card-desc  { font-size: 11px; color: #666; line-height: 1.5; max-height: 3em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.part-card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 0.5px solid #eee; margin-top: auto; }
.part-card-price { font-size: 14px; font-weight: 700; color: #1a1a1a; }
.part-card-price.na { color: #bbb; font-weight: 500; }

/* Favorite (heart) button — sits above the photo, top-right */
.fav-btn { position: absolute; top: 8px; right: 8px; z-index: 2;
           width: 32px; height: 32px; border-radius: 50%;
           background: rgba(255,255,255,0.9); border: 0.5px solid #e5e5e5;
           display: flex; align-items: center; justify-content: center; cursor: pointer;
           font-family: inherit; font-size: 15px; color: #888; padding: 0;
           transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s; }
.fav-btn:hover { background: #fff; color: #d85a30; border-color: #d85a30; }
.fav-btn.active { background: #fff; color: #d85a30; border-color: #d85a30; }
.fav-btn:active { transform: scale(0.9); }

/* EMPTY STATES */
.loading, .empty { padding: 60px 20px; text-align: center; font-size: 13px; color: #888; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; }
.empty-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }

/* TOAST — same visual as builds page */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; font-size: 12px; padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; z-index: 200; pointer-events: none; }
.toast.show { opacity: 1; pointer-events: auto; }
.toast a { color: #6fb4e8; margin-left: 6px; text-decoration: underline; }

/* MOBILE */
@media (max-width: 900px) {
  .catalog { grid-template-columns: 1fr; padding: 18px 16px 48px; gap: 18px; }
  .sidebar { position: static; }
  .page-header { padding: 22px 16px 0; }
  .tab-row { padding: 0 16px; }
  .filter-scroll { max-height: 180px; }
}

/* Spec-filter groups (nested inside the sidebar). Each spec key is its own
   small filter block so the sidebar stays readable when 5+ spec keys are
   in play for a category. */
.spec-block { border-top: 0.5px solid #efece3; padding-top: 10px; margin-top: 10px; }
.spec-block:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.spec-block .filter-title { font-size: 10.5px; margin-bottom: 6px; color: #444; }
.spec-block .filter-option { font-size: 12px; }

/* Sub-model selector strip — appears above the category tabs when exactly
   one platform is active. "All models" is the default; specific sub-model
   selection is optional and layers on top of My Setup pin-based fitment. */
.submodel-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; }
.submodel-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #888; }
.submodel-chip { font-family: inherit; font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 20px; border: 0.5px solid #d5d3ca; background: #fff; color: #444; cursor: pointer; letter-spacing: 0.02em; transition: color .15s, background .15s, border-color .15s; }
.submodel-chip:hover { border-color: #4a9edd; color: #2a7bbd; }
.submodel-chip.active { background: #4a9edd; color: #fff; border-color: #4a9edd; }

/* Detail-panel compatibility badge — shown when a sub-model is selected
   and this product is either compatible ✓ or explicitly not ✗. */
.detail-compat-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; margin-top: 6px; }
.detail-compat-badge.ok  { background: #eaf5ee; color: #166534; border: 0.5px solid #86cfad; }
.detail-compat-badge.no  { background: #fde8e2; color: #9b1c1c; border: 0.5px solid #f5b4a1; }
.detail-compat-badge.na  { background: #fafaf8; color: #888;    border: 0.5px solid #d9d6cc; }

/* Horizontal category selector — primary way to narrow by category, above
   the grid. Single-select (contrast with the sidebar's other multi-select
   filters); the sidebar Category multi-select was removed to avoid two
   controls competing for the same job. */
.cat-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.cat-tab { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 8px 14px; border-radius: 20px; border: 0.5px solid #d5d3ca; background: #fff; color: #666; cursor: pointer; transition: color .15s, background .15s, border-color .15s; }
.cat-tab:hover { color: #1a1a1a; border-color: #4a9edd; }
.cat-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

/* Sort dropdown — sits inside the .search-row on the right. */
.sort-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #888; }
.sort-select { font-family: inherit; font-size: 12px; padding: 6px 10px; border: 0.5px solid #d5d3ca; background: #fafaf8; border-radius: 4px; color: #333; cursor: pointer; }
.sort-select:focus { outline: none; border-color: #4a9edd; background: #fff; }

/* "My Setup" strip — pinned owned components + a chip per category.
   Absent (fully hidden) when nothing is pinned so it doesn't take space. */
.setup-strip { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.setup-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #888; }
.setup-chip { display: inline-flex; align-items: center; gap: 8px; background: #eaf5ee; border: 0.5px solid #86cfad; border-radius: 20px; padding: 5px 10px 5px 12px; font-size: 11.5px; color: #166534; font-weight: 600; }
.setup-chip strong { font-weight: 700; }
.setup-chip .setup-chip-spec { color: #4a704f; font-weight: 500; }
.setup-chip-x { background: none; border: none; color: #7ba189; font-size: 15px; line-height: 1; cursor: pointer; font-family: inherit; padding: 0; }
.setup-chip-x:hover { color: #c25d3a; }

/* Fitment info banner — visible when pinned setup components actively
   actively narrowing a downstream category. Dismissable per session (the
   filter itself stays active — dismiss just hides the explanation). */
.fitment-banner { display: flex; align-items: center; gap: 12px; background: #eaf4fc; border: 0.5px solid #a7cdec; border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; font-size: 12px; color: #1d6fb8; line-height: 1.5; }
.fitment-banner-icon { font-size: 14px; }
.fitment-banner-body { flex: 1; }
.fitment-banner-body strong { color: #0e3f68; }
.fitment-banner-close { background: none; border: none; color: #1d6fb8; font-size: 16px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
.fitment-banner-close:hover { background: rgba(29,111,184,0.14); }

/* Grid-card MINE badge — surfaces which product is currently pinned as
   the user's own so it's visible from the browse view without opening detail. */
.part-card-mine-badge { position: absolute; top: 8px; left: 8px; z-index: 2;
  font-size: 9.5px; color: #166534; background: #eaf5ee; border: 0.5px solid #86cfad;
  padding: 3px 8px; border-radius: 3px; font-weight: 700; letter-spacing: 0.06em; }

/* Detail panel: extra "Set as mine" secondary action. Visually smaller
   than the Buy CTA — this is a bookkeeping action, not a conversion. */
.detail-mine-btn { display: block; width: 100%; margin-top: 8px; padding: 9px 12px;
  background: #fafaf8; color: #444; border: 0.5px solid #d5d3ca; border-radius: 4px;
  font-family: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; cursor: pointer; transition: all .15s; }
.detail-mine-btn:hover { border-color: #86cfad; background: #eaf5ee; color: #166534; }
.detail-mine-btn.active { border-color: #86cfad; background: #eaf5ee; color: #166534; }

/* Bump the Buy CTA one more notch — largest text + padding on the page. */
.detail-btn.buy { font-size: 14px; padding: 14px 18px; letter-spacing: 0.05em; }

/* ─── AFFILIATE — classes ported verbatim from gunforma-build-detail.html
   so buy-link markup is visually identical across every page. ─── */
.part-affiliate { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 0.5px solid #eee; background: #fafaf8; border-radius: 6px; }
.part-affiliate-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.part-affiliate-price { font-size: 15px; font-weight: 700; color: #1a1a1a; line-height: 1.1; }
.part-affiliate-partner { font-size: 11px; color: #888; }
.part-affiliate-partner strong { color: #444; font-weight: 600; }
.part-affiliate-stock { display: inline-block; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-left: 6px; }
.part-affiliate-stock.in { color: #2f7a3d; background: #eaf5ec; border: 0.5px solid #b7dcbe; }
.part-affiliate-stock.out { color: #a25334; background: #faece7; border: 0.5px solid #eec2ae; }
.part-affiliate-btn { flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff; background: #2a7bbd; border: 0.5px solid #2a7bbd; padding: 8px 14px; border-radius: 4px; text-decoration: none; transition: background 0.15s; letter-spacing: 0.02em; }
.part-affiliate-btn:hover { background: #1e63a0; }
.part-affiliate-disclosure { font-size: 10px; color: #a8a5a0; padding: 8px 4px 0; }
.part-affiliate-range { font-size: 11px; color: #666; font-weight: 500; margin-left: 6px; }
.part-affiliate-options { border-top: 0.5px solid #eee; padding: 0; margin-top: 4px; }
.part-affiliate-options-summary { list-style: none; cursor: pointer; padding: 10px 4px; font-size: 11px; color: #2a7bbd; font-weight: 600; user-select: none; }
.part-affiliate-options-summary::-webkit-details-marker { display: none; }
.part-affiliate-options-summary::after { content: ' ▾'; }
.part-affiliate-options[open] .part-affiliate-options-summary::after { content: ' ▴'; }
.part-affiliate-variant-list { display: flex; flex-direction: column; padding: 0 0 6px; background: #f4f3ee; border-radius: 6px; }
.part-affiliate-variant-header { padding: 10px 14px 8px; border-bottom: 0.5px solid #dcdbd3; }
.part-affiliate-variant-header-label { font-size: 10.5px; color: #555; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
.part-affiliate-variant-header-note { font-size: 11.5px; color: #6b6a63; font-style: italic; margin-top: 5px; letter-spacing: 0; text-transform: none; font-weight: 400; line-height: 1.45; }
.part-affiliate-variant-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-top: 0.5px solid #e8e6df; }
.part-affiliate-variant-row:first-child { border-top: none; }
.part-affiliate-variant-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.part-affiliate-variant-label { font-size: 12px; color: #333; font-weight: 600; }
.part-affiliate-variant-sub { font-size: 11px; color: #888; }
.part-affiliate-variant-sub strong { color: #444; font-weight: 600; }
.part-affiliate-variant-btn { flex-shrink: 0; font-size: 10.5px; font-weight: 600; color: #2a7bbd; background: #fff; border: 0.5px solid #a7cdec; padding: 6px 12px; border-radius: 4px; text-decoration: none; transition: background 0.15s; }
.part-affiliate-variant-btn:hover { background: #eaf4fc; }

/* Compact per-card variant of the affiliate row — sits below the MSRP on
   grid cards. Same class inheritance, tighter padding/font so the card
   stays proportioned. */
.part-card .part-affiliate { padding: 8px 10px; margin-top: 6px; }
.part-card .part-affiliate-price { font-size: 13px; }
.part-card .part-affiliate-btn { font-size: 10px; padding: 6px 10px; }

/* Detail panel: promote the affiliate block visually — biggest interactive
   element in the panel, since the user's spec: "highest-intent moment on
   the entire site". */
.detail-affiliate-wrap { padding: 0; }
.detail-affiliate-wrap .part-affiliate { padding: 14px 16px; border-width: 1px; border-color: #cfe0f0; background: #f5fbff; }
.detail-affiliate-wrap .part-affiliate-price { font-size: 20px; }
.detail-affiliate-wrap .part-affiliate-btn { font-size: 14px; padding: 12px 18px; letter-spacing: 0.05em; }

/* Cards now click into the detail panel; add a subtle affordance so it
   reads as clickable. */
.part-card { cursor: pointer; }

/* ─── DETAIL SLIDE-OVER PANEL ─── */
.detail-scrim {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(14,15,17,0.55);
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease;
}
.detail-scrim.open { opacity: 1; pointer-events: auto; }

.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 301;
  width: 100%; max-width: 520px;
  background: #fff; box-shadow: -8px 0 32px rgba(0,0,0,0.18);
  transform: translateX(100%);
  transition: transform 0.22s ease;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.detail-panel.open { transform: translateX(0); }

.detail-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 0.5px solid #e5e5e5; background: #fff; z-index: 2; }
.detail-header-eyebrow { font-size: 10px; color: #888; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
.detail-close-btn { background: none; border: none; font-family: inherit; font-size: 22px; line-height: 1; color: #666; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
.detail-close-btn:hover { background: #f4f3ee; color: #1a1a1a; }

.detail-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; display: flex; flex-direction: column; gap: 18px; }

.detail-hero { aspect-ratio: 4/3; background: #f4f3ee; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.detail-hero img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.detail-hero-nophoto { font-size: 11px; color: #b8b5ac; letter-spacing: 0.06em; text-transform: uppercase; }

.detail-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-thumb { width: 56px; height: 56px; border: 0.5px solid #e5e5e5; border-radius: 4px; overflow: hidden; padding: 0; background: #f4f3ee; cursor: pointer; transition: border-color 0.15s; }
.detail-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-thumb:hover { border-color: #4a9edd; }
.detail-thumb.active { border-color: #4a9edd; box-shadow: 0 0 0 1px #4a9edd; }

.detail-brand { font-size: 10.5px; color: #2a7bbd; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.detail-title { font-size: 20px; font-weight: 700; line-height: 1.25; color: #1a1a1a; letter-spacing: -0.005em; }
.detail-cat-badge { display: inline-block; font-size: 10px; color: #1d6fb8; background: #eaf4fc; border: 0.5px solid #a7cdec; padding: 3px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 6px; }
.detail-price { font-size: 26px; font-weight: 700; color: #1a1a1a; }
.detail-price.na { font-size: 15px; color: #999; font-weight: 500; }

.detail-desc { font-size: 13.5px; color: #333; line-height: 1.65; }
.detail-desc p { margin-bottom: 10px; }
.detail-desc p:last-child { margin-bottom: 0; }

.detail-section-title { font-size: 10.5px; color: #888; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
.detail-specs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.detail-specs-table tr { border-top: 0.5px solid #efece3; }
.detail-specs-table tr:first-child { border-top: none; }
.detail-specs-table th { text-align: left; color: #666; font-weight: 500; padding: 8px 12px 8px 0; white-space: nowrap; width: 35%; }
.detail-specs-table td { color: #1a1a1a; font-weight: 600; padding: 8px 0; }

.detail-platform-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.detail-platform-chip { font-size: 10.5px; padding: 4px 10px; border: 0.5px solid #d5d3ca; border-radius: 20px; background: #fafaf8; color: #444; font-weight: 600; letter-spacing: 0.02em; }

/* Actions — Buy is the primary conversion, deliberately visually dominant */
.detail-actions { position: sticky; bottom: 0; background: #fff; border-top: 0.5px solid #e5e5e5; padding: 14px 22px; display: flex; gap: 10px; align-items: center; box-shadow: 0 -8px 20px rgba(255,255,255,0.9); }
.detail-fav-btn { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid #d5d3ca; font-family: inherit; font-size: 18px; color: #888; cursor: pointer; transition: all 0.15s; }
.detail-fav-btn:hover, .detail-fav-btn.active { color: #d85a30; border-color: #d85a30; }
.detail-btn { flex: 1; font-family: inherit; font-size: 13px; font-weight: 700; padding: 12px 16px; border-radius: 5px; text-align: center; text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; border: none; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
.detail-btn.buy     { background: #4a9edd; color: #fff; }
.detail-btn.buy:hover { background: #2a7bbd; }
.detail-btn.buy.disabled { background: #efece3; color: #999; cursor: not-allowed; pointer-events: none; }
.detail-btn.armory  { background: #fff; color: #1a1a1a; border: 1px solid #d5d3ca; padding: 11px 16px; }
.detail-btn.armory:hover { border-color: #4a9edd; color: #2a7bbd; }

@media (max-width: 600px) {
  .detail-panel { max-width: none; }
  .detail-actions { padding: 12px 16px; }
  .detail-body { padding: 16px 16px 24px; }
}
</style>
</head>
<body>

<div id="nav-mount" data-nav="full"></div>

<div class="page-header">
  <div>
    <div class="page-title">Parts Catalog</div>
    <div class="page-sub">Browse compatible parts for your pistol platform. Heart parts to save them.</div>
  </div>
</div>

<div class="tab-row" role="tablist">
  <button type="button" class="tab-btn active" id="tab-all" role="tab" aria-selected="true">All parts <span class="tab-count" id="tab-all-count"></span></button>
  <button type="button" class="tab-btn"        id="tab-favs" role="tab" aria-selected="false">My Favorites <span class="tab-count" id="tab-favs-count"></span></button>
</div>

<div class="catalog">
  <aside class="sidebar" id="sidebar">
    <!-- Filter groups injected by renderFilters() so the option counts stay
         accurate as the underlying product list changes. -->
  </aside>
  <div class="main">
    <!-- Sub-model selector — only renders when exactly one platform is
         active (sub-models are platform-specific). Populated from the
         guns table. -->
    <div id="sub-model-wrap"></div>

    <!-- Category selector — single-select, sits above search/sort so it
         reads as the primary way to slice the catalog. -->
    <div class="cat-tabs" id="cat-tabs"></div>

    <div class="search-row">
      <input class="search-input" id="search" type="search" placeholder="Search brand, part name, description…" autocomplete="off" />
      <span class="result-count" id="result-count">Loading…</span>
      <div class="sort-wrap">
        <label for="sort-select" style="font-weight:600;">Sort</label>
        <select class="sort-select" id="sort-select">
          <option value="newest">Newest</option>
          <option value="price_asc">Price low → high</option>
          <option value="price_desc">Price high → low</option>
          <option value="brand">Brand A → Z</option>
        </select>
      </div>
      <button type="button" class="clear-filters" id="clear-filters" disabled>Clear filters</button>
    </div>

    <!-- Pinned setup + fitment info banner. Both render nothing when empty. -->
    <div id="setup-strip-wrap"></div>
    <div id="fitment-banner-wrap"></div>

    <div id="grid-container">
      <div class="loading">Loading parts…</div>
    </div>
  </div>
</div>

<!-- Detail slide-over: opens on part-card click. Kept in the DOM (hidden via
     transform) so open/close is a class toggle, no re-mount cost per click. -->
<div class="detail-scrim" id="detail-scrim" hidden></div>
<aside class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
  <div class="detail-header">
    <div class="detail-header-eyebrow" id="detail-eyebrow">Product</div>
    <button type="button" class="detail-close-btn" id="detail-close" aria-label="Close">×</button>
  </div>
  <div class="detail-body">
    <div class="detail-hero" id="detail-hero"></div>
    <div class="detail-thumbs" id="detail-thumbs"></div>
    <div>
      <div class="detail-brand" id="detail-brand"></div>
      <div class="detail-title" id="detail-title"></div>
      <div id="detail-cat-badge-wrap"></div>
      <div id="detail-compat-badge-wrap"></div>
    </div>
    <div class="detail-price" id="detail-price"></div>
    <!-- Affiliate block: hero row + expandable variants + disclosure.
         Populated from js/affiliate.js in renderDetail. -->
    <div class="detail-affiliate-wrap" id="detail-affiliate-wrap"></div>
    <div class="detail-desc" id="detail-desc"></div>
    <div id="detail-specs-wrap" hidden>
      <div class="detail-section-title">Specifications</div>
      <table class="detail-specs-table"><tbody id="detail-specs-body"></tbody></table>
    </div>
    <div id="detail-platforms-wrap" hidden>
      <div class="detail-section-title">Compatible with</div>
      <div class="detail-platform-chips" id="detail-platform-chips"></div>
    </div>
  </div>
  <!-- Footer actions are secondary now — the primary Buy CTA lives in the
       affiliate block up in detail-body. Kept: favorite, Armory hand-off,
       and the "set as mine" bookkeeping toggle. -->
  <div class="detail-actions" style="flex-direction:column; align-items:stretch;">
    <div style="display:flex; gap:10px; align-items:center; width:100%;">
      <button type="button" class="detail-fav-btn" id="detail-fav" aria-label="Favorite" aria-pressed="false">♡</button>
      <button type="button" class="detail-btn armory" id="detail-armory">Add to Armory build</button>
    </div>
    <button type="button" class="detail-mine-btn" id="detail-mine">☐ Set as mine (mark as owned)</button>
  </div>
</aside>

<div class="toast" id="toast"><span id="toast-msg"></span><span id="toast-link-wrap"></span></div>

<div id="footer-mount" data-footer="default"></div>

<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/footer.js"></script>
<script src="js/affiliate.js"></script>
<script>
// ============================================================
// gunforma-parts-catalog.html — searchable parts DATABASE.
//
// This page was rewritten on 2026-09-09 from a build-configurator into
// a pure browse/search catalog. The old configurator source lives at
// _scratch/parts-catalog-configurator-source.html and will be used as
// the base for the upcoming Armory (build-assembly) page.
//
// Data flow:
//   1. loadEverything() fetches products + variants + brands + platforms
//      + product_platforms + (if signed in) part_favorites — six queries,
//      denormalizes into a flat PRODUCTS array with computed brand/price/
//      image/platform_ids. Client-side filter/sort/render on 233 rows is
//      trivially fast and dodges pagination complexity.
//   2. renderFilters() builds sidebar sections with live option counts.
//   3. applyFiltersAndRender() runs on any filter/search change and
//      re-renders the grid.
//   4. Favoriting is optimistic: toggle local Set + repaint one card,
//      then insert/delete on Supabase, revert on error. Same pattern as
//      toggleFire in gunforma-builds.html.
// ============================================================
var sb = window.sb;

// ─── STATE ────────────────────────────────────────────────
var CURRENT_USER = null;
var PRODUCTS = [];              // denormalized flat rows (see loadEverything)
var PLATFORMS_BY_ID = {};       // {id: {id,name,slug}}
var FAVORITES = new Set();      // product_ids the signed-in user has favorited
var SETUP = {};                 // { category: product } — user's owned components; drives fitment-chain filtering
var LS_SETUP_KEY = 'catalog.mySetup.v1';
var LS_BANNER_DISMISSED_KEY = 'catalog.fitmentBannerDismissed';  // per-tab; sessionStorage

// Sub-model context — user's specific pistol variant (e.g. P365XL vs
// P365 vs FUSE). Layered ON TOP of My Setup: sub-model contributes
// factory-spec constraints (housing_class, barrel_length_in) while SETUP
// contributes constraints from actual aftermarket parts. Both narrow
// additively.
var SELECTED_SUBMODEL = null;   // one row from GUNS, or null
var LS_SUBMODEL_KEY = 'catalog.subModel.v1';
// Cross-category compatibility whitelists (populated in loadEverything).
var BSR_BY_BARREL = {}, BSR_BY_SLIDE = {};
var MFR_BY_MAGWELL = {}, MFR_BY_FRAME = {};
var GUNS = [];

// Spec-filter schema per category — points at real spec-table columns or
// per-variant fields. `source` is either a spec-table name (single flattened
// row per product) or the literal string 'variant' (union across the
// product's variants). `type` decides the widget: strings=checkboxes with
// facet counts, boolean=single "Yes" toggle, numeric=min/max range.
// Labels default to specLabel(key); override with `label` when the raw key
// reads awkwardly (e.g. 'optic_cut' on an OPTIC is really its "Footprint",
// not the slide's cut).
var SPEC_FILTERS_BY_CATEGORY = {
  slide: [
    { source: 'slide_specs',       key: 'optic_cut',                 type: 'strings' },
    { source: 'slide_specs',       key: 'barrel_length_in',          type: 'numeric', suffix: '"' },
    { source: 'slide_specs',       key: 'integrated_comp',           type: 'boolean' },
  ],
  barrel: [
    { source: 'barrel_specs',      key: 'barrel_length_in',          type: 'numeric', suffix: '"' },
    { source: 'barrel_specs',      key: 'barrel_type',               type: 'strings' },
    { source: 'barrel_specs',      key: 'thread_pitch',              type: 'strings' },
  ],
  compensator: [
    { source: 'compensator_specs', key: 'thread_pitch',              type: 'strings' },
    { source: 'compensator_specs', key: 'requires_threaded_barrel',  type: 'boolean' },
  ],
  frame: [
    { source: 'frame_specs',       key: 'housing_class',             type: 'strings' },
  ],
  optic: [
    { source: 'variant',           key: 'optic_cut',                 type: 'strings', label: 'Footprint' },
  ],
};
// Filters shown for every category (in addition to the per-category set).
var SPEC_UNIVERSAL_FILTERS = [
  { source: 'variant', key: 'color',  type: 'strings' },
  { source: 'variant', key: 'finish', type: 'strings' },
];

// Filter state — everything the sidebar controls.
var F = {
  platforms:  new Set(),        // platform ids
  categories: new Set(),        // category enum values
  brands:     new Set(),        // brand ids
  priceMin:   null,
  priceMax:   null,
  search:     '',
  favsOnly:   false,            // tab-controlled, not a sidebar filter
  sort:       'newest',         // 'newest' | 'price_asc' | 'price_desc' | 'brand'
  // Dynamic per-spec-key filter state. Shape per key:
  //   { type: 'strings',  values: Set<string> }
  //   { type: 'boolean',  on: bool }         // only meaningful when true
  //   { type: 'numeric',  min, max }
  // Only kept for keys the user actually toggled — cleared on category change.
  specs: {},
};

// ─── AUTH ────────────────────────────────────────────────
// Session watchdog — public page, don't redirect on SIGNED_OUT (that
// event fires on the initial auth check for anon visitors too). Just
// refresh nav + favorites state.
sb.auth.onAuthStateChange(function (event, session) {
  var newUser = session ? session.user : null;
  var flipped = (!newUser) !== (!CURRENT_USER);
  CURRENT_USER = newUser;
  if (!newUser) { FAVORITES = new Set(); }
  if (flipped) { loadFavoritesAndRender(); }
});

// ─── LOAD ────────────────────────────────────────────────
async function init() {
  var sess = await sb.auth.getSession();
  CURRENT_USER = sess && sess.data && sess.data.session && sess.data.session.user || null;
  await loadEverything();
  loadSetupFromStorage();      // must run AFTER PRODUCTS is populated
  loadSubModelFromStorage();   // must run AFTER GUNS is populated
  wireControls();
  // Sync the sort dropdown to whatever's in F.sort (default: 'newest').
  var sortEl = document.getElementById('sort-select');
  if (sortEl) sortEl.value = F.sort;
  renderFilters();
  applyFiltersAndRender();
}

async function loadEverything() {
  // Full-fidelity query — joins every spec table + the variant fields the
  // fitment logic and detail panel need + brand + platforms. Explicit FK
  // names on the spec tables because a composite (id,category) FK also
  // exists and PostgREST refuses to guess between the two.
  var productsQ = sb
    .from('products')
    .select(
      'id, name, description, category, brand_id, url, lowest_price, created_at,' +
      'brands:manufacturers(id, name),' +
      'product_platforms(platform_id),' +
      'product_variants!product_variants_product_id_fkey(' +
        'id, msrp, is_default, color, finish, optic_cut, bundle, clamp, ' +
        'manual_safety_variant, sku, primary_image_url' +
      '),' +
      'slide_specs!slide_specs_product_id_fkey(*),' +
      'barrel_specs!barrel_specs_product_id_fkey(*),' +
      'compensator_specs!compensator_specs_product_id_fkey(*),' +
      'frame_specs!frame_specs_product_id_fkey(*),' +
      'magwell_specs(*)'
    )
    .eq('is_discontinued', false);
  var platformsQ = sb.from('platforms').select('id, name, slug').order('name');
  // Compatibility whitelists — populated pairs mean "only these fit".
  var bsrQ = sb.from('barrel_slide_requirements')
    .select('barrel_product_id, slide_product_id, compatibility_note');
  var mfrQ = sb.from('magwell_frame_requirements')
    .select('magwell_product_id, frame_product_id, compatibility_note');
  // Sub-model table (P365 vs P365XL vs FUSE etc.). Loaded now; not surfaced
  // as a filter yet — reserved for a future sub-model UI.
  var gunsQ = sb.from('guns')
    .select('id, slug, name, platform_id, housing_class, integrated_comp, ' +
            'barrel_length_in, slide_length_in, oem_capacity');

  var results = await Promise.all([productsQ, platformsQ, bsrQ, mfrQ, gunsQ]);
  var prodRes = results[0], platRes = results[1], bsrRes = results[2], mfrRes = results[3], gunsRes = results[4];
  if (prodRes.error) { console.error(prodRes.error); return showFatal(prodRes.error.message); }
  if (platRes.error) { console.error(platRes.error); return showFatal(platRes.error.message); }
  // BSR/MFR/guns are non-fatal — the catalog still works with empty
  // whitelists, just without cross-category fitment enforcement.
  if (bsrRes.error)  { console.warn('[catalog] BSR load failed', bsrRes.error); }
  if (mfrRes.error)  { console.warn('[catalog] MFR load failed', mfrRes.error); }
  if (gunsRes.error) { console.warn('[catalog] guns load failed', gunsRes.error); }

  (platRes.data || []).forEach(function (p) { PLATFORMS_BY_ID[p.id] = p; });
  GUNS = gunsRes.data || [];

  BSR_BY_BARREL = {};
  BSR_BY_SLIDE  = {};
  (bsrRes.data || []).forEach(function (r) {
    (BSR_BY_BARREL[r.barrel_product_id] = BSR_BY_BARREL[r.barrel_product_id] || []).push(r);
    (BSR_BY_SLIDE[r.slide_product_id]   = BSR_BY_SLIDE[r.slide_product_id]   || []).push(r);
  });
  MFR_BY_MAGWELL = {};
  MFR_BY_FRAME   = {};
  (mfrRes.data || []).forEach(function (r) {
    (MFR_BY_MAGWELL[r.magwell_product_id] = MFR_BY_MAGWELL[r.magwell_product_id] || []).push(r);
    (MFR_BY_FRAME[r.frame_product_id]     = MFR_BY_FRAME[r.frame_product_id]     || []).push(r);
  });

  // Flatten single-row spec embeds ([{...}] -> {...} or null) so downstream
  // reads are `product.slide_specs.optic_cut`, not `[0].optic_cut`.
  var SPEC_KEYS = ['slide_specs','barrel_specs','compensator_specs','frame_specs','magwell_specs'];
  PRODUCTS = (prodRes.data || []).map(function (r) {
    var variants = r.product_variants || [];
    var dv = variants.find(function (v) { return v.is_default; }) || variants[0] || null;
    var price = dv && dv.msrp != null ? Number(dv.msrp)
              : (r.lowest_price != null ? Number(r.lowest_price) : null);
    var product = {
      id: r.id,
      name: r.name || '',
      description: r.description || '',
      category: r.category,
      brand_id: r.brand_id,
      brand: (r.brands && r.brands.name) || 'Unknown',
      price: price,
      image: (dv && dv.primary_image_url) || null,
      buy_url: r.url || null,
      variants: variants,
      created_at: r.created_at,
      platform_ids: (r.product_platforms || []).map(function (pp) { return pp.platform_id; }),
      _search: ((r.brands && r.brands.name ? r.brands.name : '') + ' ' + (r.name || '') + ' ' + (r.description || '')).toLowerCase(),
    };
    SPEC_KEYS.forEach(function (k) {
      var v = r[k];
      product[k] = Array.isArray(v) ? (v[0] || null) : (v || null);
    });
    return product;
  });

  await loadFavoritesAndRender(/*skipRender*/ true);
  // Affiliate listings for every visible product (one query, ~233 ids).
  // Never fatal — renderers handle missing entries by hiding the block.
  try {
    if (window.affiliate) {
      await window.affiliate.loadFor(sb, PRODUCTS.map(function (p) { return p.id; }));
    }
  } catch (e) { console.warn('[catalog] affiliate load failed', e); }
}

async function loadFavoritesAndRender(skipRender) {
  if (!CURRENT_USER) { FAVORITES = new Set(); }
  else {
    var res = await sb.from('part_favorites').select('product_id').eq('user_id', CURRENT_USER.id);
    if (res.error) { console.error(res.error); }
    else { FAVORITES = new Set((res.data || []).map(function (r) { return r.product_id; })); }
  }
  updateTabCounts();
  if (!skipRender) applyFiltersAndRender();
}

// ─── CONTROLS ────────────────────────────────────────────
function wireControls() {
  document.getElementById('search').addEventListener('input', function (e) {
    F.search = (e.target.value || '').trim().toLowerCase();
    applyFiltersAndRender();
  });
  document.getElementById('sort-select').addEventListener('change', function (e) {
    F.sort = e.target.value; applyFiltersAndRender();
  });
  document.getElementById('clear-filters').addEventListener('click', clearAllFilters);
  document.getElementById('tab-all').addEventListener('click', function () { setTab(false); });
  document.getElementById('tab-favs').addEventListener('click', function () {
    if (!CURRENT_USER) { toast('Sign in to see your favorites', 'gunforma-signin.html', 'Sign in'); return; }
    setTab(true);
  });
}

function setTab(favsOnly) {
  F.favsOnly = favsOnly;
  document.getElementById('tab-all').classList.toggle('active', !favsOnly);
  document.getElementById('tab-favs').classList.toggle('active', favsOnly);
  document.getElementById('tab-all').setAttribute('aria-selected', String(!favsOnly));
  document.getElementById('tab-favs').setAttribute('aria-selected', String(favsOnly));
  applyFiltersAndRender();
}

function updateTabCounts() {
  document.getElementById('tab-all-count').textContent  = '(' + PRODUCTS.length + ')';
  document.getElementById('tab-favs-count').textContent = CURRENT_USER ? ('(' + FAVORITES.size + ')') : '';
}

function clearAllFilters() {
  F.platforms.clear(); F.categories.clear(); F.brands.clear();
  F.priceMin = null; F.priceMax = null; F.search = '';
  F.specs = {};
  document.getElementById('search').value = '';
  renderFilters();
  applyFiltersAndRender();
}

function hasActiveFilters() {
  return F.platforms.size || F.categories.size || F.brands.size
      || F.priceMin != null || F.priceMax != null || F.search
      || Object.keys(F.specs || {}).length > 0;
}

// ─── FILTERS ────────────────────────────────────────────
// Category label overrides so ugly enum values ("mag_release") read cleanly
// in the sidebar. Anything not in this map falls back to a Title-Case-ish
// transform.
var CATEGORY_LABELS = {
  slide: 'Slides', barrel: 'Barrels', compensator: 'Compensators',
  frame: 'Frame Modules', trigger: 'Triggers',
  light: 'Weapon Lights', optic: 'Optics',
  mag_release: 'Magazine Releases', magwell: 'Magwells',
  basepad: 'Basepads', slide_release: 'Slide Releases',
  safety_selector: 'Safety Selectors', takedown_lever: 'Takedown Levers',
  slide_plate: 'Slide Plates',
};
function catLabel(c) { return CATEGORY_LABELS[c] || (c || '').replace(/_/g, ' ').replace(/\b\w/g, function(m){return m.toUpperCase();}); }

function renderFilters() {
  var s = document.getElementById('sidebar');
  var specsHtml = specsSectionHtml();
  s.innerHTML =
    filterGroupHtml('platform',  'Platform',  platformOptions()) +
    filterGroupHtml('sub_model', 'Sub-model / Variant',
      // Only 2 distinct `family` values in the DB right now ("p365",
      // "universal") — not distinct enough from Platform to be useful yet.
      // TODO: wire this once real sub-model data lands (e.g. P365 vs
      // P365 XMACRO vs P365 X-9, Glock 19 Gen 4 vs Gen 5).
      '<div class="filter-note">Coming soon — currently only stubbed. Filter by Platform for now.</div>') +
    // Category filter moved out of the sidebar into the horizontal .cat-tabs
    // strip above the grid — the primary way to slice the catalog. Keeping
    // both was two controls competing for the same job.
    filterGroupHtml('brand',     'Brand',     brandOptions(), /*scroll*/ true) +
    filterGroupHtml('price',     'Price',     priceHtml()) +
    (specsHtml ? filterGroupHtml('specs', 'Specifications', specsHtml) : '');
  attachFilterHandlers();
  renderSubModelStrip();
  renderCategoryTabs();
  renderSetupStrip();
  renderFitmentBanner();
}

// Horizontal category tabs — single-select. "All" clears the category
// filter entirely; picking a category clears then adds one entry to
// F.categories (kept as a Set so no other code has to change shape).
// Compensators tab is suppressed when the selected sub-model has an
// integrated comp (no aftermarket comp fits), and if that tab was the
// current selection we shift it back to All to avoid a dead view.
function renderCategoryTabs() {
  var el = document.getElementById('cat-tabs');
  if (!el) return;
  var cats = {};
  PRODUCTS.forEach(function (r) { if (r.category) cats[r.category] = true; });
  var list = Object.keys(cats).sort(function (a, b) { return catLabel(a).localeCompare(catLabel(b)); });
  var hideComp = !!(SELECTED_SUBMODEL && SELECTED_SUBMODEL.integrated_comp);
  if (hideComp) {
    list = list.filter(function (c) { return c !== 'compensator'; });
    if (F.categories.has('compensator')) F.categories.delete('compensator');
  }
  var activeCat = F.categories.size === 1 ? Array.from(F.categories)[0] : null;
  var buttons = ['<button type="button" class="cat-tab' + (activeCat == null ? ' active' : '') + '" data-cat="__all">All</button>']
    .concat(list.map(function (c) {
      return '<button type="button" class="cat-tab' + (activeCat === c ? ' active' : '') + '" data-cat="' + escAttr(c) + '">' + esc(catLabel(c)) + '</button>';
    }));
  el.innerHTML = buttons.join('');
  el.querySelectorAll('[data-cat]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var v = btn.getAttribute('data-cat');
      F.categories.clear();
      if (v !== '__all') F.categories.add(v);
      renderFilters(); applyFiltersAndRender();
    });
  });
}

// ─── SETUP / FITMENT ──────────────────────────────────────
// ─── SUB-MODEL ────────────────────────────────────────────
function loadSubModelFromStorage() {
  try {
    var id = localStorage.getItem(LS_SUBMODEL_KEY);
    if (!id) return;
    var g = GUNS.find(function (x) { return x.id === id; });
    if (g) SELECTED_SUBMODEL = g;
  } catch (_) {}
}
function saveSubModelToStorage() {
  try {
    if (SELECTED_SUBMODEL) localStorage.setItem(LS_SUBMODEL_KEY, SELECTED_SUBMODEL.id);
    else                   localStorage.removeItem(LS_SUBMODEL_KEY);
  } catch (_) {}
}
function setSubModel(gunOrNull) {
  SELECTED_SUBMODEL = gunOrNull || null;
  saveSubModelToStorage();
  // Show the fitment banner again — user just changed the constraint,
  // needs to see WHY the grid changed.
  try { sessionStorage.removeItem(LS_BANNER_DISMISSED_KEY); } catch (_) {}
  renderFilters();
  applyFiltersAndRender();
}

// Render the sub-model strip. Silent when zero or multiple platforms are
// active — sub-models are platform-scoped and ambiguous otherwise. Also
// clears a stale SELECTED_SUBMODEL if its platform is no longer active.
function renderSubModelStrip() {
  var wrap = document.getElementById('sub-model-wrap');
  if (!wrap) return;
  if (F.platforms.size !== 1) {
    // Multi-platform or no-platform view: drop any stale sub-model to
    // avoid an invisible constraint on the grid.
    if (SELECTED_SUBMODEL) { SELECTED_SUBMODEL = null; saveSubModelToStorage(); }
    wrap.innerHTML = '';
    return;
  }
  var pid = Array.from(F.platforms)[0];
  var platform = PLATFORMS_BY_ID[pid];
  var models = GUNS.filter(function (g) { return g.platform_id === pid; })
                   .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  if (!models.length) { wrap.innerHTML = ''; return; }
  // If a sub-model is set but its platform no longer matches, clear it.
  if (SELECTED_SUBMODEL && SELECTED_SUBMODEL.platform_id !== pid) {
    SELECTED_SUBMODEL = null; saveSubModelToStorage();
  }
  var activeId = SELECTED_SUBMODEL ? SELECTED_SUBMODEL.id : null;
  var chips = ['<button type="button" class="submodel-chip' + (activeId == null ? ' active' : '') + '" data-submodel="__all">All ' + esc(platform ? platform.name : 'platform') + ' models</button>']
    .concat(models.map(function (g) {
      return '<button type="button" class="submodel-chip' + (activeId === g.id ? ' active' : '') + '" data-submodel="' + escAttr(g.id) + '">' + esc(g.name) + '</button>';
    }));
  wrap.innerHTML = '<div class="submodel-strip"><span class="submodel-label">Sub-model</span>' + chips.join('') + '</div>';
  wrap.querySelectorAll('[data-submodel]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-submodel');
      if (id === '__all') setSubModel(null);
      else                setSubModel(GUNS.find(function (g) { return g.id === id; }) || null);
    });
  });
}

function loadSetupFromStorage() {
  try {
    var raw = localStorage.getItem(LS_SETUP_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object') {
      Object.keys(parsed).forEach(function (cat) {
        // Rehydrate against current PRODUCTS in case a pinned product was
        // discontinued or removed since the last visit.
        var p = PRODUCTS.find(function (r) { return r.id === parsed[cat]; });
        if (p) SETUP[cat] = p;
      });
    }
  } catch (_) { /* private-mode or corrupt payload — silently start fresh */ }
}
function saveSetupToStorage() {
  try {
    var out = {};
    Object.keys(SETUP).forEach(function (cat) { out[cat] = SETUP[cat].id; });
    localStorage.setItem(LS_SETUP_KEY, JSON.stringify(out));
  } catch (_) {}
}
function isMine(productId) {
  var keys = Object.keys(SETUP);
  for (var i = 0; i < keys.length; i++) if (SETUP[keys[i]].id === productId) return true;
  return false;
}
function setAsMine(product) {
  // Max one per category — replaces any prior entry in this category.
  SETUP[product.category] = product;
  saveSetupToStorage();
  // Re-show the dismissed banner if fitment just became active on a
  // category we're currently viewing — user needs to see WHY the filter
  // changed after their action.
  try { sessionStorage.removeItem(LS_BANNER_DISMISSED_KEY); } catch (_) {}
  renderFilters();
  applyFiltersAndRender();
}
function removeFromMine(category) {
  delete SETUP[category];
  saveSetupToStorage();
  renderFilters();
  applyFiltersAndRender();
}

// ─── FITMENT — lifted from parts-builder's compatibility logic and adapted
// to run off SETUP (pinned components) instead of an in-progress build's
// selections. Rules encoded here are the real ones the DB supports:
//   1. Slide ↔ Barrel — matching barrel_length_in + BSR whitelist (if any)
//   2. Slide ↔ Compensator — Rule 4: no comp on integrated_comp slides
//   3. Barrel ↔ Compensator — thread_pitch match + Rule 5: no comp on
//      ported barrels + comp with requires_threaded_barrel needs a
//      threaded/threaded-and-ported barrel type
//   4. Frame ↔ Magwell — MFR whitelist
// Categories not touched by any rule (trigger / optic / light / small parts)
// pass through unrestricted regardless of what's pinned. ────────────────
function isThreadedBarrelType(t) { return t === 'threaded' || t === 'threaded-and-ported'; }

function barrelFitsSlide(barrel, slide) {
  // BSR is a whitelist: empty for a given barrel = universal fit; populated =
  // only listed slide/barrel pairs work. Rule mirrored on both sides so
  // pinning either narrows the other.
  var wl = BSR_BY_BARREL[barrel.id] || [];
  if (!wl.length) return true;
  return wl.some(function (r) { return r.slide_product_id === slide.id; });
}

function slideOk(slide, sel) {
  if (sel.barrel) {
    if (slide.slide_specs && sel.barrel.barrel_specs &&
        slide.slide_specs.barrel_length_in !== sel.barrel.barrel_specs.barrel_length_in) return false;
    if (!barrelFitsSlide(sel.barrel, slide)) return false;
  }
  if (sel.compensator && slide.slide_specs && slide.slide_specs.integrated_comp) return false;
  // Sub-model constraints: OEM barrel + slide dimensions must match.
  // Slides missing the spec fail closed (safer to hide than lie).
  if (SELECTED_SUBMODEL) {
    var s = slide.slide_specs;
    if (SELECTED_SUBMODEL.barrel_length_in != null && s && s.barrel_length_in != null &&
        s.barrel_length_in !== SELECTED_SUBMODEL.barrel_length_in) return false;
    if (SELECTED_SUBMODEL.slide_length_in != null && s && s.slide_length_in != null &&
        s.slide_length_in !== SELECTED_SUBMODEL.slide_length_in) return false;
  }
  return true;
}
function barrelOk(barrel, sel) {
  if (sel.slide) {
    if (barrel.barrel_specs && sel.slide.slide_specs &&
        barrel.barrel_specs.barrel_length_in !== sel.slide.slide_specs.barrel_length_in) return false;
    if (!barrelFitsSlide(barrel, sel.slide)) return false;
  }
  if (sel.compensator && barrel.barrel_specs && barrel.barrel_specs.barrel_type === 'ported') return false;
  if (sel.compensator) {
    var c = sel.compensator.compensator_specs || {};
    var bt = barrel.barrel_specs ? barrel.barrel_specs.barrel_type : null;
    if (c.requires_threaded_barrel && !c.comes_with_barrel && !isThreadedBarrelType(bt)) return false;
    if (c.thread_pitch && barrel.barrel_specs && barrel.barrel_specs.thread_pitch !== c.thread_pitch) return false;
  }
  if (SELECTED_SUBMODEL && SELECTED_SUBMODEL.barrel_length_in != null &&
      barrel.barrel_specs && barrel.barrel_specs.barrel_length_in != null &&
      barrel.barrel_specs.barrel_length_in !== SELECTED_SUBMODEL.barrel_length_in) return false;
  return true;
}
function compensatorOk(comp, sel) {
  var cs = comp.compensator_specs || {};
  if (sel.slide  && sel.slide.slide_specs   && sel.slide.slide_specs.integrated_comp) return false;
  if (sel.barrel && sel.barrel.barrel_specs && sel.barrel.barrel_specs.barrel_type === 'ported') return false;
  if (sel.barrel) {
    var bt = sel.barrel.barrel_specs ? sel.barrel.barrel_specs.barrel_type : null;
    if (cs.requires_threaded_barrel && !cs.comes_with_barrel && !isThreadedBarrelType(bt)) return false;
    if (cs.thread_pitch && sel.barrel.barrel_specs && sel.barrel.barrel_specs.thread_pitch !== cs.thread_pitch) return false;
  }
  return true;
}
function frameOk(frame, sel) {
  if (sel.magwell) {
    var wl = MFR_BY_MAGWELL[sel.magwell.id] || [];
    if (!wl.length || !wl.some(function (r) { return r.frame_product_id === frame.id; })) return false;
  }
  // Sub-model constraint: housing_class must match. Frames without a
  // spec fail closed — frames are one of the most fitment-critical
  // categories, so a missing spec is treated as unknown-not-safe.
  if (SELECTED_SUBMODEL && SELECTED_SUBMODEL.housing_class) {
    var fs = frame.frame_specs;
    if (!fs || fs.housing_class !== SELECTED_SUBMODEL.housing_class) return false;
  }
  return true;
}
function compensatorOkSubmodel(comp) {
  // Standalone: sub-model with integrated_comp rejects every compensator,
  // regardless of pinned setup. Called from matchesFitment's compensator
  // arm and used to hide the Compensators tab entirely.
  if (SELECTED_SUBMODEL && SELECTED_SUBMODEL.integrated_comp) return false;
  return true;
}

// SETUP-free sub-model compat check for the detail-panel badge. Runs the
// same dimensional rules used inside slideOk/barrelOk/frameOk but without
// any of the SETUP-based constraints — the badge is a "does this fit my
// gun" answer, not "does this fit my gun given every other choice I've
// made", so it stays legible when SETUP is empty and doesn't change
// as pins come and go.
function subModelCompat(product, gun) {
  if (!gun) return true;
  var cat = product.category;
  if (cat === 'compensator') return !gun.integrated_comp;
  if (cat === 'frame') {
    if (!gun.housing_class) return true;
    var fs = product.frame_specs;
    return !!(fs && fs.housing_class === gun.housing_class);
  }
  if (cat === 'slide') {
    var s = product.slide_specs;
    if (gun.barrel_length_in != null && s && s.barrel_length_in != null && s.barrel_length_in !== gun.barrel_length_in) return false;
    if (gun.slide_length_in  != null && s && s.slide_length_in  != null && s.slide_length_in  !== gun.slide_length_in)  return false;
    return true;
  }
  if (cat === 'barrel') {
    if (gun.barrel_length_in == null) return true;
    var b = product.barrel_specs;
    if (!b || b.barrel_length_in == null) return true;
    return b.barrel_length_in === gun.barrel_length_in;
  }
  return true;
}
function magwellOk(magwell, sel) {
  if (sel.frame) {
    var wl = MFR_BY_MAGWELL[magwell.id] || [];
    if (!wl.length) return true;   // universal
    return wl.some(function (r) { return r.frame_product_id === sel.frame.id; });
  }
  return true;
}

// Cross-category compat check for a product against the pinned SETUP.
// Returns true when unrestricted (trigger/optic/light/etc.) or when every
// applicable rule accepts.
function matchesFitment(r) {
  switch (r.category) {
    case 'slide':       return slideOk(r, SETUP);
    case 'barrel':      return barrelOk(r, SETUP);
    case 'compensator': return compensatorOkSubmodel(r) && compensatorOk(r, SETUP);
    case 'frame':       return frameOk(r, SETUP);
    case 'magwell':     return magwellOk(r, SETUP);
    default:            return true;
  }
}

// Which pinned components are actively constraining the currently-viewed
// category? Returns [] when nothing is pinned in a related category. Used
// only by the banner — matchesFitment above enforces the actual filter.
function fitmentAffectorsFor(viewCat) {
  var affects = {
    slide:       ['barrel','compensator'],
    barrel:      ['slide','compensator'],
    compensator: ['slide','barrel'],
    frame:       ['magwell'],
    magwell:     ['frame'],
  };
  var out = [];
  Object.keys(SETUP).forEach(function (srcCat) {
    var targets = affects[srcCat] || [];
    if (targets.indexOf(viewCat) !== -1) out.push({ srcCat: srcCat, src: SETUP[srcCat] });
  });
  return out;
}

// Pick one representative spec value per category to show on the setup
// chip — the spec that's most relevant to downstream fitment.
var SETUP_CHIP_HINT = {
  slide:       { source: 'slide_specs',       key: 'optic_cut',        prefix: 'Cut ' },
  barrel:      { source: 'barrel_specs',      key: 'barrel_length_in', suffix: '"' },
  compensator: { source: 'compensator_specs', key: 'thread_pitch',     prefix: 'Thread ' },
  frame:       { source: 'frame_specs',       key: 'housing_class',    prefix: 'Housing ' },
  magwell:     { source: 'magwell_specs',     key: 'model',            prefix: '' },
};

function renderSetupStrip() {
  var wrap = document.getElementById('setup-strip-wrap');
  if (!wrap) return;
  var cats = Object.keys(SETUP);
  if (!cats.length) { wrap.innerHTML = ''; return; }
  var chips = cats.sort().map(function (cat) {
    var p = SETUP[cat];
    var hint = SETUP_CHIP_HINT[cat];
    var specStr = null;
    if (hint) {
      var v = readSpec(p, hint.source, hint.key);
      if (v != null && v !== '' && !(v instanceof Set && !v.size)) {
        specStr = (hint.prefix || '') + String(v) + (hint.suffix || '');
      }
    }
    return '<div class="setup-chip" title="' + escAttr(catLabel(cat)) + '">' +
      '<strong>' + esc(p.brand) + '</strong> ' + esc(p.name) +
      (specStr ? ' <span class="setup-chip-spec">— ' + esc(specStr) + '</span>' : '') +
      '<button type="button" class="setup-chip-x" data-remove-mine="' + escAttr(cat) + '" aria-label="Remove">×</button>' +
    '</div>';
  }).join('');
  wrap.innerHTML = '<div class="setup-strip"><span class="setup-label">My setup</span>' + chips + '</div>';
  wrap.querySelectorAll('[data-remove-mine]').forEach(function (btn) {
    btn.addEventListener('click', function () { removeFromMine(btn.getAttribute('data-remove-mine')); });
  });
}

// Banner surfaces when the currently-viewed category (single-select) has
// pinned components that actively narrow it via fitment rules. Wording
// lists every pinned component that affects the view — real fitment
// applies more than one spec at a time, so a single-key description
// would understate what's happening.
function renderFitmentBanner() {
  var wrap = document.getElementById('fitment-banner-wrap');
  if (!wrap) return;
  if (F.categories.size !== 1) { wrap.innerHTML = ''; return; }
  var viewCat = Array.from(F.categories)[0];

  // Integrated-comp trump card: if the sub-model has integrated_comp and
  // the user is viewing Compensators (which shouldn't be possible via the
  // tabs, but might be via URL restore), explain the empty grid.
  var intCompMsg = null;
  if (viewCat === 'compensator' && SELECTED_SUBMODEL && SELECTED_SUBMODEL.integrated_comp) {
    intCompMsg = 'The <strong>' + esc(SELECTED_SUBMODEL.name) + '</strong> has an integrated compensator — no aftermarket comp will fit.';
  }

  // Sub-model always adds its own constraint on frame/slide/barrel views
  // even without any pinned Setup component.
  var subModelAffects = SELECTED_SUBMODEL && ['frame','slide','barrel','compensator'].indexOf(viewCat) !== -1;
  var affectors = fitmentAffectorsFor(viewCat);
  if (!intCompMsg && !subModelAffects && !affectors.length) { wrap.innerHTML = ''; return; }
  var dismissed = false;
  try { dismissed = sessionStorage.getItem(LS_BANNER_DISMISSED_KEY) === '1'; } catch (_) {}
  if (dismissed) { wrap.innerHTML = ''; return; }

  var parts = [];
  if (subModelAffects) parts.push('your <strong>' + esc(SELECTED_SUBMODEL.name) + '</strong>');
  affectors.forEach(function (a) {
    parts.push('your <strong>' + esc(a.src.brand + ' ' + a.src.name) + '</strong> (' + esc(catLabel(a.srcCat).toLowerCase()) + ')');
  });
  var body = intCompMsg
    ? intCompMsg
    : ('Showing ' + esc(catLabel(viewCat).toLowerCase()) + ' compatible with ' + parts.join(' + ') + '.');

  wrap.innerHTML =
    '<div class="fitment-banner">' +
      '<span class="fitment-banner-icon">ℹ</span>' +
      '<div class="fitment-banner-body">' + body + '</div>' +
      '<button type="button" class="fitment-banner-close" id="fitment-banner-dismiss" aria-label="Dismiss">×</button>' +
    '</div>';
  document.getElementById('fitment-banner-dismiss').addEventListener('click', function () {
    try { sessionStorage.setItem(LS_BANNER_DISMISSED_KEY, '1'); } catch (_) {}
    renderFitmentBanner();
  });
}

function filterGroupHtml(id, title, body, scroll) {
  return '<div class="filter-group" id="fg-' + id + '">' +
    '<div class="filter-title">' + title + '</div>' +
    (scroll ? '<div class="filter-scroll">' + body + '</div>' : body) +
  '</div>';
}

function checkboxOption(name, value, label, count, checked) {
  return '<label class="filter-option">' +
    '<input type="checkbox" name="' + name + '" value="' + escAttr(value) + '"' + (checked ? ' checked' : '') + '/>' +
    '<span>' + esc(label) + '</span>' +
    '<span class="filter-option-count">' + count + '</span>' +
  '</label>';
}

// Each option's count reflects "how many products match ALL currently-active
// filters EXCEPT this filter" — the standard ecom pattern that keeps you
// from clicking an option that instantly returns 0. Cheap on 233 rows.
function optionCount(predicate, excludeKey) {
  var n = 0;
  for (var i = 0; i < PRODUCTS.length; i++) {
    if (predicate(PRODUCTS[i]) && matchesAllExcept(PRODUCTS[i], excludeKey)) n++;
  }
  return n;
}

function platformOptions() {
  var ids = Object.keys(PLATFORMS_BY_ID);
  if (!ids.length) return '<div class="filter-note">No platforms loaded.</div>';
  return ids
    .map(function (id) { return PLATFORMS_BY_ID[id]; })
    .sort(function (a, b) { return a.name.localeCompare(b.name); })
    .map(function (p) {
      var n = optionCount(function (r) { return r.platform_ids.indexOf(p.id) !== -1; }, 'platforms');
      return checkboxOption('platform', p.id, p.name, n, F.platforms.has(p.id));
    }).join('');
}

function categoryOptions() {
  var cats = {};
  PRODUCTS.forEach(function (r) { if (r.category) cats[r.category] = true; });
  var keys = Object.keys(cats).sort(function (a, b) { return catLabel(a).localeCompare(catLabel(b)); });
  return keys.map(function (c) {
    var n = optionCount(function (r) { return r.category === c; }, 'categories');
    return checkboxOption('category', c, catLabel(c), n, F.categories.has(c));
  }).join('');
}

function brandOptions() {
  var byId = {};
  PRODUCTS.forEach(function (r) {
    if (!r.brand_id) return;
    (byId[r.brand_id] = byId[r.brand_id] || { id: r.brand_id, name: r.brand });
  });
  var brands = Object.values(byId).sort(function (a, b) { return a.name.localeCompare(b.name); });
  if (!brands.length) return '<div class="filter-note">No brands loaded.</div>';
  return brands.map(function (b) {
    var n = optionCount(function (r) { return r.brand_id === b.id; }, 'brands');
    return checkboxOption('brand', b.id, b.name, n, F.brands.has(b.id));
  }).join('');
}

function priceHtml() {
  return '<div class="price-range">' +
    '<input type="number" min="0" step="1" placeholder="Min" id="price-min" value="' + (F.priceMin != null ? F.priceMin : '') + '"/>' +
    '<span class="price-dash">–</span>' +
    '<input type="number" min="0" step="1" placeholder="Max" id="price-max" value="' + (F.priceMax != null ? F.priceMax : '') + '"/>' +
  '</div>';
}

// Well-known abbreviations to preserve verbatim after title-case-splitting a
// snake_case key. Anything not in this map gets first-letter-capitalized.
var SPEC_ABBREV = { moa: 'MOA', dlc: 'DLC', tin: 'TiN', fde: 'FDE', usb: 'USB', ir: 'IR',
                    led: 'LED', rmr: 'RMR', rmsc: 'RMSc', acro: 'ACRO', mrds: 'MRDS',
                    ccw: 'CCW', edc: 'EDC', xl: 'XL' };
function specLabel(key) {
  return String(key || '').split('_').map(function (w) {
    var lo = w.toLowerCase();
    if (SPEC_ABBREV[lo]) return SPEC_ABBREV[lo];
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

// The pool of products whose specs feed the Specifications section. Scoped
// by category + platform ONLY (per spec: "only show spec keys relevant to
// the active category"). Not narrowed by brand/price/search or the spec
// filters themselves — otherwise toggling a spec could collapse its own
// option list.
function productsForSpecScope() {
  return PRODUCTS.filter(function (r) {
    if (F.platforms.size  && !r.platform_ids.some(function (id) { return F.platforms.has(id); })) return false;
    if (F.categories.size && !F.categories.has(r.category)) return false;
    return true;
  });
}

// Read one product's value for a given schema entry.
//   source === 'variant': return a Set of unique values across the product's
//     variants — a product with two colors is legitimately in both buckets.
//   otherwise: read the flattened spec-table row directly. Missing = null.
function readSpec(product, source, key) {
  if (source === 'variant') {
    var out = new Set();
    (product.variants || []).forEach(function (v) {
      if (v && v[key] != null && v[key] !== '') out.add(v[key]);
    });
    return out;
  }
  var row = product[source];
  return row ? row[key] : null;
}

// Composite key used for both DOM data-attrs and F.specs so multiple sources
// can share a raw key name (e.g. slide_specs:optic_cut vs variant:optic_cut)
// without colliding — even though the sidebar only shows one at a time.
function specStateKey(schema) { return schema.source + ':' + schema.key; }
function schemaLabel(schema) { return schema.label || specLabel(schema.key); }

// Reverse lookup — schema for a given composite state key. Used by the
// change handler so we don't have to pre-seed F.specs (which caused a
// crash: optionCount runs matchesSpecFilter over hollow pre-seeded
// entries whose .values Set doesn't exist yet).
function schemaForStateKey(stateKey) {
  var all = SPEC_UNIVERSAL_FILTERS.slice();
  Object.keys(SPEC_FILTERS_BY_CATEGORY).forEach(function (cat) {
    all = all.concat(SPEC_FILTERS_BY_CATEGORY[cat]);
  });
  for (var i = 0; i < all.length; i++) {
    if (specStateKey(all[i]) === stateKey) return all[i];
  }
  return null;
}

// Predicate for one active spec filter against one product. Called by
// matchesAllExcept for every entry in F.specs.
function matchesSpecFilter(product, state) {
  if (!state || !state.schema) return true;   // hollow entry = no constraint (defensive)
  var s = state.schema;
  var actual = readSpec(product, s.source, s.key);
  if (state.type === 'strings') {
    // Empty or missing values Set means the user hasn't ticked anything —
    // treat as unconstrained rather than as "match nothing".
    if (!(state.values instanceof Set) || state.values.size === 0) return true;
    if (s.source === 'variant') {
      if (!(actual instanceof Set) || !actual.size) return false;
      var hit = false;
      actual.forEach(function (v) { if (state.values.has(String(v))) hit = true; });
      return hit;
    }
    return actual != null && state.values.has(String(actual));
  }
  if (state.type === 'boolean') {
    if (!state.on) return true;
    return actual === true;
  }
  if (state.type === 'numeric') {
    if (state.min == null && state.max == null) return true;
    var n = typeof actual === 'number' ? actual : (actual == null ? null : Number(actual));
    if (n == null || Number.isNaN(n)) return false;
    if (state.min != null && n < state.min) return false;
    if (state.max != null && n > state.max) return false;
    return true;
  }
  return true;
}

// Builds one filter subgroup per schema entry that has data in the pool.
// Empty return = no Specifications section rendered at all.
function specsSectionHtml() {
  var cat = F.categories.size === 1 ? Array.from(F.categories)[0] : null;
  var schemas = [];
  if (cat && SPEC_FILTERS_BY_CATEGORY[cat]) schemas = schemas.concat(SPEC_FILTERS_BY_CATEGORY[cat]);
  schemas = schemas.concat(SPEC_UNIVERSAL_FILTERS);
  if (!schemas.length) return '';
  var pool = productsForSpecScope();
  if (!pool.length) return '';

  var blocks = [];
  schemas.forEach(function (schema) {
    var stateKey = specStateKey(schema);
    var state = F.specs[stateKey];
    // Discover this key's value shape across the pool.
    var summary = { hasAny: false, values: new Set(), boolTrue: 0, min: Infinity, max: -Infinity };
    pool.forEach(function (r) {
      var v = readSpec(r, schema.source, schema.key);
      if (schema.source === 'variant') {
        if (v && v.size) { summary.hasAny = true; v.forEach(function (x) { summary.values.add(x); }); }
        return;
      }
      if (v == null || v === '') return;
      summary.hasAny = true;
      if (schema.type === 'boolean') { if (v === true) summary.boolTrue++; }
      else if (schema.type === 'numeric') {
        var n = typeof v === 'number' ? v : Number(v);
        if (!Number.isNaN(n)) { summary.min = Math.min(summary.min, n); summary.max = Math.max(summary.max, n); }
      } else {
        summary.values.add(v);
      }
    });
    if (!summary.hasAny) return;

    var body;
    if (schema.type === 'boolean') {
      var checked = !!(state && state.on);
      body = '<label class="filter-option">' +
        '<input type="checkbox" data-spec-composite="' + escAttr(stateKey) + '" data-spec-widget="boolean"' + (checked ? ' checked' : '') + '/>' +
        '<span>Yes</span><span class="filter-option-count">' + summary.boolTrue + '</span>' +
      '</label>';
    } else if (schema.type === 'numeric') {
      var suf = schema.suffix || '';
      body = '<div class="price-range">' +
        '<input type="number" step="any" placeholder="' + summary.min + suf + '" ' +
          'data-spec-composite="' + escAttr(stateKey) + '" data-spec-widget="num-min" value="' + (state && state.min != null ? state.min : '') + '"/>' +
        '<span class="price-dash">–</span>' +
        '<input type="number" step="any" placeholder="' + summary.max + suf + '" ' +
          'data-spec-composite="' + escAttr(stateKey) + '" data-spec-widget="num-max" value="' + (state && state.max != null ? state.max : '') + '"/>' +
      '</div>';
    } else {
      var vals = Array.from(summary.values).sort(function (a, b) { return String(a).localeCompare(String(b)); });
      body = vals.map(function (v) {
        var vStr = String(v);
        var checkedS = !!(state && state.values && state.values.has(vStr));
        // Facet counts: match every OTHER filter but this key, so counts
        // stay accurate even when the user has already ticked something
        // else in the same group.
        var n = optionCount(function (r) {
          var actual = readSpec(r, schema.source, schema.key);
          if (schema.source === 'variant') return actual instanceof Set && actual.has(v);
          return String(actual) === vStr;
        }, '__spec__' + stateKey);
        return '<label class="filter-option">' +
          '<input type="checkbox" data-spec-composite="' + escAttr(stateKey) + '" data-spec-widget="str" data-spec-val="' + escAttr(vStr) + '"' + (checkedS ? ' checked' : '') + '/>' +
          '<span>' + esc(vStr) + '</span><span class="filter-option-count">' + n + '</span>' +
        '</label>';
      }).join('');
    }
    // Only refresh the schema on an EXISTING state entry — never seed a
    // hollow one. A hollow entry (type but no values/on/min/max) would be
    // picked up by matchesSpecFilter mid-render (through optionCount) and
    // crash when it dereferences .values.has on undefined.
    if (state) state.schema = schema;
    blocks.push('<div class="spec-block" data-spec-block="' + escAttr(stateKey) + '"><div class="filter-title">' + esc(schemaLabel(schema)) + '</div>' + body + '</div>');
  });
  return blocks.join('');
}

function attachFilterHandlers() {
  document.querySelectorAll('#sidebar input[type="checkbox"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var group = el.name;    // 'platform' | 'category' | 'brand'
      var setKey = group === 'platform' ? 'platforms' : (group === 'category' ? 'categories' : 'brands');
      if (el.checked) F[setKey].add(el.value);
      else            F[setKey].delete(el.value);
      // Re-render the sidebar so counts on the other filters update to
      // reflect the new active set (standard ecom "faceted" behavior).
      renderFilters();
      applyFiltersAndRender();
    });
  });
  var mn = document.getElementById('price-min');
  var mx = document.getElementById('price-max');
  if (mn) mn.addEventListener('change', function () { F.priceMin = mn.value === '' ? null : Number(mn.value); renderFilters(); applyFiltersAndRender(); });
  if (mx) mx.addEventListener('change', function () { F.priceMax = mx.value === '' ? null : Number(mx.value); renderFilters(); applyFiltersAndRender(); });

  // Spec filters — composite key "source:key". Reading the schema off the
  // pre-populated F.specs[compositeKey].schema lets the change handler stay
  // shape-agnostic.
  document.querySelectorAll('[data-spec-composite]').forEach(function (el) {
    el.addEventListener('change', function () {
      var stateKey = el.getAttribute('data-spec-composite');
      var widget = el.getAttribute('data-spec-widget');
      var state = F.specs[stateKey];
      if (!state) {
        // First user interaction on this key — resolve schema from the
        // composite key and construct the state entry on the fly.
        var sch = schemaForStateKey(stateKey);
        if (!sch) return;
        state = F.specs[stateKey] = { schema: sch, type: sch.type };
        if (sch.type === 'strings') state.values = new Set();
      }
      if (widget === 'str') {
        state.values = state.values || new Set();
        var v = el.getAttribute('data-spec-val');
        if (el.checked) state.values.add(v); else state.values.delete(v);
        if (!state.values.size) delete F.specs[stateKey];
      } else if (widget === 'boolean') {
        if (el.checked) state.on = true;
        else delete F.specs[stateKey];
      } else if (widget === 'num-min' || widget === 'num-max') {
        var side = widget === 'num-min' ? 'min' : 'max';
        state[side] = el.value === '' ? null : Number(el.value);
        if (state.min == null && state.max == null) delete F.specs[stateKey];
      }
      renderFilters(); applyFiltersAndRender();
    });
  });
}

// ─── FILTER PREDICATES ───────────────────────────────────
function matchesAllExcept(r, excludeKey) {
  if (excludeKey !== 'platforms'  && F.platforms.size  && !r.platform_ids.some(function (id) { return F.platforms.has(id); })) return false;
  if (excludeKey !== 'categories' && F.categories.size && !F.categories.has(r.category)) return false;
  if (excludeKey !== 'brands'     && F.brands.size     && !F.brands.has(r.brand_id))     return false;
  if (excludeKey !== 'price'      && F.priceMin != null && (r.price == null || r.price < F.priceMin)) return false;
  if (excludeKey !== 'price'      && F.priceMax != null && (r.price == null || r.price > F.priceMax)) return false;
  if (excludeKey !== 'search'     && F.search          && r._search.indexOf(F.search) === -1) return false;
  // Per-spec-key filters. excludeKey '__spec__<compositeKey>' skips only
  // that one key's own constraint so the sidebar's facet count for that
  // key stays accurate even when partly ticked.
  var specKeys = Object.keys(F.specs || {});
  for (var i = 0; i < specKeys.length; i++) {
    var stateKey = specKeys[i];
    if (excludeKey === '__spec__' + stateKey) continue;
    if (!matchesSpecFilter(r, F.specs[stateKey])) return false;
  }
  // Fitment-chain: pinned setup narrows other categories. Always applied
  // (not gated by excludeKey — the fitment rules don't have their own
  // sidebar option list to keep alive).
  if (!matchesFitment(r)) return false;
  // The favorites-only view is a tab, not a sidebar filter — always apply.
  if (F.favsOnly && !FAVORITES.has(r.id)) return false;
  return true;
}
function matchesAll(r) { return matchesAllExcept(r, null); }

// ─── RENDER GRID ───────────────────────────────────────────
function applyFiltersAndRender() {
  var list = PRODUCTS.filter(matchesAll);
  // Sort — cheap on ≤hundreds of rows; server-side sorting would just add
  // a round-trip for no benefit at this scale.
  if (F.sort === 'price_asc')       list.sort(function (a, b) { return (a.price == null ? Infinity : a.price) - (b.price == null ? Infinity : b.price); });
  else if (F.sort === 'price_desc') list.sort(function (a, b) { return (b.price == null ? -Infinity : b.price) - (a.price == null ? -Infinity : a.price); });
  else if (F.sort === 'brand')      list.sort(function (a, b) { return a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name); });
  else                              list.sort(function (a, b) { return String(b.created_at || '').localeCompare(String(a.created_at || '')); });   // newest
  document.getElementById('result-count').textContent =
    list.length + ' part' + (list.length !== 1 ? 's' : '');
  document.getElementById('clear-filters').disabled = !hasActiveFilters();
  // Fitment banner + setup strip depend on current filter state.
  renderFitmentBanner();

  var container = document.getElementById('grid-container');
  if (!list.length) {
    if (F.favsOnly && CURRENT_USER && FAVORITES.size === 0) {
      container.innerHTML =
        '<div class="empty">' +
          '<div class="empty-title">No favorites yet</div>' +
          '<div>You haven\'t favorited any parts yet — heart a part to save it here.</div>' +
        '</div>';
    } else {
