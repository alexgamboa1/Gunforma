      container.innerHTML =
        '<div class="empty">' +
          '<div class="empty-title">No parts match those filters</div>' +
          '<div>Try clearing a filter or adjusting the price range.</div>' +
        '</div>';
    }
    return;
  }
  container.innerHTML = '<div class="parts-grid">' + list.map(renderCard).join('') + '</div>';
}

function renderCard(r) {
  var isFav = FAVORITES.has(r.id);
  var priceHtml = r.price != null
    ? '<div class="part-card-price">$' + r.price.toFixed(r.price < 100 ? 2 : 0) + '</div>'
    : '<div class="part-card-price na">Price N/A</div>';
  var photoHtml = r.image
    ? '<img src="' + escAttr(r.image) + '" alt="' + escAttr(r.brand + ' ' + r.name) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;part-card-nophoto&quot;>No photo</div>\'"/>'
    : '<div class="part-card-nophoto">No photo</div>';
  // Whole card is clickable; the heart button stopPropagation's so favoriting
  // doesn't open the detail panel. openDetail is delegated (see below) rather
  // than inline so we don't accidentally trigger on the fav-btn click.
  var mineBadge = isMine(r.id) ? '<div class="part-card-mine-badge">MINE</div>' : '';
  // Compact affiliate hero — real street price + retailer + Buy button.
  // Rendered on top of any card that has affiliate data. Skipped silently
  // when the product isn't listed anywhere (no dead untracked link).
  var affHtml = (window.affiliate ? window.affiliate.renderHero(r.id) : '') || '';
  return '<div class="part-card" data-id="' + r.id + '" data-open-detail="1">' +
    '<button type="button" class="fav-btn' + (isFav ? ' active' : '') + '" onclick="event.stopPropagation();toggleFavorite(\'' + r.id + '\',this)" aria-label="' + (isFav ? 'Unfavorite' : 'Favorite') + '" aria-pressed="' + isFav + '">' + (isFav ? '♥' : '♡') + '</button>' +
    mineBadge +
    '<div class="part-card-photo">' + photoHtml +
      (r.category ? '<div class="part-card-cat">' + esc(catLabel(r.category)) + '</div>' : '') +
    '</div>' +
    '<div class="part-card-body">' +
      '<div class="part-card-brand">' + esc(r.brand) + '</div>' +
      '<div class="part-card-name">'  + esc(r.name)  + '</div>' +
      (r.description ? '<div class="part-card-desc">' + esc(r.description) + '</div>' : '') +
      '<div class="part-card-footer">' + priceHtml + '</div>' +
      (affHtml ? '<div onclick="event.stopPropagation();">' + affHtml + '</div>' : '') +
    '</div>' +
  '</div>';
}

// Event delegation: any card click that didn't originate from an interactive
// child (fav button) opens the detail panel. Single listener on the grid
// container survives re-renders (renderCard replaces innerHTML).
document.getElementById('grid-container').addEventListener('click', function (e) {
  var card = e.target.closest('[data-open-detail]');
  if (!card) return;
  openDetail(card.getAttribute('data-id'));
});

// ─── DETAIL SLIDE-OVER ────────────────────────────────────
var DETAIL_STATE = { productId: null, activeVariantIdx: 0 };

function openDetail(productId) {
  var p = PRODUCTS.find(function (x) { return x.id === productId; });
  if (!p) return;
  DETAIL_STATE.productId = productId;
  DETAIL_STATE.activeVariantIdx = 0;
  renderDetail(p);
  var scrim = document.getElementById('detail-scrim');
  var panel = document.getElementById('detail-panel');
  scrim.hidden = false; panel.hidden = false;
  // rAF so the class transition actually plays (browsers coalesce hidden→open
  // in the same frame otherwise and skip the transform animation).
  requestAnimationFrame(function () {
    scrim.classList.add('open');
    panel.classList.add('open');
  });
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  var scrim = document.getElementById('detail-scrim');
  var panel = document.getElementById('detail-panel');
  scrim.classList.remove('open'); panel.classList.remove('open');
  // Wait for the transform out before setting hidden — otherwise it snaps.
  setTimeout(function () {
    scrim.hidden = true; panel.hidden = true;
    document.body.style.overflow = '';
  }, 220);
  DETAIL_STATE.productId = null;
}
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('detail-scrim').addEventListener('click', closeDetail);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && DETAIL_STATE.productId) closeDetail();
});

function renderDetail(p) {
  document.getElementById('detail-eyebrow').textContent = p.category ? catLabel(p.category) : 'Product';
  document.getElementById('detail-brand').textContent = p.brand;
  document.getElementById('detail-title').textContent = p.name;
  document.getElementById('detail-cat-badge-wrap').innerHTML = p.category
    ? '<div class="detail-cat-badge">' + esc(catLabel(p.category)) + '</div>' : '';

  // Sub-model compat badge — only rendered when a sub-model is selected.
  // Recomputes the fitment rules against SELECTED_SUBMODEL in isolation
  // (SETUP is deliberately ignored here — this badge answers "does this
  // fit MY GUN", not "does this fit my gun + all my other parts").
  var compatWrap = document.getElementById('detail-compat-badge-wrap');
  if (SELECTED_SUBMODEL) {
    var applies = ['frame','slide','barrel','compensator'].indexOf(p.category) !== -1;
    if (applies) {
      var ok = subModelCompat(p, SELECTED_SUBMODEL);
      compatWrap.innerHTML = ok
        ? '<div class="detail-compat-badge ok">✓ Compatible with ' + esc(SELECTED_SUBMODEL.name) + '</div>'
        : '<div class="detail-compat-badge no">✗ May not fit '   + esc(SELECTED_SUBMODEL.name) + '</div>';
    } else {
      // Universal-fit categories (trigger, optic, light, small parts) —
      // sub-model doesn't rule on them.
      compatWrap.innerHTML = '<div class="detail-compat-badge na">Universal fit — no ' + esc(SELECTED_SUBMODEL.name) + ' constraint</div>';
    }
  } else {
    compatWrap.innerHTML = '';
  }
  var priceEl = document.getElementById('detail-price');
  if (p.price != null) { priceEl.textContent = '$' + p.price.toFixed(p.price < 100 ? 2 : 0); priceEl.classList.remove('na'); }
  else                  { priceEl.textContent = 'Price N/A';                                  priceEl.classList.add('na'); }
  // Description: keep it simple — split on double-newline into paragraphs.
  var descEl = document.getElementById('detail-desc');
  if (p.description) {
    descEl.innerHTML = String(p.description).split(/\n\n+/).map(function (para) {
      return '<p>' + esc(para.trim()) + '</p>';
    }).join('');
  } else {
    descEl.innerHTML = '<p style="color:#999;">No description available.</p>';
  }

  // Variant image thumbs: only variants that actually have images. Hero
  // starts on the first-image variant (usually the default).
  var variantsWithImg = (p.variants || []).filter(function (v) { return v.primary_image_url; });
  var heroSrc = variantsWithImg[DETAIL_STATE.activeVariantIdx] ? variantsWithImg[DETAIL_STATE.activeVariantIdx].primary_image_url : p.image;
  var heroEl = document.getElementById('detail-hero');
  heroEl.innerHTML = heroSrc
    ? '<img id="detail-hero-img" src="' + escAttr(heroSrc) + '" alt="' + escAttr(p.brand + ' ' + p.name) + '"/>'
    : '<div class="detail-hero-nophoto">No photo</div>';
  var thumbsEl = document.getElementById('detail-thumbs');
  if (variantsWithImg.length > 1) {
    thumbsEl.innerHTML = variantsWithImg.map(function (v, i) {
      return '<button type="button" class="detail-thumb' + (i === DETAIL_STATE.activeVariantIdx ? ' active' : '') + '" data-variant-idx="' + i + '">' +
        '<img src="' + escAttr(v.primary_image_url) + '" alt=""/></button>';
    }).join('');
    thumbsEl.querySelectorAll('[data-variant-idx]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        DETAIL_STATE.activeVariantIdx = Number(btn.getAttribute('data-variant-idx')) || 0;
        renderDetail(p);
      });
    });
  } else {
    thumbsEl.innerHTML = '';
  }

  // Specs table — pulled from the real spec tables + default variant.
  var specsWrap = document.getElementById('detail-specs-wrap');
  var specsBody = document.getElementById('detail-specs-body');
  var rows = detailSpecRows(p);
  if (rows.length) {
    specsBody.innerHTML = rows.map(function (r) {
      return '<tr><th>' + esc(r.label) + '</th><td>' + esc(String(r.value)) + '</td></tr>';
    }).join('');
    specsWrap.hidden = false;
  } else {
    specsWrap.hidden = true;
  }

  // Compatible-with chips
  var platWrap = document.getElementById('detail-platforms-wrap');
  var platChipsEl = document.getElementById('detail-platform-chips');
  var platNames = (p.platform_ids || [])
    .map(function (id) { return PLATFORMS_BY_ID[id] && PLATFORMS_BY_ID[id].name; })
    .filter(Boolean);
  if (platNames.length) {
    platChipsEl.innerHTML = platNames.map(function (n) { return '<span class="detail-platform-chip">' + esc(n) + '</span>'; }).join('');
    platWrap.hidden = false;
  } else {
    platWrap.hidden = true;
  }

  // Affiliate block (hero row + optional variants list + disclosure).
  // Falls back to a muted "No retailer listings" message so the panel
  // never shows a dead untracked link (products.url is deliberately
  // NOT used as a buy link anywhere — it's an untracked manufacturer
  // page that earns zero commission).
  var affWrap = document.getElementById('detail-affiliate-wrap');
  if (window.affiliate) {
    var block = window.affiliate.renderBlock(p.id);
    affWrap.innerHTML = block || window.affiliate.renderEmpty();
  } else {
    affWrap.innerHTML = '';
  }

  // Favorite button
  var favEl = document.getElementById('detail-fav');
  var isFav = FAVORITES.has(p.id);
  favEl.textContent = isFav ? '♥' : '♡';
  favEl.classList.toggle('active', isFav);
  favEl.setAttribute('aria-pressed', String(isFav));
  favEl.onclick = function () { toggleFavoriteFromDetail(p.id); };

  // Add-to-Armory hands the product id off via a URL param; Armory reads
  // ?prefill=<uuid> on load, auto-selects the platform, and adds the part.
  var armoryEl = document.getElementById('detail-armory');
  armoryEl.onclick = function () {
    if (!CURRENT_USER) { toast('Sign in to add parts to a build', 'gunforma-signin.html', 'Sign in'); return; }
    window.location.href = 'gunforma-armory.html?prefill=' + encodeURIComponent(p.id);
  };

  // Set-as-mine — toggles the pinned setup for this category.
  var mineEl = document.getElementById('detail-mine');
  var mine = isMine(p.id);
  mineEl.textContent = mine ? '✓ Marked as mine — click to unset' : '☐ Set as mine (mark as owned)';
  mineEl.classList.toggle('active', mine);
  mineEl.onclick = function () {
    if (isMine(p.id)) { removeFromMine(p.category); toast('Removed from your setup'); }
    else              { setAsMine(p); toast('Marked as mine — related categories now filter to compatible parts'); }
    renderDetail(p);  // repaint button label
  };
}

// Build the detail panel's specs table from the flattened spec tables and
// the default variant. `push(label, val, opts)` skips null/empty values,
// and formats booleans as Yes/No. Numeric suffixes ("$", "\"") are baked
// per row rather than derived from the schema — this table is a display
// grid, not a filter surface, so hard-coded rendering is clearer than a
// data-driven pass.
function detailSpecRows(p) {
  var out = [];
  function push(label, v, opts) {
    if (v == null || v === '') return;
    opts = opts || {};
    var display = typeof v === 'boolean' ? (v ? 'Yes' : 'No')
                : (opts.suffix ? String(v) + opts.suffix : String(v));
    out.push({ label: label, value: display });
  }
  if (p.slide_specs) {
    push('Optic cut',        p.slide_specs.optic_cut);
    push('Barrel length',    p.slide_specs.barrel_length_in, { suffix: '"' });
    push('Slide length',     p.slide_specs.slide_length_in,  { suffix: '"' });
    push('Integrated comp',  p.slide_specs.integrated_comp);
    push('Window cuts',      p.slide_specs.window_cuts);
    push('Serrations',       p.slide_specs.serrations);
    push('Weight (oz)',      p.slide_specs.weight_oz);
  }
  if (p.barrel_specs) {
    push('Barrel length',    p.barrel_specs.barrel_length_in, { suffix: '"' });
    push('Barrel type',      p.barrel_specs.barrel_type);
    push('Thread pitch',     p.barrel_specs.thread_pitch);
    push('Twist rate',       p.barrel_specs.twist_rate);
    push('Material',         p.barrel_specs.material);
  }
  if (p.compensator_specs) {
    push('Thread pitch',     p.compensator_specs.thread_pitch);
    push('Requires threaded barrel', p.compensator_specs.requires_threaded_barrel);
    push('Comes with barrel',        p.compensator_specs.comes_with_barrel);
    push('Chambers',         p.compensator_specs.chambers);
    push('Material',         p.compensator_specs.material);
  }
  if (p.frame_specs) {
    push('Housing class',    p.frame_specs.housing_class);
    push('Grip length',      p.frame_specs.grip_length);
    push('Texture',          p.frame_specs.texture);
    push('Material',         p.frame_specs.material);
    push('Undercut',         p.frame_specs.trigger_guard_undercut);
  }
  if (p.magwell_specs) {
    push('Fits model',       p.magwell_specs.fits_model);
    push('Material',         p.magwell_specs.material);
    push('Flared',           p.magwell_specs.flared);
  }
  // Variant-level attributes (default variant, or first available). Only
  // surface fields that actually vary meaningfully across catalog products.
  var dv = (p.variants || []).find(function (v) { return v.is_default; }) || (p.variants || [])[0];
  if (dv) {
    push('Color',            dv.color);
    push('Finish',           dv.finish);
    // Optic-cut on variants is meaningful for OPTICS (their footprint);
    // for slides the cut lives on slide_specs, so this row is
    // redundant — only render if the product's category is optic.
    if (p.category === 'optic') push('Footprint', dv.optic_cut);
    push('Manual safety',    dv.manual_safety_variant);
    push('Bundle',           dv.bundle);
    push('SKU',              dv.sku);
  }
  return out;
}

// Separate wrapper so the detail-panel's fav button re-renders the detail's
// own heart state in addition to the card + tab counts the shared handler
// already touches.
async function toggleFavoriteFromDetail(productId) {
  var favEl = document.getElementById('detail-fav');
  // Re-use the grid-card handler to keep insert/delete + revert logic in
  // one place. Pass a dummy element so paintFavButton has a target.
  var wasFav = FAVORITES.has(productId);
  await toggleFavorite(productId, favEl);
  // Re-paint the ♥/♡ + aria on the detail button after the handler resolved.
  var nowFav = FAVORITES.has(productId);
  favEl.textContent = nowFav ? '♥' : '♡';
  favEl.classList.toggle('active', nowFav);
  favEl.setAttribute('aria-pressed', String(nowFav));
  // Repaint the card in the grid too (its heart may still show stale state
  // if a re-render didn't fire — the toggle handler does re-paint via the
  // grid path, so this is mostly belt-and-suspenders).
  if (nowFav !== wasFav) applyFiltersAndRender();
}

// ─── FAVORITES ─────────────────────────────────────────────
// Optimistic UI: flip the local Set + repaint one card immediately, then
// insert/delete on the server. On error, revert and toast. Matches the
// pattern in gunforma-builds.html:toggleFire.
window.toggleFavorite = async function (productId, btn) {
  if (!CURRENT_USER) {
    toast('Sign in to save parts', 'gunforma-signin.html', 'Sign in');
    return;
  }
  var wasFav = FAVORITES.has(productId);
  // Optimistic flip
  if (wasFav) FAVORITES.delete(productId); else FAVORITES.add(productId);
  paintFavButton(btn, !wasFav);
  updateTabCounts();
  // If we're on the favorites tab and just un-favorited the last item that
  // was matching, refresh the grid so it disappears.
  if (F.favsOnly && wasFav) applyFiltersAndRender();

  var res;
  try {
    if (wasFav) {
      res = await sb.from('part_favorites').delete().eq('user_id', CURRENT_USER.id).eq('product_id', productId);
    } else {
      res = await sb.from('part_favorites').insert({ user_id: CURRENT_USER.id, product_id: productId });
    }
  } catch (e) { res = { error: e }; }

  if (res && res.error) {
    // Revert
    if (wasFav) FAVORITES.add(productId); else FAVORITES.delete(productId);
    paintFavButton(btn, wasFav);
    updateTabCounts();
    if (F.favsOnly) applyFiltersAndRender();
    console.error('favorite toggle failed', res.error);
    toast('Couldn\'t save — try again');
  }
};

function paintFavButton(btn, isFav) {
  if (!btn) return;
  btn.classList.toggle('active', !!isFav);
  btn.textContent = isFav ? '♥' : '♡';
  btn.setAttribute('aria-pressed', String(!!isFav));
  btn.setAttribute('aria-label', isFav ? 'Unfavorite' : 'Favorite');
}

// ─── UTILITIES ────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function escAttr(s) { return esc(s); }

function showFatal(msg) {
  document.getElementById('grid-container').innerHTML =
    '<div class="empty"><div class="empty-title">Couldn\'t load parts</div><div>' + esc(msg) + '</div></div>';
  document.getElementById('result-count').textContent = '';
}

var _toastTimer = null;
function toast(msg, href, linkText) {
  var el   = document.getElementById('toast');
  var mEl  = document.getElementById('toast-msg');
  var lEl  = document.getElementById('toast-link-wrap');
  mEl.textContent = msg;
  lEl.innerHTML = href ? '<a href="' + escAttr(href) + '">' + esc(linkText || 'Go') + '</a>' : '';
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3500);
}

init();
</script>
