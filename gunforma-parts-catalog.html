<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/favicon-96x96.png?v=12026" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12026" />
<link rel="shortcut icon" href="/favicon.ico?v=12026" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=12026" />
<link rel="manifest" href="/site.webmanifest?v=12026" />
<title>Parts Catalog — Gunforma</title>
<meta name="description" content="Browse the Gunforma parts catalog — filter by platform, category, brand, and price. Favorite parts to save them to your account." />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafaf8; color: #1a1a1a; min-height: 100vh; }

/* NAV — shared nav.js renders into #nav-mount */
.nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 52px; border-bottom: 0.5px solid #2a2b2e; background: #0e0f11; }
.nav-logo { font-size: 15px; font-weight: 600; color: #e8e6e1; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
.nav-logo span { color: #4a9edd; }
.nav-links { display: flex; gap: 28px; }
.nav-link { font-size: 12px; color: #888780; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; transition: color 0.15s; }
.nav-link:hover, .nav-link.active { color: #e8e6e1; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-btn { font-size: 11px; color: #888780; border: 0.5px solid #2a2b2e; padding: 5px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
.nav-btn.cta { color: #4a9edd; border-color: #4a9edd; }

/* PAGE HEADER */
.page-header { max-width: 1400px; margin: 0 auto; padding: 28px 32px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.page-sub   { font-size: 12px; color: #888; margin-top: 4px; }

/* TABS — All parts | My Favorites */
.tab-row { max-width: 1400px; margin: 18px auto 0; padding: 0 32px; display: flex; gap: 4px; border-bottom: 0.5px solid #e5e5e5; }
.tab-btn { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
           padding: 10px 14px; background: transparent; border: none; cursor: pointer; color: #888;
           border-bottom: 2px solid transparent; margin-bottom: -0.5px; transition: color 0.15s, border-color 0.15s; }
.tab-btn:hover { color: #1a1a1a; }
.tab-btn.active { color: #1a1a1a; border-bottom-color: #4a9edd; }
.tab-btn .tab-count { font-size: 11px; color: #999; margin-left: 6px; font-weight: 600; }

/* LAYOUT — sidebar + main */
.catalog { max-width: 1400px; margin: 0 auto; padding: 22px 32px 64px; display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; }
.sidebar { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 18px; }
.main { display: flex; flex-direction: column; gap: 18px; }

/* SEARCH + META BAR */
.search-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 10px 12px; }
.search-input { flex: 1; min-width: 200px; font-family: inherit; font-size: 13px; padding: 8px 12px; border: 0.5px solid #e5e5e5; border-radius: 4px; background: #fafaf8; }
.search-input:focus { outline: none; border-color: #4a9edd; background: #fff; }
.result-count { font-size: 11px; color: #888; }
.clear-filters { font-family: inherit; font-size: 11px; padding: 6px 12px; background: transparent; border: 0.5px solid #d5d3ca; color: #666; border-radius: 4px; cursor: pointer; }
.clear-filters:hover:not(:disabled) { color: #a25334; border-color: #eec2ae; }
.clear-filters:disabled { opacity: 0.4; cursor: not-allowed; }

/* FILTER GROUPS */
.filter-group { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 14px 14px 12px; }
.filter-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1a1a1a; margin-bottom: 10px; }
.filter-option { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; color: #333; cursor: pointer; user-select: none; }
.filter-option input { accent-color: #4a9edd; cursor: pointer; margin: 0; }
.filter-option .filter-option-count { margin-left: auto; font-size: 10.5px; color: #999; }
.filter-scroll { max-height: 220px; overflow-y: auto; padding-right: 4px; }
.filter-scroll::-webkit-scrollbar { width: 6px; }
.filter-scroll::-webkit-scrollbar-thumb { background: #d9d6cc; border-radius: 3px; }
.filter-note { font-size: 10.5px; color: #999; margin-top: 6px; line-height: 1.5; }

.price-range { display: flex; align-items: center; gap: 6px; }
.price-range input { width: 100%; min-width: 0; font-family: inherit; font-size: 12.5px; padding: 6px 8px; border: 0.5px solid #e5e5e5; border-radius: 4px; }
.price-range input:focus { outline: none; border-color: #4a9edd; }
.price-range .price-dash { color: #888; font-size: 12px; }

/* PART CARDS GRID */
.parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.part-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s; position: relative; }
.part-card:hover { border-color: #cfcdc4; transform: translateY(-1px); }
.part-card-photo { position: relative; aspect-ratio: 4/3; background: #f4f3ee; overflow: hidden; }
.part-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.part-card-nophoto { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 10.5px; color: #b8b5ac; letter-spacing: 0.06em; text-transform: uppercase; }
.part-card-cat { position: absolute; top: 8px; left: 8px; font-size: 9px; color: #1d6fb8; background: #eaf4fc; border: 0.5px solid #a7cdec; padding: 3px 7px; border-radius: 20px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.part-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.part-card-brand { font-size: 10px; color: #2a7bbd; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.part-card-name  { font-size: 13.5px; font-weight: 700; line-height: 1.3; color: #1a1a1a; }
.part-card-desc  { font-size: 11px; color: #666; line-height: 1.5; max-height: 3em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.part-card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 0.5px solid #eee; margin-top: auto; }
.part-card-price { font-size: 14px; font-weight: 700; color: #1a1a1a; }
.part-card-price.na { color: #bbb; font-weight: 500; }

/* Favorite (heart) button — sits above the photo, top-right */
.fav-btn { position: absolute; top: 8px; right: 8px; z-index: 2;
           width: 32px; height: 32px; border-radius: 50%;
           background: rgba(255,255,255,0.9); border: 0.5px solid #e5e5e5;
           display: flex; align-items: center; justify-content: center; cursor: pointer;
           font-family: inherit; font-size: 15px; color: #888; padding: 0;
           transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s; }
.fav-btn:hover { background: #fff; color: #d85a30; border-color: #d85a30; }
.fav-btn.active { background: #fff; color: #d85a30; border-color: #d85a30; }
.fav-btn:active { transform: scale(0.9); }

/* EMPTY STATES */
.loading, .empty { padding: 60px 20px; text-align: center; font-size: 13px; color: #888; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; }
.empty-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }

/* TOAST — same visual as builds page */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; font-size: 12px; padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; z-index: 200; pointer-events: none; }
.toast.show { opacity: 1; pointer-events: auto; }
.toast a { color: #6fb4e8; margin-left: 6px; text-decoration: underline; }

/* MOBILE */
@media (max-width: 900px) {
  .catalog { grid-template-columns: 1fr; padding: 18px 16px 48px; gap: 18px; }
  .sidebar { position: static; }
  .page-header { padding: 22px 16px 0; }
  .tab-row { padding: 0 16px; }
  .filter-scroll { max-height: 180px; }
}
</style>
</head>
<body>

<div id="nav-mount" data-nav="full"></div>

<div class="page-header">
  <div>
    <div class="page-title">Parts Catalog</div>
    <div class="page-sub">Browse compatible parts for your pistol platform. Heart parts to save them.</div>
  </div>
</div>

<div class="tab-row" role="tablist">
  <button type="button" class="tab-btn active" id="tab-all" role="tab" aria-selected="true">All parts <span class="tab-count" id="tab-all-count"></span></button>
  <button type="button" class="tab-btn"        id="tab-favs" role="tab" aria-selected="false">My Favorites <span class="tab-count" id="tab-favs-count"></span></button>
</div>

<div class="catalog">
  <aside class="sidebar" id="sidebar">
    <!-- Filter groups injected by renderFilters() so the option counts stay
         accurate as the underlying product list changes. -->
  </aside>
  <div class="main">
    <div class="search-row">
      <input class="search-input" id="search" type="search" placeholder="Search brand, part name, description…" autocomplete="off" />
      <span class="result-count" id="result-count">Loading…</span>
      <button type="button" class="clear-filters" id="clear-filters" disabled>Clear filters</button>
    </div>
    <div id="grid-container">
      <div class="loading">Loading parts…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toast-msg"></span><span id="toast-link-wrap"></span></div>

<div id="footer-mount" data-footer="default"></div>

<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/footer.js"></script>
<script>
// ============================================================
// gunforma-parts-catalog.html — searchable parts DATABASE.
//
// This page was rewritten on 2026-09-09 from a build-configurator into
// a pure browse/search catalog. The old configurator source lives at
// _scratch/parts-catalog-configurator-source.html and will be used as
// the base for the upcoming Armory (build-assembly) page.
//
// Data flow:
//   1. loadEverything() fetches products + variants + brands + platforms
//      + product_platforms + (if signed in) part_favorites — six queries,
//      denormalizes into a flat PRODUCTS array with computed brand/price/
//      image/platform_ids. Client-side filter/sort/render on 233 rows is
//      trivially fast and dodges pagination complexity.
//   2. renderFilters() builds sidebar sections with live option counts.
//   3. applyFiltersAndRender() runs on any filter/search change and
//      re-renders the grid.
//   4. Favoriting is optimistic: toggle local Set + repaint one card,
//      then insert/delete on Supabase, revert on error. Same pattern as
//      toggleFire in gunforma-builds.html.
// ============================================================
var sb = window.sb;

// ─── STATE ────────────────────────────────────────────────
var CURRENT_USER = null;
var PRODUCTS = [];              // denormalized flat rows (see loadEverything)
var PLATFORMS_BY_ID = {};       // {id: {id,name,slug}}
var FAVORITES = new Set();      // product_ids the signed-in user has favorited

// Filter state — everything the sidebar controls.
var F = {
  platforms:  new Set(),        // platform ids
  categories: new Set(),        // category enum values
  brands:     new Set(),        // brand ids
  priceMin:   null,
  priceMax:   null,
  search:     '',
  favsOnly:   false,            // tab-controlled, not a sidebar filter
};

// ─── AUTH ────────────────────────────────────────────────
// Session watchdog — public page, don't redirect on SIGNED_OUT (that
// event fires on the initial auth check for anon visitors too). Just
// refresh nav + favorites state.
sb.auth.onAuthStateChange(function (event, session) {
  var newUser = session ? session.user : null;
  var flipped = (!newUser) !== (!CURRENT_USER);
  CURRENT_USER = newUser;
  if (!newUser) { FAVORITES = new Set(); }
  if (flipped) { loadFavoritesAndRender(); }
});

// ─── LOAD ────────────────────────────────────────────────
async function init() {
  var sess = await sb.auth.getSession();
  CURRENT_USER = sess && sess.data && sess.data.session && sess.data.session.user || null;
  await loadEverything();
  wireControls();
  renderFilters();
  applyFiltersAndRender();
}

async function loadEverything() {
  // brand_id → manufacturer join; product_platforms → junction to platforms;
  // product_variants → source of price + image (default variant preferred).
  var productsQ = sb
    .from('products')
    .select(
      'id, name, description, category, brand_id, lowest_price,' +
      'brands:manufacturers(id, name),' +
      'product_platforms(platform_id),' +
      'product_variants!product_variants_product_id_fkey(msrp, is_default, primary_image_url)'
    )
    .eq('is_discontinued', false);
  var platformsQ = sb.from('platforms').select('id, name, slug').order('name');

  var results = await Promise.all([productsQ, platformsQ]);
  var prodRes = results[0], platRes = results[1];
  if (prodRes.error)  { console.error(prodRes.error);  return showFatal(prodRes.error.message); }
  if (platRes.error)  { console.error(platRes.error);  return showFatal(platRes.error.message); }

  (platRes.data || []).forEach(function (p) { PLATFORMS_BY_ID[p.id] = p; });

  PRODUCTS = (prodRes.data || []).map(function (r) {
    var variants = r.product_variants || [];
    var dv = variants.find(function (v) { return v.is_default; }) || variants[0] || null;
    var price = dv && dv.msrp != null ? Number(dv.msrp)
              : (r.lowest_price != null ? Number(r.lowest_price) : null);
    return {
      id: r.id,
      name: r.name || '',
      description: r.description || '',
      category: r.category,
      brand_id: r.brand_id,
      brand: (r.brands && r.brands.name) || 'Unknown',
      price: price,
      image: (dv && dv.primary_image_url) || null,
      platform_ids: (r.product_platforms || []).map(function (pp) { return pp.platform_id; }),
      // Pre-lowercased search haystack — avoid rebuilding on every keystroke.
      _search: ((r.brands && r.brands.name ? r.brands.name : '') + ' ' + (r.name || '') + ' ' + (r.description || '')).toLowerCase(),
    };
  });

  await loadFavoritesAndRender(/*skipRender*/ true);
}

async function loadFavoritesAndRender(skipRender) {
  if (!CURRENT_USER) { FAVORITES = new Set(); }
  else {
    var res = await sb.from('part_favorites').select('product_id').eq('user_id', CURRENT_USER.id);
    if (res.error) { console.error(res.error); }
    else { FAVORITES = new Set((res.data || []).map(function (r) { return r.product_id; })); }
  }
  updateTabCounts();
  if (!skipRender) applyFiltersAndRender();
}

// ─── CONTROLS ────────────────────────────────────────────
function wireControls() {
  document.getElementById('search').addEventListener('input', function (e) {
    F.search = (e.target.value || '').trim().toLowerCase();
    applyFiltersAndRender();
  });
  document.getElementById('clear-filters').addEventListener('click', clearAllFilters);
  document.getElementById('tab-all').addEventListener('click', function () { setTab(false); });
  document.getElementById('tab-favs').addEventListener('click', function () {
    if (!CURRENT_USER) { toast('Sign in to see your favorites', 'gunforma-signin.html', 'Sign in'); return; }
    setTab(true);
  });
}

function setTab(favsOnly) {
  F.favsOnly = favsOnly;
  document.getElementById('tab-all').classList.toggle('active', !favsOnly);
  document.getElementById('tab-favs').classList.toggle('active', favsOnly);
  document.getElementById('tab-all').setAttribute('aria-selected', String(!favsOnly));
  document.getElementById('tab-favs').setAttribute('aria-selected', String(favsOnly));
  applyFiltersAndRender();
}

function updateTabCounts() {
  document.getElementById('tab-all-count').textContent  = '(' + PRODUCTS.length + ')';
  document.getElementById('tab-favs-count').textContent = CURRENT_USER ? ('(' + FAVORITES.size + ')') : '';
}

function clearAllFilters() {
  F.platforms.clear(); F.categories.clear(); F.brands.clear();
  F.priceMin = null; F.priceMax = null; F.search = '';
  document.getElementById('search').value = '';
  renderFilters();
  applyFiltersAndRender();
}

function hasActiveFilters() {
  return F.platforms.size || F.categories.size || F.brands.size
      || F.priceMin != null || F.priceMax != null || F.search;
}

// ─── FILTERS ────────────────────────────────────────────
// Category label overrides so ugly enum values ("mag_release") read cleanly
// in the sidebar. Anything not in this map falls back to a Title-Case-ish
// transform.
var CATEGORY_LABELS = {
  slide: 'Slides', barrel: 'Barrels', compensator: 'Compensators',
  frame: 'Frame Modules', trigger: 'Triggers',
  light: 'Weapon Lights', optic: 'Optics',
  mag_release: 'Magazine Releases', magwell: 'Magwells',
  basepad: 'Basepads', slide_release: 'Slide Releases',
  safety_selector: 'Safety Selectors', takedown_lever: 'Takedown Levers',
  slide_plate: 'Slide Plates',
};
function catLabel(c) { return CATEGORY_LABELS[c] || (c || '').replace(/_/g, ' ').replace(/\b\w/g, function(m){return m.toUpperCase();}); }

function renderFilters() {
  var s = document.getElementById('sidebar');
  s.innerHTML =
    filterGroupHtml('platform',  'Platform',  platformOptions()) +
    filterGroupHtml('sub_model', 'Sub-model / Variant',
      // Only 2 distinct `family` values in the DB right now ("p365",
      // "universal") — not distinct enough from Platform to be useful yet.
      // TODO: wire this once real sub-model data lands (e.g. P365 vs
      // P365 XMACRO vs P365 X-9, Glock 19 Gen 4 vs Gen 5).
      '<div class="filter-note">Coming soon — currently only stubbed. Filter by Platform for now.</div>') +
    filterGroupHtml('category',  'Category',  categoryOptions()) +
    filterGroupHtml('brand',     'Brand',     brandOptions(), /*scroll*/ true) +
    filterGroupHtml('price',     'Price',     priceHtml());
  attachFilterHandlers();
}

function filterGroupHtml(id, title, body, scroll) {
  return '<div class="filter-group" id="fg-' + id + '">' +
    '<div class="filter-title">' + title + '</div>' +
    (scroll ? '<div class="filter-scroll">' + body + '</div>' : body) +
  '</div>';
}

function checkboxOption(name, value, label, count, checked) {
  return '<label class="filter-option">' +
    '<input type="checkbox" name="' + name + '" value="' + escAttr(value) + '"' + (checked ? ' checked' : '') + '/>' +
    '<span>' + esc(label) + '</span>' +
    '<span class="filter-option-count">' + count + '</span>' +
  '</label>';
}

// Each option's count reflects "how many products match ALL currently-active
// filters EXCEPT this filter" — the standard ecom pattern that keeps you
// from clicking an option that instantly returns 0. Cheap on 233 rows.
function optionCount(predicate, excludeKey) {
  var n = 0;
  for (var i = 0; i < PRODUCTS.length; i++) {
    if (predicate(PRODUCTS[i]) && matchesAllExcept(PRODUCTS[i], excludeKey)) n++;
  }
  return n;
}

function platformOptions() {
  var ids = Object.keys(PLATFORMS_BY_ID);
  if (!ids.length) return '<div class="filter-note">No platforms loaded.</div>';
  return ids
    .map(function (id) { return PLATFORMS_BY_ID[id]; })
    .sort(function (a, b) { return a.name.localeCompare(b.name); })
    .map(function (p) {
      var n = optionCount(function (r) { return r.platform_ids.indexOf(p.id) !== -1; }, 'platforms');
      return checkboxOption('platform', p.id, p.name, n, F.platforms.has(p.id));
    }).join('');
}

function categoryOptions() {
  var cats = {};
  PRODUCTS.forEach(function (r) { if (r.category) cats[r.category] = true; });
  var keys = Object.keys(cats).sort(function (a, b) { return catLabel(a).localeCompare(catLabel(b)); });
  return keys.map(function (c) {
    var n = optionCount(function (r) { return r.category === c; }, 'categories');
    return checkboxOption('category', c, catLabel(c), n, F.categories.has(c));
  }).join('');
}

function brandOptions() {
  var byId = {};
  PRODUCTS.forEach(function (r) {
    if (!r.brand_id) return;
    (byId[r.brand_id] = byId[r.brand_id] || { id: r.brand_id, name: r.brand });
  });
  var brands = Object.values(byId).sort(function (a, b) { return a.name.localeCompare(b.name); });
  if (!brands.length) return '<div class="filter-note">No brands loaded.</div>';
  return brands.map(function (b) {
    var n = optionCount(function (r) { return r.brand_id === b.id; }, 'brands');
    return checkboxOption('brand', b.id, b.name, n, F.brands.has(b.id));
  }).join('');
}

function priceHtml() {
  return '<div class="price-range">' +
    '<input type="number" min="0" step="1" placeholder="Min" id="price-min" value="' + (F.priceMin != null ? F.priceMin : '') + '"/>' +
    '<span class="price-dash">–</span>' +
    '<input type="number" min="0" step="1" placeholder="Max" id="price-max" value="' + (F.priceMax != null ? F.priceMax : '') + '"/>' +
  '</div>';
}

function attachFilterHandlers() {
  document.querySelectorAll('#sidebar input[type="checkbox"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var group = el.name;    // 'platform' | 'category' | 'brand'
      var setKey = group === 'platform' ? 'platforms' : (group === 'category' ? 'categories' : 'brands');
      if (el.checked) F[setKey].add(el.value);
      else            F[setKey].delete(el.value);
      // Re-render the sidebar so counts on the other filters update to
      // reflect the new active set (standard ecom "faceted" behavior).
      renderFilters();
      applyFiltersAndRender();
    });
  });
  var mn = document.getElementById('price-min');
  var mx = document.getElementById('price-max');
  if (mn) mn.addEventListener('change', function () { F.priceMin = mn.value === '' ? null : Number(mn.value); renderFilters(); applyFiltersAndRender(); });
  if (mx) mx.addEventListener('change', function () { F.priceMax = mx.value === '' ? null : Number(mx.value); renderFilters(); applyFiltersAndRender(); });
}

// ─── FILTER PREDICATES ───────────────────────────────────
function matchesAllExcept(r, excludeKey) {
  if (excludeKey !== 'platforms'  && F.platforms.size  && !r.platform_ids.some(function (id) { return F.platforms.has(id); })) return false;
  if (excludeKey !== 'categories' && F.categories.size && !F.categories.has(r.category)) return false;
  if (excludeKey !== 'brands'     && F.brands.size     && !F.brands.has(r.brand_id))     return false;
  if (excludeKey !== 'price'      && F.priceMin != null && (r.price == null || r.price < F.priceMin)) return false;
  if (excludeKey !== 'price'      && F.priceMax != null && (r.price == null || r.price > F.priceMax)) return false;
  if (excludeKey !== 'search'     && F.search          && r._search.indexOf(F.search) === -1) return false;
  // The favorites-only view is a tab, not a sidebar filter — always apply.
  if (F.favsOnly && !FAVORITES.has(r.id)) return false;
  return true;
}
function matchesAll(r) { return matchesAllExcept(r, null); }

// ─── RENDER GRID ───────────────────────────────────────────
function applyFiltersAndRender() {
  var list = PRODUCTS.filter(matchesAll);
  document.getElementById('result-count').textContent =
    list.length + ' part' + (list.length !== 1 ? 's' : '');
  document.getElementById('clear-filters').disabled = !hasActiveFilters();

  var container = document.getElementById('grid-container');
  if (!list.length) {
    if (F.favsOnly && CURRENT_USER && FAVORITES.size === 0) {
      container.innerHTML =
        '<div class="empty">' +
          '<div class="empty-title">No favorites yet</div>' +
          '<div>You haven\'t favorited any parts yet — heart a part to save it here.</div>' +
        '</div>';
    } else {
      container.innerHTML =
        '<div class="empty">' +
          '<div class="empty-title">No parts match those filters</div>' +
          '<div>Try clearing a filter or adjusting the price range.</div>' +
        '</div>';
    }
    return;
  }
  container.innerHTML = '<div class="parts-grid">' + list.map(renderCard).join('') + '</div>';
}

function renderCard(r) {
  var isFav = FAVORITES.has(r.id);
  var priceHtml = r.price != null
    ? '<div class="part-card-price">$' + r.price.toFixed(r.price < 100 ? 2 : 0) + '</div>'
    : '<div class="part-card-price na">Price N/A</div>';
  var photoHtml = r.image
    ? '<img src="' + escAttr(r.image) + '" alt="' + escAttr(r.brand + ' ' + r.name) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;part-card-nophoto&quot;>No photo</div>\'"/>'
    : '<div class="part-card-nophoto">No photo</div>';
  return '<div class="part-card" data-id="' + r.id + '">' +
    '<button type="button" class="fav-btn' + (isFav ? ' active' : '') + '" onclick="toggleFavorite(\'' + r.id + '\',this)" aria-label="' + (isFav ? 'Unfavorite' : 'Favorite') + '" aria-pressed="' + isFav + '">' + (isFav ? '♥' : '♡') + '</button>' +
    '<div class="part-card-photo">' + photoHtml +
      (r.category ? '<div class="part-card-cat">' + esc(catLabel(r.category)) + '</div>' : '') +
    '</div>' +
    '<div class="part-card-body">' +
      '<div class="part-card-brand">' + esc(r.brand) + '</div>' +
      '<div class="part-card-name">'  + esc(r.name)  + '</div>' +
      (r.description ? '<div class="part-card-desc">' + esc(r.description) + '</div>' : '') +
      '<div class="part-card-footer">' + priceHtml + '</div>' +
    '</div>' +
  '</div>';
}

// ─── FAVORITES ─────────────────────────────────────────────
// Optimistic UI: flip the local Set + repaint one card immediately, then
// insert/delete on the server. On error, revert and toast. Matches the
// pattern in gunforma-builds.html:toggleFire.
window.toggleFavorite = async function (productId, btn) {
  if (!CURRENT_USER) {
    toast('Sign in to save parts', 'gunforma-signin.html', 'Sign in');
    return;
  }
  var wasFav = FAVORITES.has(productId);
  // Optimistic flip
  if (wasFav) FAVORITES.delete(productId); else FAVORITES.add(productId);
  paintFavButton(btn, !wasFav);
  updateTabCounts();
  // If we're on the favorites tab and just un-favorited the last item that
  // was matching, refresh the grid so it disappears.
  if (F.favsOnly && wasFav) applyFiltersAndRender();

  var res;
  try {
    if (wasFav) {
      res = await sb.from('part_favorites').delete().eq('user_id', CURRENT_USER.id).eq('product_id', productId);
    } else {
      res = await sb.from('part_favorites').insert({ user_id: CURRENT_USER.id, product_id: productId });
    }
  } catch (e) { res = { error: e }; }

  if (res && res.error) {
    // Revert
    if (wasFav) FAVORITES.add(productId); else FAVORITES.delete(productId);
    paintFavButton(btn, wasFav);
    updateTabCounts();
    if (F.favsOnly) applyFiltersAndRender();
    console.error('favorite toggle failed', res.error);
    toast('Couldn\'t save — try again');
  }
};

function paintFavButton(btn, isFav) {
  if (!btn) return;
  btn.classList.toggle('active', !!isFav);
  btn.textContent = isFav ? '♥' : '♡';
  btn.setAttribute('aria-pressed', String(!!isFav));
  btn.setAttribute('aria-label', isFav ? 'Unfavorite' : 'Favorite');
}

// ─── UTILITIES ────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function escAttr(s) { return esc(s); }

function showFatal(msg) {
  document.getElementById('grid-container').innerHTML =
    '<div class="empty"><div class="empty-title">Couldn\'t load parts</div><div>' + esc(msg) + '</div></div>';
  document.getElementById('result-count').textContent = '';
}

var _toastTimer = null;
function toast(msg, href, linkText) {
  var el   = document.getElementById('toast');
  var mEl  = document.getElementById('toast-msg');
  var lEl  = document.getElementById('toast-link-wrap');
  mEl.textContent = msg;
  lEl.innerHTML = href ? '<a href="' + escAttr(href) + '">' + esc(linkText || 'Go') + '</a>' : '';
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3500);
}

init();
</script>

</body>
</html>
