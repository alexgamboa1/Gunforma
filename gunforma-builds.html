<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafaf8; color: #1a1a1a; min-height: 100vh; }

/* NAV */
.nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 52px; border-bottom: 0.5px solid #2a2b2e; background: #0e0f11; }
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo img { height: 22px; width: auto; display: block; }
.nav-logo img.nav-logo-mark { display: none; }
@media (max-width: 600px) { .nav-logo img.nav-logo-full { display: none; } .nav-logo img.nav-logo-mark { display: block; } }
.nav-links { display: flex; gap: 28px; }
.nav-link { font-size: 12px; color: #ffffff; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; transition: color 0.15s; }
.nav-link:hover, .nav-link.active { color: #ffffff; }
.nav-link.active { border-bottom: 2px solid #4a9edd; padding-bottom: 2px; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-btn { font-size: 11px; color: #ffffff; border: 0.5px solid #2a2b2e; padding: 5px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
.nav-btn.cta { color: #4a9edd; border-color: #4a9edd; }

/* PAGE */
.page { max-width: 1240px; margin: 0 auto; padding: 28px 32px 64px; }
.page-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.page-count { font-size: 12px; color: #666; }

/* FILTER BAR */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; margin-bottom: 22px; }
.filter-label { font-size: 11px; color: #888; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.filter-select { font-family: inherit; font-size: 12px; padding: 6px 24px 6px 10px; border: 0.5px solid #d5d3ca; background: #fafaf8; border-radius: 4px; color: #333; cursor: pointer; min-width: 140px; }
.filter-select:focus { outline: none; border-color: #4a9edd; }
.filter-clear { margin-left: auto; font-family: inherit; font-size: 11px; padding: 6px 12px; background: transparent; border: 0.5px solid #d5d3ca; color: #666; border-radius: 4px; cursor: pointer; }
.filter-clear:hover { color: #a25334; border-color: #eec2ae; }
.filter-clear[disabled] { opacity: 0.4; cursor: not-allowed; }

/* GRID */
.builds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }

/* CARD */
.build-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s; text-decoration: none; color: inherit; }
.build-card:hover { border-color: #cfcdc4; transform: translateY(-1px); }
.build-card-photo { position: relative; aspect-ratio: 16/10; background: #f4f3ee; overflow: hidden; }
.build-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.build-card-nophoto { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 11px; color: #b8b5ac; letter-spacing: 0.06em; }
.build-card-badge { position: absolute; top: 10px; left: 10px; font-size: 9px; color: #1d6fb8; background: #eaf4fc; border: 0.5px solid #a7cdec; padding: 3px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; backdrop-filter: blur(4px); }
.build-card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.build-card-name { font-size: 15px; font-weight: 700; line-height: 1.25; color: #1a1a1a; }
.build-card-author-row { font-size: 11.5px; color: #888; }
.build-card-author-row strong { color: #333; font-weight: 600; }
.build-card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.build-card-tag { font-size: 9px; color: #666; background: #f4f3ee; border: 0.5px solid #e5e2d8; padding: 3px 7px; border-radius: 20px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.build-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 10px; border-top: 0.5px solid #eee; }
.build-card-meta { display: flex; flex-direction: column; gap: 2px; }
.build-card-total { font-size: 13px; font-weight: 700; color: #1a1a1a; }
.build-card-parts { font-size: 10.5px; color: #888; }

/* "Post your build" tile — sits inside .builds-grid as the first item so
   the CTA is inline with the browsable content rather than hovering in
   a banner. Border-radius / bg family / spacing match .build-card so it
   reads as part of the grid, but the dashed border + muted fill mark it
   as an action tile, not a real build. */
.post-tile {
  background: #fafaf8;
  border: 1px dashed #d9d6cc;
  border-radius: 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 28px 20px; gap: 10px;
  text-decoration: none; color: inherit;
  transition: border-color 0.15s, background 0.15s;
  min-height: 240px;   /* fallback when the tile is the only item in a wrap-row */
}
.post-tile:hover { border-color: #4a9edd; background: #f0f6fc; }
.post-tile-icon {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px dashed #cfcdc4;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; line-height: 1; color: #888; font-weight: 400;
  transition: color 0.15s, border-color 0.15s;
}
.post-tile:hover .post-tile-icon { color: #4a9edd; border-color: #4a9edd; }
.post-tile-title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
.post-tile-sub   { font-size: 11.5px; color: #888; line-height: 1.5; max-width: 220px; }

/* Hide the shared nav's "+ Post your build" CTA on this page only — the
   grid tile above IS the primary CTA here, so the nav button is redundant
   noise. Scoped by class so a future .nav-btn (without .cta) is untouched. */
.nav-right .nav-btn.cta { display: none; }
.fire-btn { display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; background: #fafaf8; border: 0.5px solid #d5d3ca; border-radius: 20px; color: #666; cursor: pointer; transition: all 0.15s; }
.fire-btn:hover { border-color: #d85a30; color: #d85a30; }
.fire-btn.fired { background: #faece7; border-color: #d85a30; color: #a25334; }
.fire-btn-icon { display: block; }
.fire-btn.fired .fire-btn-icon { fill: currentColor; }

/* STATES */
.loading, .empty { padding: 60px 20px; text-align: center; font-size: 13px; color: #888; }
.empty-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
.empty-cta { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 700; padding: 8px 14px; color: #fff; background: #2a7bbd; border-radius: 4px; text-decoration: none; }
.empty-cta:hover { background: #1e63a0; }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; font-size: 12px; padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; z-index: 200; pointer-events: none; }
.toast.show { opacity: 1; }
.toast a { color: #6fb4e8; margin-left: 6px; }

/* FOOTER */
.footer-bar { border-top: 0.5px solid #e5e5e5; padding: 16px 36px; display: flex; flex-direction: column; gap: 10px; background: #fafaf8; }
.footer-txt { font-size: 10px; color: #999; letter-spacing: 0.06em; }
.footer-txt a { color: #999; text-decoration: none; }
.footer-txt a:hover { color: #2a7bbd; }

/* MOBILE — under 640px */
@media (max-width: 640px) {
  .page { padding: 20px 16px 48px; }
  .filter-bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .filter-bar .filter-select,
  .filter-bar .filter-clear { width: 100%; margin-left: 0; }
  .builds-grid { grid-template-columns: 1fr; gap: 14px; }
  .footer-bar { padding: 14px 16px; }
}
.nav-toggle { display: none; background: none; border: 0; padding: 8px; margin: 0 -8px 0 0; cursor: pointer; }
.nav-toggle span { display: block; width: 20px; height: 2px; background: #e8e6e1; border-radius: 2px; }
.nav-toggle span + span { margin-top: 4px; }
.nav-profile { display: none; align-items: center; justify-content: center; width: 34px; height: 34px; border: 0.5px solid #2a2b2e; border-radius: 50%; color: #ffffff; text-decoration: none; }
.nav-profile svg { width: 19px; height: 19px; }
.nav-menu { display: none; }
@media (max-width: 820px) {
  .nav-links { display: none; }
  .nav-signin-inline { display: none; }
  .nav-profile { display: flex; }
  .nav-toggle { display: block; }
  .nav-menu { position: absolute; top: 52px; left: 0; right: 0; background: #0e0f11; border-bottom: 0.5px solid #2a2b2e; flex-direction: column; padding: 8px 0; z-index: 99; }
  .nav-menu.open { display: flex; }
  .nav-menu a { padding: 13px 28px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff; text-decoration: none; border-bottom: 0.5px solid #1a1b1e; }
  .nav-menu a.signout { color: #ffffff; }
}
</style>

<div class="page">

<script>
// ============================================================
// SUPABASE
// ============================================================
var sb = window.sb;
var SUPABASE_URL = 'https://lagjjcpclvzrjlrswojt.supabase.co';  // for photoUrl helper below

// Session watchdog: public page — refresh UI state, don't redirect.
// Supabase can fire SIGNED_OUT during the initial auth check for anon
// users; redirecting on that would bounce visitors off the grid.
// Use the callback's `session` param so an INITIAL_SESSION for a signed-in
// user doesn't wipe their state and re-render the grid as anon.
sb.auth.onAuthStateChange(function(event, session) {
  var newUser = session ? session.user : null;
  var wasSignedIn = !!CURRENT_USER;
  CURRENT_USER = newUser;
  if (!newUser) USER_FIRES = new Set();
  if (typeof updateNavAuth === 'function') updateNavAuth();
  // Only re-render on an actual auth change — INITIAL_SESSION firing with
  // the same state we already loaded doesn't need another repaint.
  if ((!newUser) !== (!wasSignedIn)) renderGrid();
});

function photoUrl(path) { return SUPABASE_URL + '/storage/v1/object/public/build-photos/' + path; }
function escH(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============================================================
// STATE
// ============================================================
let CURRENT_USER = null;         // { id, ... } or null
let BUILDS = [];                 // approved builds with joins + computed fields
let USER_FIRES = new Set();      // build ids the current user has fired

// ============================================================
// LOAD
// ============================================================
async function init() {
  const { data: sessData } = await sb.auth.getSession();
  CURRENT_USER = sessData?.session?.user || null;
  await loadBuilds();
}

async function signOut(e) {
  e.preventDefault();
  await sb.auth.signOut();
  location.reload();
}

async function loadBuilds() {
  // Only approved builds are visible to anon by RLS anyway, but keeping the
  // filter explicit makes the intent obvious in the query text.
  const { data, error } = await sb
    .from('builds')
    .select(
      'id,name,tier,activities,description,created_at,parts_snapshot,'+
      'platforms(id,name,slug),'+
      // Two FKs to profiles exist (user_id + reviewed_by via role escalation trigger etc.).
      // Name the author FK explicitly so PostgREST doesn't complain.
      'profiles!builds_user_id_fkey(id,username),'+
      'build_photos(storage_path,thumb_path,is_hero,position),'+
      'build_fires(count)'
    )
    .eq('status', 'approved');

  if (error) { showError('Could not load builds: ' + error.message); return; }

  BUILDS = (data || []).map(function(b) {
    const photos = b.build_photos || [];
    const hero = photos.find(function(p){ return p.is_hero; }) || photos[0] || null;
    const fireCount = Array.isArray(b.build_fires) && b.build_fires[0] ? Number(b.build_fires[0].count) : 0;
    return Object.assign({}, b, {
      _hero: hero,
      _fireCount: fireCount,
      _partsCount: Array.isArray(b.parts_snapshot) ? b.parts_snapshot.length : 0,
      _msrpTotal: null,   // filled in by loadTotals
    });
  });

  await Promise.all([loadTotals(), loadUserFires()]);
  populateFilters();
  renderGrid();
}

// Sum default-variant MSRPs for every catalog-picked part in visible builds.
// One batched query for all products across all visible builds.
async function loadTotals() {
  const refIds = new Set();
  BUILDS.forEach(function(b) {
    (b.parts_snapshot || []).forEach(function(p) { if (p.refId) refIds.add(p.refId); });
  });
  if (!refIds.size) { BUILDS.forEach(function(b){ b._msrpTotal = 0; }); return; }

  const { data, error } = await sb
    // Live variants only. is_default is NOT filtered server-side: a product
    // whose default variant is retired would return no row and drop out of
    // the total silently. Prefer the default in JS, else the first live one.
    .from('product_variants')
    .select('product_id,msrp,is_default')
    .is('retired_at', null)
    .in('product_id', Array.from(refIds));

  if (error) { console.error('loadTotals', error); return; }

  const msrpByProduct = {};
  (data || []).forEach(function(v) {
    if (msrpByProduct[v.product_id] === undefined || v.is_default) {
      msrpByProduct[v.product_id] = Number(v.msrp || 0);
    }
  });

  BUILDS.forEach(function(b) {
    let sum = 0;
    (b.parts_snapshot || []).forEach(function(p) {
      if (p.refId && msrpByProduct[p.refId] != null) sum += msrpByProduct[p.refId];
    });
    b._msrpTotal = sum;
  });
}

async function loadUserFires() {
  if (!CURRENT_USER || !BUILDS.length) return;
  const buildIds = BUILDS.map(function(b){ return b.id; });
  const { data, error } = await sb
    .from('build_fires')
    .select('build_id')
    .eq('user_id', CURRENT_USER.id)
    .in('build_id', buildIds);
  if (error) { console.error('loadUserFires', error); return; }
  USER_FIRES = new Set((data || []).map(function(r){ return r.build_id; }));
}

// ============================================================
// FILTER POPULATION
// ============================================================
function populateFilters() {
  const platforms = {};
  const activities = new Set();
  BUILDS.forEach(function(b) {
    if (b.platforms) platforms[b.platforms.id] = b.platforms.name;
    (b.activities || []).forEach(function(a) { activities.add(a); });
  });

  const platSel = document.getElementById('filter-platform');
  Object.keys(platforms).sort(function(a,b){ return platforms[a].localeCompare(platforms[b]); })
    .forEach(function(id) {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = platforms[id];
      platSel.appendChild(opt);
    });

  const actSel = document.getElementById('filter-activity');
  Array.from(activities).sort().forEach(function(a) {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    actSel.appendChild(opt);
  });
}

// ============================================================
// RENDER
// ============================================================
function filteredBuilds() {
  const platformId = document.getElementById('filter-platform').value;
  const activity   = document.getElementById('filter-activity').value;
  const sort       = document.getElementById('filter-sort').value;

  let out = BUILDS.slice();
  if (platformId) out = out.filter(function(b){ return b.platforms && b.platforms.id === platformId; });
  if (activity)   out = out.filter(function(b){ return (b.activities || []).indexOf(activity) !== -1; });

  switch (sort) {
    case 'fires':      out.sort(function(a,b){ return b._fireCount - a._fireCount; }); break;
    case 'price-high': out.sort(function(a,b){ return (b._msrpTotal || 0) - (a._msrpTotal || 0); }); break;
    case 'price-low':  out.sort(function(a,b){ return (a._msrpTotal || 0) - (b._msrpTotal || 0); }); break;
    default:           out.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
  }
  return out;
}

function renderGrid() {
  const container = document.getElementById('grid-container');
  const list = filteredBuilds();

  document.getElementById('page-count').textContent = list.length ? list.length+' build'+(list.length!==1?'s':'') : '';
  document.getElementById('filter-clear').disabled = !hasActiveFilters();

  if (!BUILDS.length) {
    container.innerHTML =
      '<div class="empty">'+
        '<div class="empty-title">No builds yet</div>'+
        '<div>Be the first to post a build.</div>'+
        '<a class="empty-cta" href="gunforma-post-build-v6.html">Post your build</a>'+
      '</div>';
    return;
  }
  if (!list.length) {
    container.innerHTML =
      '<div class="empty">'+
        '<div class="empty-title">No builds match those filters</div>'+
        '<div>Try changing or clearing your filter selections.</div>'+
      '</div>';
    return;
  }
  // "Post your build" tile lives inline with the browsable content as the
  // first grid item — deliberately NOT rendered in the two empty-state
  // branches above, which have their own contextual CTA.
  const postTile =
    '<a class="post-tile" href="gunforma-post-build-v6.html">' +
      '<div class="post-tile-icon">+</div>' +
      '<div class="post-tile-title">Post your build</div>' +
      '<div class="post-tile-sub">Show off your setup and parts list</div>' +
    '</a>';
  container.innerHTML = '<div class="builds-grid">' + postTile + list.map(renderCard).join('') + '</div>';
}

function renderCard(b) {
  const hero = b._hero;
  const photoHtml = hero
    ? '<img src="'+escH(photoUrl(hero.thumb_path || hero.storage_path))+'" alt=""/>'
    : '<div class="build-card-nophoto">No photo</div>';
  const platform = b.platforms ? b.platforms.name : '';
  const author   = b.profiles ? b.profiles.username : 'unknown';
  const tags = (b.activities || []).slice(0, 3).map(function(a) {
    return '<span class="build-card-tag">'+escH(a)+'</span>';
  }).join('');
  const total = b._msrpTotal != null && b._msrpTotal > 0
    ? '$'+Number(b._msrpTotal).toFixed(0)
    : '—';
  const parts = b._partsCount+' part'+(b._partsCount!==1?'s':'');
  const fired = USER_FIRES.has(b.id);

  // Click on the fire button must NOT navigate to the build detail — the
  // whole card is a link, so we intercept the click and stop propagation.
  const fireBtn =
    '<button class="fire-btn'+(fired?' fired':'')+'" title="Like" onclick="event.preventDefault();event.stopPropagation();toggleFire(\''+b.id+'\',this)">'+
      '<svg class="fire-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'+
      '<span class="fire-btn-count">'+b._fireCount+'</span>'+
    '</button>';

  return '<a class="build-card" href="gunforma-build-detail.html?id='+encodeURIComponent(b.id)+'">'+
      '<div class="build-card-photo">'+photoHtml+
        (platform ? '<div class="build-card-badge">'+escH(platform)+'</div>' : '')+
      '</div>'+
      '<div class="build-card-body">'+
        '<div class="build-card-name">'+escH(b.name)+'</div>'+
        '<div class="build-card-author-row">by <strong>'+escH(author)+'</strong> · '+formatRelDate(b.created_at)+'</div>'+
        (tags ? '<div class="build-card-tags">'+tags+'</div>' : '')+
        '<div class="build-card-footer">'+
          '<div class="build-card-meta">'+
            '<div class="build-card-total">'+total+'</div>'+
            '<div class="build-card-parts">'+parts+'</div>'+
          '</div>'+
          fireBtn+
        '</div>'+
      '</div>'+
    '</a>';
}

function formatRelDate(iso) {
  const d = new Date(iso), now = Date.now(), diff = (now - d.getTime()) / 1000;
  if (diff < 60)      return 'just now';
  if (diff < 3600)    return Math.floor(diff/60)   +'m ago';
  if (diff < 86400)   return Math.floor(diff/3600) +'h ago';
  if (diff < 604800)  return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function hasActiveFilters() {
  return document.getElementById('filter-platform').value ||
         document.getElementById('filter-activity').value ||
         document.getElementById('filter-sort').value !== 'newest';
}

window.onFilterChange = function() { renderGrid(); };
window.clearFilters = function() {
  document.getElementById('filter-platform').value = '';
  document.getElementById('filter-activity').value = '';
  document.getElementById('filter-sort').value = 'newest';
  renderGrid();
};

// ============================================================
// FIRE / UNFIRE
// ============================================================
window.toggleFire = async function(buildId, btn) {
  if (!CURRENT_USER) {
    showToast('Sign in to like builds', 'gunforma-signin.html');
    return;
  }
  const build = BUILDS.find(function(b){ return b.id === buildId; });
  if (!build) return;

  const wasFired = USER_FIRES.has(buildId);
  // Optimistic UI
  if (wasFired) { USER_FIRES.delete(buildId); build._fireCount = Math.max(0, build._fireCount - 1); }
  else          { USER_FIRES.add(buildId);    build._fireCount++; }
  btn.classList.toggle('fired', !wasFired);
  btn.querySelector('.fire-btn-count').textContent = build._fireCount;

  const call = wasFired
    ? sb.from('build_fires').delete().eq('build_id', buildId).eq('user_id', CURRENT_USER.id)
    : sb.from('build_fires').insert({ build_id: buildId, user_id: CURRENT_USER.id });

  const { error } = await call;
  if (error) {
    // Revert optimistic change
    if (wasFired) { USER_FIRES.add(buildId);    build._fireCount++; }
    else          { USER_FIRES.delete(buildId); build._fireCount = Math.max(0, build._fireCount - 1); }
    btn.classList.toggle('fired', wasFired);
    btn.querySelector('.fire-btn-count').textContent = build._fireCount;
    showToast('Could not update — try again');
    console.error('toggleFire', error);
  }
};

// ============================================================
// UI helpers
// ============================================================
function showError(msg) { document.getElementById('grid-container').innerHTML = '<div class="empty"><div class="empty-title">Error</div><div>'+escH(msg)+'</div></div>'; }
function showToast(msg, linkHref) {
  const t = document.getElementById('toast');
  t.innerHTML = escH(msg) + (linkHref ? ' <a href="'+escH(linkHref)+'">Sign in →</a>' : '');
  t.classList.add('show');
  clearTimeout(window._ttoast);
  window._ttoast = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

init();
</script>
