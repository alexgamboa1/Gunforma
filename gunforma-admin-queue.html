function selectBuild(id) {
  if (ADD.buildId && ADD.buildId !== id) resetAdd(null);
  selectedId = id;
  renderQueue();
  var b = BUILDS.find(function(x){ return x.id===id; });
  if (b) { markReviewed(b); renderDetail(b); }
}

// ── build photo lightbox ──────────────────────────────────────────────────
// DETAIL_PHOTOS is the selected build's full-size photo URLs, hero first,
// rewritten by renderDetail. The lightbox keeps its OWN copy from the moment
// it opens: the panel re-renders under an open lightbox whenever the queue
// re-checks a build, and the reviewer should go on paging through the photos
// they opened rather than have the list swapped mid-look.
var DETAIL_PHOTOS = [];
var LIGHTBOX_PHOTOS = [];
var LIGHTBOX_INDEX = 0;
var LIGHTBOX_RETURN_FOCUS = null;   // the photo button that opened it

function showLightboxPhoto(i) {
  var n = LIGHTBOX_PHOTOS.length;
  if (!n) return;
  LIGHTBOX_INDEX = (i + n) % n;      // previous on the first wraps to the last
  var img = document.getElementById('photo-lightbox-img');
  img.src = LIGHTBOX_PHOTOS[LIGHTBOX_INDEX];
  img.alt = 'Build photo ' + (LIGHTBOX_INDEX + 1) + ' of ' + n;
  document.getElementById('photo-lightbox-count').textContent = n > 1 ? (LIGHTBOX_INDEX + 1) + ' / ' + n : '';
  // One photo has nowhere to page to; the arrows would be controls that do nothing.
  document.getElementById('photo-lightbox-prev').hidden = n < 2;
  document.getElementById('photo-lightbox-next').hidden = n < 2;
}

function openPhotoLightbox(index, trigger) {
  if (!DETAIL_PHOTOS.length) return;
  LIGHTBOX_PHOTOS = DETAIL_PHOTOS.slice();
  LIGHTBOX_RETURN_FOCUS = trigger || null;
  document.getElementById('photo-lightbox').hidden = false;
  showLightboxPhoto(index);
  document.getElementById('photo-lightbox-close').focus();
}

function closePhotoLightbox() {
  var box = document.getElementById('photo-lightbox');
  if (box.hidden) return;
  box.hidden = true;
  // Dropping the src stops a large photo decoding in the background and means
  // the next open cannot flash the previous one.
  document.getElementById('photo-lightbox-img').removeAttribute('src');
  // The button may be gone — the panel can have re-rendered while the
  // lightbox was open — so only hand focus back to one still in the page.
  if (LIGHTBOX_RETURN_FOCUS && document.contains(LIGHTBOX_RETURN_FOCUS)) LIGHTBOX_RETURN_FOCUS.focus();
  LIGHTBOX_RETURN_FOCUS = null;
}

// Bound once. The photo buttons are delegated from #detail-panel because its
// innerHTML is rewritten on every select; the lightbox itself is static.
(function bindPhotoLightbox() {
  document.getElementById('detail-panel').addEventListener('click', function (e) {
    var btn = e.target.closest('.detail-photo-btn');
    if (!btn) return;
    openPhotoLightbox(parseInt(btn.getAttribute('data-photo-index'), 10) || 0, btn);
  });
  var box = document.getElementById('photo-lightbox');
  box.addEventListener('click', function (e) {
    if (e.target.closest('#photo-lightbox-prev')) { showLightboxPhoto(LIGHTBOX_INDEX - 1); return; }
    if (e.target.closest('#photo-lightbox-next')) { showLightboxPhoto(LIGHTBOX_INDEX + 1); return; }
    // The dark surround and the close button both close. A click on the
    // photo itself does not — that is where a reviewer rests the pointer.
    if (e.target === box || e.target.closest('#photo-lightbox-close')) closePhotoLightbox();
  });
  document.addEventListener('keydown', function (e) {
    if (box.hidden) return;
    if (e.key === 'Escape') { closePhotoLightbox(); }
    else if (e.key === 'ArrowLeft')  { showLightboxPhoto(LIGHTBOX_INDEX - 1); }
    else if (e.key === 'ArrowRight') { showLightboxPhoto(LIGHTBOX_INDEX + 1); }
    else if (e.key === 'Tab') {
      // Keep Tab inside the dialog: without this it walks into the queue
      // behind the overlay, where the focused control cannot be seen.
      var stops = [].slice.call(box.querySelectorAll('button')).filter(function (b) { return !b.hidden; });
      var first = stops[0], last = stops[stops.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();

function renderDetail(b) {
  var isPending    = b.status==='pending';
  var platformName = b.platforms ? b.platforms.name : 'Unknown pistol';
  var username      = b.profiles ? b.profiles.username : 'unknown';
  currentDetailUser = username;
  currentDetailName = b.name;

  var photos  = b.build_photos || [];
  var hero    = photos.find(function(p){ return p.is_hero; }) || photos[0];
  var gallery = photos.filter(function(p){ return p !== hero; });

  // The lightbox's list for this build, hero first and then the rest in
  // position order — the same order they are drawn in below, so the index on
  // each button is its place in this array. Always the full-size file
  // (storage_path), never the thumbnail: the point of opening one is to see
  // what the builder actually uploaded.
  DETAIL_PHOTOS = (hero ? [hero] : []).concat(gallery).map(function (p) {
    return photoUrl(p.storage_path);
  });
  function photoBtnAttrs(i) {
    return ' data-photo-index="'+i+'" aria-label="Photo '+(i+1)+' of '+DETAIL_PHOTOS.length+' — view full size"';
  }

  // Reorder controls on pending and live builds — the same two statuses as
  // the part actions and + Add a photo. See "photo order" by doReorder below.
  var canOrder = (b.status === 'pending' || b.status === 'approved') && gallery.length > 0;
  var heroHtml = hero
    ? '<button type="button" class="detail-photo-hero detail-photo-btn"'+photoBtnAttrs(0)+'><img src="'+escH(photoUrl(hero.storage_path))+'" alt="" /></button>'
    : '<div class="detail-photo-hero">No hero photo</div>';
  var thumbsHtml = gallery.length
    ? '<div class="detail-photo-thumbs">'+gallery.map(function(p, i){
        // thumb_path can be null on a photo whose thumbnail never generated;
        // the bare column then rendered a broken image at ".../null".
        var tile = '<button type="button" class="detail-photo-thumb detail-photo-btn"'+photoBtnAttrs(i+1)+'><img src="'+escH(photoUrl(p.thumb_path || p.storage_path))+'" alt="" loading="lazy" /></button>';
        if (canOrder) {
          var dis = REORDERING ? ' disabled' : '';
          tile += '<div class="photo-tile-controls">'+
            '<button type="button" class="photo-ctl"'+(i===0?' disabled':dis)+' onclick="doReorder(\''+b.id+'\',\''+p.id+'\',\'left\')" title="Move earlier" aria-label="Move photo '+(i+2)+' earlier">◀</button>'+
            '<button type="button" class="photo-ctl hero-ctl"'+dis+' onclick="doReorder(\''+b.id+'\',\''+p.id+'\',\'hero\')" title="Swap with the hero photo">Make hero</button>'+
            '<button type="button" class="photo-ctl"'+(i===gallery.length-1?' disabled':dis)+' onclick="doReorder(\''+b.id+'\',\''+p.id+'\',\'right\')" title="Move later" aria-label="Move photo '+(i+2)+' later">▶</button>'+
          '</div>';
        }
        return '<div class="photo-tile">'+tile+'</div>';
      }).join('')+'</div>'
    : '';
  var addPhotoHtml = addPhotoControlHtml(b, photos.length);

  var parts = b.parts_snapshot || [];
  // Pending and live builds, whoever owns them. A reviewer's change is
  // written into parts_snapshot itself and logged in edit_history; the
  // builder sees the log on their build page ("What Gunforma changed") and
  // gets one notification once the build is live
  // (supabase/migrations_archive/admin_part_changes.sql). A rejected build is the builder's
  // to fix and resubmit, so it is left alone here.
  var canChange = b.status === 'pending' || b.status === 'approved';
  var partsHtml;
  if (!parts.length) {
    partsHtml = '<div class="no-parts-note">No parts listed — minimum build.'+(canChange ? ' Add one below, or approve or reject based on photos and description.' : '')+'</div>';
  } else {
    partsHtml = '<div class="simple-parts-list">'+parts.map(function(p, i) {
      var history = partHistory(b, i);
      // What the part IS: the stored row. Corrections are written into it,
      // so there is nothing to lay over it — the history below is a record,
      // not a patch. (Corrections used to live only in edit_history, and the
      // public page went on showing the uncorrected name.)
      var dCat   = p.category;
      var dBrand = p.brand;
      var dName  = p.name;
      // The builder's free-text variant/colour note.
      var dVar   = p.variant;
      var key = b.id+'-'+i;
      var isEditOpen = editOpenKey === key;
      var isRemoveOpen = removeOpenKey === key;

      var actionsHtml = canChange
        ? '<button class="btn-edit-inline" onclick="doToggleEdit(\''+b.id+'\','+i+')">'+(isEditOpen?'Close':'Edit')+'</button>'+
          '<button class="btn-remove-inline" onclick="doToggleRemove(\''+b.id+'\','+i+')">'+(isRemoveOpen?'Keep':'Remove')+'</button>'
        : '';

      var historyHtml = history.length
        ? '<div class="part-edit-history">'+history.map(function(h) {
            var contestedTag = h.status==='contested' ? '<span class="contested-tag">⚠ Contested</span>' : '';
            return '<div><strong>'+escH(h.field)+'</strong> corrected: "'+escH(h.from_value)+'" → "'+escH(h.to_value)+'" — '+escH(h.edited_by)+', '+relTime(h.edited_at)+
              (h.reason ? ' · <em>'+escH(h.reason)+'</em>' : '')+contestedTag+'</div>';
          }).join('')+'</div>'
        : '';

      // A catalog part's brand and name ARE the product it links to. Typing
      // a different name over it would leave a row that says one part and
      // links to another, so those two are read-only here: the fix for a
      // wrong catalog part is Remove + Add.
      var isCatalog = !!p.refId;
      var ro = isCatalog ? ' readonly' : '';
      var editPanelHtml = isEditOpen
        ? '<div class="part-edit-panel open">'+
            '<div class="part-edit-grid">'+
              '<div><label class="part-edit-label" for="pe-cat-'+key+'">Section</label>'+sectionSelectHtml('pe-cat-'+key, dCat, false)+'</div>'+
              '<div><label class="part-edit-label" for="pe-brand-'+key+'">Brand</label><input class="part-edit-input" type="text" id="pe-brand-'+key+'" value="'+escH(dBrand)+'"'+ro+' /></div>'+
            '</div>'+
            '<div><label class="part-edit-label" for="pe-name-'+key+'">Part name</label><input class="part-edit-input" type="text" id="pe-name-'+key+'" value="'+escH(dName)+'"'+ro+' /></div>'+
            (isCatalog ? '<div class="part-edit-note">Catalog part: brand and name come from the catalog. If it is the wrong part, remove it and add the right one.</div>' : '')+
            '<div style="margin-top:8px;"><label class="part-edit-label" for="pe-variant-'+key+'">Variant / colour note</label><input class="part-edit-input" type="text" maxlength="60" id="pe-variant-'+key+'" value="'+escH(dVar)+'" /></div>'+
            '<div style="margin-top:8px;"><label class="part-edit-label" for="pe-reason-'+key+'">Note for the builder (optional)</label><input class="part-edit-input" type="text" maxlength="140" id="pe-reason-'+key+'" placeholder="e.g. Model name corrected, per the comments" /></div>'+
            '<div class="part-edit-actions">'+
              '<button class="btn-edit-save" onclick="doSaveEdit(\''+b.id+'\','+i+')">Save correction →</button>'+
              '<button class="btn-edit-close" onclick="doToggleEdit(\''+b.id+'\','+i+')">Cancel</button>'+
            '</div>'+
            changeAudienceHtml(b)+
          '</div>'
        : '';

      var removePanelHtml = isRemoveOpen
        ? '<div class="part-remove-panel">'+
            '<label class="part-edit-label" for="pe-rm-'+key+'">Why is it coming off? (shown to the builder)</label>'+
            '<input class="part-edit-input" type="text" maxlength="140" id="pe-rm-'+key+'" placeholder="e.g. Listed twice · Not on this gun · Wrong part" oninput="refreshRemoveBtn(\''+key+'\')" />'+
            '<div class="part-edit-actions">'+
              '<button class="btn-remove-confirm" id="pe-rm-btn-'+key+'" disabled onclick="doRemovePart(\''+b.id+'\','+i+')">Remove part</button>'+
              '<button class="btn-edit-close" onclick="doToggleRemove(\''+b.id+'\','+i+')">Cancel</button>'+
            '</div>'+
            changeAudienceHtml(b)+
          '</div>'
        : '';

      // Thumbnail from the default variant's primary_image_url. Hand-typed
      // pending parts have no refId → fallback slot lets the admin see at a
      // glance which rows need catalog cross-checking.
      var thumbUrl = p.refId ? IMAGE_BY_PRODUCT_ID[p.refId] : null;
      var alt = ((dBrand ? dBrand+' ' : '') + (dName || '')).replace(/"/g, '&quot;');
      var thumbHtml = thumbUrl
        ? '<div class="simple-part-thumb"><img src="'+thumbUrl+'" alt="'+alt+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;simple-part-thumb-fallback&quot;>No photo</div>\'"/></div>'
        : '<div class="simple-part-thumb"><div class="simple-part-thumb-fallback">'+(p.pending?'Pending':'No photo')+'</div></div>';

      return '<div class="simple-part-row">'+
        '<div class="simple-part-main">'+
          thumbHtml +
          '<div class="simple-part-cat">'+escH(window.BuildCategories.categoryLabel(dCat)||'—')+'</div>'+
          '<div><div class="simple-part-name">'+escH(dName||'Unnamed part')+(p.pending?'<span class="simple-part-pending-tag">Pending catalog review</span>':'')+(history.length?'<span class="edited-flag">Edited</span>':'')+(addedByReviewer(b, p)?'<span class="edited-flag">Added by Gunforma</span>':'')+'</div>'+
          '<div class="simple-part-brand">'+escH(dBrand||'')+
            (dVar ? '<span class="simple-part-variant">'+escH(dVar)+'</span>' : '')+'</div>'+
          // The builder's details, as the public page will show them. A
          // reviewer reads these before approving: they are public text.
          (p.details ? '<div class="simple-part-details">'+escH(p.details)+'</div>' : '')+'</div>'+
        '</div>'+
        '<div class="simple-part-actions">'+actionsHtml+'</div>'+
        catalogActionsHtml(b, p, i, history)+
        editPanelHtml+
        removePanelHtml+
        historyHtml+
      '</div>';
    }).join('')+'</div>';
  }
  if (canChange) partsHtml += addPartHtml(b);
  var changesHtml = changesLogHtml(b);
  var consentHtml = '<div class="consent-row">'+
    '<span class="consent-item">Legal confirmed: <strong>'+(b.legal_confirmed?'Yes':'No')+'</strong></span>'+
    '<span class="consent-item">Content license confirmed: <strong>'+(b.content_license_confirmed?'Yes':'No')+'</strong></span>'+
    (b.builder_agreement_version ? '<span class="consent-item">Agreement version: <strong>'+escH(b.builder_agreement_version)+'</strong></span>' : '')+
  '</div>';

  var approveNotif = 'Hi <strong>'+escH(username)+'</strong>, your build <strong>"'+escH(b.name)+'"</strong> has been approved and is now live on Gunforma. Thanks for contributing.'+
    (PartIds.changes(b).length && b.user_id && !(currentAdmin && currentAdmin.id === b.user_id)
      ? ' <em>If parts were changed here since they were last told, a second notification lists those changes; only they can see it.</em>' : '');

  var reviewedBanner = '';
  if (b.status==='approved') reviewedBanner='<div class="reviewed-banner approved"><div><div class="rb-text">Approved — Build is live</div><div class="rb-sub">Reviewed '+relTime(b.reviewed_at)+' · <a href="'+buildPath(b.id, b.name)+'" target="_blank" style="color:inherit;">View public page →</a></div></div><button class="btn-undo" onclick="doUndo(\''+b.id+'\')">Undo</button></div>';
  if (b.status==='rejected') reviewedBanner='<div class="reviewed-banner rejected"><div><div class="rb-text">Rejected — '+escH(b.rejection_reason||'')+'</div><div class="rb-sub">Reviewed '+relTime(b.reviewed_at)+'</div></div><button class="btn-undo" onclick="doUndo(\''+b.id+'\')">Undo</button></div>';

  // WHO CAN EDIT THIS BUILD, said out loud, because the answer differs and
  // an admin staring at a wrong parts list needs to know which it is:
  //
  //   no owner  — posted from gunforma-admin-post.html and not claimed. Only
  //               an admin can change it, so the whole-build editor is
  //               offered here. (It was offered nowhere: the per-part "Edit"
  //               below writes a correction, it cannot add a part or a
  //               photo, and Undo only moved the build back to pending.)
  //   an owner  — theirs to edit, not ours, except the parts list: a
  //               reviewer can correct, add and remove parts below, on a
  //               pending or a live build, and every one of those is logged
  //               and shown to the builder. While it is pending they can
  //               still change it themselves; every write here re-checks
  //               for that (ensureUnchanged). Once it is live they are
  //               limited to name, description and activity.
  var unowned = !b.user_id;
  var editBuildHtml = unowned
    ? '<div class="detail-edit">'+
        '<a class="btn-catalog primary" href="gunforma-post-build.html?id='+encodeURIComponent(b.id)+'&mode=edit">Edit build →</a>'+
        '<div class="catalog-reason">Posted from the admin page and not claimed, so only an admin can edit it. Parts, photos and details; the status stays '+escH(b.status)+'.</div>'+
      '</div>'
    : (isPending
      ? '<div class="detail-edit"><div class="catalog-reason">'+escH(username)+' can still edit this build while it is in review. Every action here re-checks it first — if it changed, the queue reloads and asks you to look again. Part changes you make are shown to '+escH(username)+' once the build is live.</div></div>'
      : (b.status==='approved'
        ? '<div class="detail-edit"><div class="catalog-reason">Live: '+escH(username)+' can change the name, description and activity. You can correct, add or remove parts below — sparingly: '+escH(username)+' is notified and sees every change. For photos, use Undo.</div></div>'
        : ''));

  var html =
    '<div class="detail-content">'+
    '<div class="detail-top"><div>'+
      '<div class="detail-eyebrow">'+(unowned ? 'Posted by an admin · not claimed' : 'Submitted by '+escH(username))+' · '+relTime(b.created_at)+'</div>'+
      '<div class="detail-title">'+escH(b.name)+'</div>'+
      '<div class="detail-submeta">'+
        '<span class="detail-submeta-item"><strong>'+escH(platformName)+'</strong></span>'+
        gunModelHtml(b.id)+
        '<span class="detail-submeta-item">'+(b.activities||[]).map(escH).join(', ')+'</span>'+
        '<span class="tier-badge '+b.tier+'">'+b.tier+' build</span>'+
      '</div>'+
    '</div>'+editBuildHtml+'</div>'+
    reviewedBanner+
    '<div class="detail-section"><div class="detail-section-title">Photos ('+photos.length+')</div><div class="detail-photos">'+heroHtml+thumbsHtml+addPhotoHtml+'</div></div>'+
    '<div class="detail-section"><div class="detail-section-title">Description</div><div class="detail-desc">'+(b.description?escH(b.description):'<span style="color:#bbb">No description provided.</span>')+'</div></div>'+
    '<div class="detail-section"><div class="detail-section-title">Consent</div>'+consentHtml+'</div>'+
    '<div class="detail-section"><div class="detail-section-title">Parts ('+parts.length+')</div>'+partsHtml+'</div>'+
    changesHtml;

  if (isPending) {
    html +=
      '<div class="detail-section"><div class="review-card">'+
        '<div class="review-card-title">Final decision</div>'+
        '<div class="review-card-sub">Review the photos, description, and parts above, then approve or reject.</div>'+
        '<div class="review-actions-row">'+
          '<button class="btn-approve" onclick="doApprove(\''+b.id+'\')">Approve &amp; publish →</button>'+
          '<button class="btn-reject" onclick="openRejectForm()">Reject with reason</button>'+
        '</div>'+
        '<div class="reject-form" id="reject-form">'+
          '<label class="reject-form-label">Select a reason</label>'+
          '<div class="reject-reasons">'+
          ['No photos uploaded','Blurry or unusable photos','No parts listed','Incomplete description','Possible prohibited content','Custom parts need verification'].map(function(r){
            return '<label class="reject-reason"><input type="radio" name="rr" value="'+escH(r)+'" onchange="updateNotifPreview(this.value)" /> '+r+'</label>';
          }).join('')+
          '</div>'+
          '<textarea class="reject-note" id="reject-note" placeholder="Optional — add a specific note for the user…"></textarea>'+
          '<div class="reject-row">'+
            '<button class="btn-reject-confirm" onclick="doReject(\''+b.id+'\')">Confirm rejection →</button>'+
            '<button class="btn-reject-cancel" onclick="closeRejectForm()">Cancel</button>'+
          '</div>'+
        '</div>'+
        '<div class="notif-preview"><div class="notif-preview-label">Preview — what '+escH(username)+' would see once notifications are built</div>'+
        '<div class="notif-preview-body" id="notif-text">'+approveNotif+'</div></div>'+
      '</div></div>';
  }

  // Delete is offered for every status, not just pending: test posts,
  // duplicates and takedown requests are mostly already approved.
  html += dangerZoneHtml(b);

  html += '</div>';
  document.getElementById('detail-panel').innerHTML = html;
}

// Delete, behind a typed confirmation. The expected name rides on a data
// attribute rather than being interpolated into an onclick string — build
// names are user-supplied and contain quotes and apostrophes often enough
// that string-building the handler would break on exactly the builds an
// admin most wants to remove.
function dangerZoneHtml(b) {
  var photoCount = (b.build_photos || []).length;
  var fileCount  = (b.build_photos || []).reduce(function (n, p) {
    return n + (p.storage_path ? 1 : 0) + (p.thumb_path ? 1 : 0);
  }, 0);

  return '<div class="detail-section"><div class="danger-zone">'+
    '<div class="danger-zone-title">Danger zone</div>'+
    '<div class="danger-zone-sub">Deleting is permanent and cannot be undone from this page. '+
      'Use it for test posts, duplicates and takedown requests — to take a live build off the '+
      'site without destroying it, use <code>Undo</code> to move it back to pending instead.</div>'+
    '<button class="btn-delete" onclick="openDeleteForm()">Delete this build…</button>'+
    '<div class="delete-form" id="delete-form">'+
      '<label class="delete-form-label">This will permanently delete</label>'+
      '<div class="delete-cascade-list">'+
        '• the build row<br>'+
        '• its ' + photoCount + ' photo record(s), and ' + fileCount + ' file(s) from storage<br>'+
        '• every comment, vote, like, saved-build entry and notification attached to it'+
      '</div>'+
      '<label class="delete-form-label">Type the build name to confirm</label>'+
      '<div class="danger-zone-sub" style="margin-bottom:8px;"><code>'+escH(b.name||'')+'</code></div>'+
      '<input class="delete-confirm-input" id="delete-confirm-input" type="text" autocomplete="off" '+
        'placeholder="Build name" data-expect="'+escH((b.name||'').trim())+'" oninput="refreshDeleteBtn()" />'+
      '<div class="reject-row">'+
        '<button class="btn-delete-confirm" id="delete-confirm-btn" disabled onclick="doDelete(\''+b.id+'\')">Delete permanently</button>'+
        '<button class="btn-delete-cancel" onclick="closeDeleteForm()">Cancel</button>'+
      '</div>'+
    '</div>'+
  '</div></div>';
}

function openDeleteForm() {
  var f = document.getElementById('delete-form');
  if (f) f.classList.add('open');
  var i = document.getElementById('delete-confirm-input');
  if (i) i.focus();
}
function closeDeleteForm() {
  var f = document.getElementById('delete-form');
  if (f) f.classList.remove('open');
  var i = document.getElementById('delete-confirm-input');
  if (i) i.value = '';
  refreshDeleteBtn();
}
// Exact match on the trimmed name. Not case-insensitive and not a prefix:
// the point of a typed confirmation is that it cannot be satisfied by
// reflex, and a build called "Test" sitting next to "test 2" is exactly the
// pair this is meant to keep apart.
function refreshDeleteBtn() {
  var i = document.getElementById('delete-confirm-input');
  var btn = document.getElementById('delete-confirm-btn');
  if (!i || !btn) return;
  btn.disabled = i.value.trim() !== (i.dataset.expect || '');
}

// ============================================================
// ACTIONS — real updates to builds.status, gated by the
// admin-only RLS policy and stamped server-side by the DB trigger.
// ============================================================
// A BUILD IN REVIEW HAS TWO WRITERS, and this page is the slow one.
//
// A builder can edit their build while it is pending (gunforma-post-build
// .html, edit mode). This page loads once and then sits open, so every write
// it makes is made against a copy that may be minutes old:
//
//   Approve              would publish a description, a parts list or a
//                        photo swapped in after the reviewer last looked.
//   Reject               would reject, for the old reason, a build the
//                        builder fixed a moment ago.
//   Save correction,     address a part by its INDEX in parts_snapshot. If
//   Link to existing     the builder removed an earlier part, index 2 is a
//                        different part now, and the correction or the
//                        catalog link lands on it. No error anywhere.
//
// So each of them goes through ensureUnchanged() first, and the two that
// write the builds row directly are also conditional on updated_at.
//
// WHAT "UNCHANGED" IS COMPARED WITH: REVIEWED[id], the build as the reviewer
// was last SHOWN it and told about it — not BUILDS, the copy in memory.
// The difference is the whole point. loadBuilds() runs after every action
// on this page and silently swaps fresh rows into BUILDS, so comparing with
// BUILDS would let "save a correction, then approve" publish whatever the
// builder changed in between: fresh would be compared with fresh.
// REVIEWED moves in exactly three places, each of them a moment the
// reviewer is knowingly looking at new content:
//   selectBuild()        they opened the build
//   ensureUnchanged()    it refused, said so, and re-rendered the pane
//   doLink()             their own link changed the parts
var REVIEWED = {};   // build id -> reviewSignature() of what was shown
function markReviewed(b) { if (b) REVIEWED[b.id] = reviewSignature(b); }

// ── + Add a photo ───────────────────────────────────────────────────────
// For a builder who asks for another photo on a build they already posted
// (they send it; we put it up). Pending and live builds, whoever owns them —
// the same two statuses the part actions cover. A rejected build is the
// builder's to fix.
//
// ADD ONLY. No remove, replace or re-order from here: those stay the
// builder's (Undo → they edit → approve again), for the reason the editor
// keeps admins out of owned builds — a silent rewrite of someone's photos.
// Adding is what they asked for and can be undone by them.
//
// What makes it safe without a migration, all checked against the live
// database on 2026-10-19:
//   - RLS "Admins can add photos to any build" (is_admin()) admits the row
//   - storage: the object goes under the ADMIN's uid, because
//     build_photos_owner_insert requires the first segment to be auth.uid().
//     That path is also the record of who added it.
//   - row user_id = the build's OWNER, so the owner policies let them delete
//     it later like any of their own photos. An unowned build gets the
//     admin's id as the placeholder, exactly as gunforma-admin-post.html
//     does, and launch-invite moves it to the builder with the rest.
//   - trg_enforce_build_photo_limit refuses a fifth photo; the button is
//     hidden at four so that refusal is a backstop, not the UI.
//
// NOT LOGGED, NOT NOTIFIED. It is not written to edit_history and the
// builder gets no notification: notify_build_changes() skips kinds it does
// not know, and the builder asked for this, so the reply to them is a
// person's job. Logging it properly means a 'photo_added' kind in
// edit_history, PartIds.changeText(), the build page and the trigger.
var ADDING_PHOTO = null;   // build id while one is in flight
var MAX_BUILD_PHOTOS = 4;  // trg_enforce_build_photo_limit

function addPhotoControlHtml(b, count) {
  if (b.status !== 'pending' && b.status !== 'approved') return '';
  if (count >= MAX_BUILD_PHOTOS) {
    return '<div class="photo-add-row"><span class="photo-add-note">'+MAX_BUILD_PHOTOS+' of '+MAX_BUILD_PHOTOS+
      ' photos — the most a build can hold. Swapping one out is the builder\'s call.</span></div>';
  }
  var busy = ADDING_PHOTO === b.id;
  var who = b.user_id
    ? (b.status === 'approved'
        ? 'Goes live on the build straight away. Removing it later takes an Undo, like any photo on a live build. The builder is not notified.'
        : 'The builder can remove it like any of their own photos. They are not notified.')
    : 'Nobody owns this build yet — it moves to the builder with the others when they claim it.';
  return '<div class="photo-add-row">'+
      '<button type="button" class="btn-add-photo" id="btn-add-photo"'+(busy ? ' disabled' : '')+' onclick="pickBuildPhoto(\''+b.id+'\')">'+
        (busy ? 'Adding photo…' : '+ Add a photo')+'</button>'+
      '<span class="photo-add-note">'+(MAX_BUILD_PHOTOS - count)+' slot'+(MAX_BUILD_PHOTOS - count === 1 ? '' : 's')+' left. '+who+'</span>'+
      '<input type="file" id="add-photo-input" accept="image/jpeg,image/png,image/webp" hidden onchange="onBuildPhotoPicked(this, \''+b.id+'\')" />'+
    '</div>';
}

function pickBuildPhoto(id) {
  if (ADDING_PHOTO) return;
  var input = document.getElementById('add-photo-input');
  if (input) { input.value = ''; input.click(); }
}

function onBuildPhotoPicked(input, id) {
  var file = input.files && input.files[0];
  input.value = '';
  if (file) doAddPhoto(id, file);
}

function rerenderSelected(id) {
  if (selectedId !== id) return;
  var b = BUILDS.find(function(x){ return x.id===id; });
  if (b) renderDetail(b);
}

async function doAddPhoto(id, file) {
  if (ADDING_PHOTO) return;
  // Checked before the redact modal so nobody blurs a photo for a build
  // that has moved, and again after it, right before the write.
  if (!await ensureUnchanged(id, 'add the photo')) return;

  ADDING_PHOTO = id;
  rerenderSelected(id);
  var up = null;
  try {
    up = await PhotoUploader.uploadOne(file, { ownerId: currentAdmin.id, folder: id, prefix: 'added' });
    if (!up) return;                                   // cancelled in the redact modal
    if (up.error) { showToast('red', up.error); up = null; return; }

    var fresh = await ensureUnchanged(id, 'add the photo');
    if (!fresh) { await discardUpload(up); up = null; return; }
    var existing = fresh.build_photos || [];
    if (existing.length >= MAX_BUILD_PHOTOS) {
      await discardUpload(up); up = null;
      showToast('red', 'This build already has ' + MAX_BUILD_PHOTOS + ' photos — nothing was added');
      return;
    }
    var nextPos = existing.reduce(function (m, p) { return Math.max(m, p.position || 0); }, 0) + 1;

    const { data: row, error } = await sb.from('build_photos').insert({
      build_id: id,
      user_id: fresh.user_id || currentAdmin.id,
      storage_path: up.path,
      thumb_path: up.thumbPath,
      is_hero: !existing.some(function (p) { return p.is_hero; }),
      position: nextPos,
    }).select('id').maybeSingle();
    if (error || !row) {
      console.error(error);
      await discardUpload(up); up = null;
      showToast('red', 'Could not add the photo' + (error && error.message ? ' — ' + error.message : '') + '. Nothing was added.');
      return;
    }
    up = null;   // attached now; never discard it

    await loadBuilds();
    // Their own change, so the pane they are now looking at is what they
    // were shown — the next Approve must not refuse over it.
    markReviewed(BUILDS.find(function(x){ return x.id===id; }));
    showToast('green', fresh.status === 'approved' ? 'Photo added — it is live on the build' : 'Photo added');
  } finally {
    if (up && !up.error) await discardUpload(up);
    ADDING_PHOTO = null;
    rerenderSelected(id);
  }
}

// ── photo order ─────────────────────────────────────────────────────────
// ◀ / ▶ swaps a gallery photo with its neighbour; "Make hero" swaps it with
// the hero. Order everywhere on the site — the build page, the home cards,
// the queue, the OG image — is "hero first, then the rest by position", so
// writing is_hero and position is the whole change. The write renumbers ALL
// of the build's photos 1..n in the new order (hero = 1), which also
// normalises any legacy duplicate positions instead of working around them.
//
// Same policy shape as + Add a photo: "Admins can edit any build photo"
// (UPDATE, is_admin()) admits the writes, and the path-tampering trigger
// only guards storage_path/thumb_path/build_id/user_id — position and
// is_hero are exactly the columns it leaves to the policies. No migration.
// Not logged to edit_history: arrangement, not content — the photos the
// builder posted are all still the photos, in a different order. If that
// ever feels wrong in practice, it logs the same way an add would.
//
// The writes are one UPDATE per row that changes (at most 4) rather than a
// database function, DEMOTIONS FIRST: build_photos_one_hero_per_build is a
// unique partial index (one is_hero per build), so the old hero must lose
// the flag before the new hero gains it — promote-first is refused with a
// unique violation, which is exactly how this shipped broken the first
// time. (The index never showed up in a pg_constraint dump; a standalone
// unique index lives only in pg_indexes.) A failure partway through can
// leave a half-applied order — at worst briefly NO hero, which every
// reader falls back from deterministically (hero || first by position),
// and never two. The error path reloads, says so, and one more click
// finishes the job.
var REORDERING = false;

async function doReorder(id, photoId, how) {
  if (REORDERING || ADDING_PHOTO) return;
  var fresh = await ensureUnchanged(id, 'reorder the photos');
  if (!fresh) return;

  var all     = (fresh.build_photos || []).slice().sort(function(x,y){ return (x.position||0) - (y.position||0) || String(x.id).localeCompare(String(y.id)); });
  var hero    = all.find(function(p){ return p.is_hero; }) || all[0];
  var gallery = all.filter(function(p){ return p !== hero; });
  var ordered = (hero ? [hero] : []).concat(gallery);   // displayed order, hero first
  var from    = ordered.findIndex(function(p){ return p.id === photoId; });
  if (from < 1) return;   // gone, or already the hero — the pane was stale either way

  var to = how === 'hero' ? 0 : how === 'left' ? from - 1 : from + 1;
  if (to < 0 || to >= ordered.length || to === from) return;
  var tmp = ordered[to]; ordered[to] = ordered[from]; ordered[from] = tmp;

  // Every row that changes, demotions (is_hero -> false) before the one
  // promotion, so the unique hero index never sees two.
  var writes = [];
  for (var i = 0; i < ordered.length; i++) {
    var want = { is_hero: i === 0, position: i + 1 };
    if (ordered[i].is_hero !== want.is_hero || ordered[i].position !== want.position) {
      writes.push({ row: ordered[i], want: want });
    }
  }
  writes.sort(function (a, b) { return (a.want.is_hero ? 1 : 0) - (b.want.is_hero ? 1 : 0); });

  REORDERING = true;
  rerenderSelected(id);
  try {
    for (var w = 0; w < writes.length; w++) {
      var row = writes[w].row;
      const { data: wrote, error } = await sb.from('build_photos').update(writes[w].want).eq('id', row.id).select('id');
      if (error || !wrote || wrote.length !== 1) {
        console.error('reorder write failed on', row.id, error);
        await loadBuilds();
        markReviewed(BUILDS.find(function(x){ return x.id===id; }));
        showToast('red', 'The new order only partly saved — reloaded. Check it and try again.');
        return;
      }
    }
    await loadBuilds();
    // Their own change: the pane now shows what they were shown, so the next
    // Approve must not refuse over it (position is in reviewSignature now).
    markReviewed(BUILDS.find(function(x){ return x.id===id; }));
    showToast('green', how === 'hero' ? 'Hero photo changed' : 'Photo order saved');
  } finally {
    REORDERING = false;
    rerenderSelected(id);
  }
}

// Objects that never got a row. Say so if they could not be removed —
// orphaned, unpublished bytes, but bytes nonetheless.
async function discardUpload(up) {
  var ok = await PhotoUploader.removeUploaded(up);
  if (!ok) console.warn('add photo: uploaded files could not be removed', up);
}

// Re-reads the build and returns the fresh row, or null after saying why
// not. `verb` finishes the sentence the reviewer reads ("…then approve.").
async function ensureUnchanged(id, verb) {
  var seen = BUILDS.find(function(x){ return x.id===id; });
  if (!seen) return null;

  const { data: fresh, error } = await sb.from('builds').select(BUILD_FIELDS).eq('id', id).maybeSingle();
  if (error) { console.error(error); showToast('red','Could not re-check the build — nothing was changed'); return null; }
  if (!fresh) {
    showToast('red','This build no longer exists — queue reloaded');
    await loadBuilds();
    return null;
  }

  var statusMoved = fresh.status !== seen.status;
  var shown = REVIEWED[id] || reviewSignature(seen);
  if (statusMoved || reviewSignature(fresh) !== shown) {
    await loadBuilds();
    // They are being told, and the pane now shows the new version — so this
    // is what they have been shown. Without it the next click would refuse
    // again, forever.
    markReviewed(BUILDS.find(function(x){ return x.id===id; }));
    showToast('red', statusMoved
      ? 'This build is no longer ' + seen.status + ' — queue reloaded. Nothing was changed.'
      : 'This build was edited after you opened it — reloaded. Review it again, then ' + verb + '.');
    return null;
  }
  return fresh;
}

// Both steps, because they catch different things:
//   1. ensureUnchanged() compares content, which is the one that sees a
//      photo change (a photo row can change without touching builds).
//   2. the UPDATE is conditional on status and on the updated_at that
//      re-read returned, and counts the rows it wrote. This closes the gap
//      between the re-read and the write for anything on the builds row.
async function doApprove(id) {
  const fresh = await ensureUnchanged(id, 'approve');
  if (!fresh) return;

  const { data: approved, error } = await sb.from('builds')
    .update({ status: 'approved' })
    .eq('id', id)
    .eq('status', 'pending')
    .eq('updated_at', fresh.updated_at)
    .select('id');
  if (error) { console.error(error); showToast('red','Something went wrong'); return; }
  if (!Array.isArray(approved) || approved.length !== 1) {
    showToast('red','This build changed while you were approving it — reloaded. Nothing was approved.');
    await loadBuilds();
    return;
  }
  showToast('green','Build approved');
  await loadBuilds();
}
async function doReject(id) {
  var sel = document.querySelector('input[name="rr"]:checked');
  if (!sel) { showToast('red','Select a rejection reason first'); return; }
  var note = document.getElementById('reject-note').value.trim();
  var reason = sel.value + (note ? ' — ' + note : '');

  // After the form is read: a refusal re-renders the pane and the form with it.
  const fresh = await ensureUnchanged(id, 'reject');
  if (!fresh) return;

  const { data: rejected, error } = await sb.from('builds')
    .update({ status: 'rejected', rejection_reason: reason })
    .eq('id', id)
    .eq('status', 'pending')
    .eq('updated_at', fresh.updated_at)
    .select('id');
  if (error) { console.error(error); showToast('red','Something went wrong'); return; }
  if (!Array.isArray(rejected) || rejected.length !== 1) {
    showToast('red','This build changed while you were rejecting it — reloaded. Nothing was rejected.');
    await loadBuilds();
    return;
  }
  showToast('red','Build rejected');
  await loadBuilds();
}
async function doUndo(id) {
  const { error } = await sb.from('builds').update({ status: 'pending' }).eq('id', id);
  if (error) { console.error(error); showToast('red','Something went wrong'); return; }
  showToast('blue','Moved back to pending');
  await loadBuilds();
}

// Permanent delete, covered by the "Admins can delete any build" RLS policy
// (DELETE on builds, using is_admin(), to authenticated).
//
// Everything that references builds cascades — build_photos, build_comments,
// build_fires, notifications and saved_builds are all ON DELETE CASCADE — so
// no foreign key can block this and no child rows are left behind. Storage
// objects are the exception: nothing in the database knows about them, so
// they are removed here by hand.
async function doDelete(id) {
  var b = BUILDS.find(function(x){ return x.id===id; });
  if (!b) return;

  var input = document.getElementById('delete-confirm-input');
  var typed = ((input && input.value) || '').trim();
  if (typed !== (b.name || '').trim()) {
    showToast('red','Type the build name exactly to confirm');
    return;
  }

  var btn = document.getElementById('delete-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }

  // Collect the storage paths BEFORE deleting. build_photos cascades away
  // with the build, and once those rows are gone nothing records where the
  // files were — an orphan nobody can name is an orphan nobody can clean up.
  var paths = [];
  (b.build_photos || []).forEach(function(p) {
    if (p.storage_path) paths.push(p.storage_path);
    if (p.thumb_path)   paths.push(p.thumb_path);
  });

  // Row first, files second. The other order risks deleting the photos of a
  // build that then survives the delete, and a live build with broken images
  // is worse than an orphaned object in a bucket.
  //
  // .select('id') so the DELETE returns what it removed. An RLS-filtered
  // DELETE matches zero rows and reports no error, so checking only `error`
  // would show "deleted" for a build that is still there — the same check
  // gunforma-admin-post.html's rollback makes, for the same reason.
  const { data: deleted, error } = await sb.from('builds').delete().eq('id', id).select('id');
  if (error) {
    console.error(error);
    if (btn) { btn.disabled = false; btn.textContent = 'Delete permanently'; }
    showToast('red', 'Delete failed — ' + (error.code ? error.code + ': ' : '') + (error.message || 'see console'));
    return;
  }
  if (!Array.isArray(deleted) || deleted.length !== 1) {
    // No error and no row: RLS refused it. Nothing was deleted, and no files
    // have been touched yet, so there is nothing to clean up.
    console.error('delete matched no rows', { id: id, returned: deleted });
    if (btn) { btn.disabled = false; btn.textContent = 'Delete permanently'; }
    showToast('red', 'Delete refused — no row was removed (admin policy?). Nothing was changed.');
    return;
  }

  // Files. The build is already gone at this point, so a failure here is
  // reported rather than treated as a failed delete.
  var orphans = [];
  var storageErr = null;
  if (paths.length) {
    const { error: sErr } = await sb.storage.from('build-photos').remove(paths);
    if (sErr) { storageErr = sErr; orphans = paths; console.error('storage delete failed', sErr, paths); }
  }

  selectedId = null;
  await loadBuilds();

  if (orphans.length) {
    // Persistent, not a toast: the build is gone, so these paths exist
    // nowhere else now and the admin needs them to finish the job by hand.
    document.getElementById('detail-panel').innerHTML =
      '<div class="detail-section"><div class="orphan-warn">'+
        '<div class="orphan-warn-title">Build deleted — but its files were not</div>'+
        '<div class="orphan-warn-body">'+
          'The build row and everything referencing it are gone. '+
          orphans.length + ' file(s) could not be removed from the <code>build-photos</code> bucket '+
          'and are now orphaned: <br><strong>'+escH(storageErr && storageErr.message || 'unknown storage error')+'</strong><br><br>'+
          'Delete these by hand in the Supabase dashboard — they are listed here because '+
          'nothing records them any more:<br>'+
          orphans.map(function(p){ return '<code>'+escH(p)+'</code>'; }).join('<br>')+
        '</div>'+
      '</div></div>';
    showToast('red', 'Build deleted — ' + orphans.length + ' file(s) left orphaned, see panel');
    return;
  }

  showToast('green', 'Build deleted' + (paths.length ? ' — ' + paths.length + ' file(s) removed' : ''));
}
// ============================================================
// PART CHANGES — correct, remove, add. Pending and live builds.
//
// Every one is written INTO parts_snapshot, so the build page, the
// server-rendered /b/ page and the builder's own editor all show the
// corrected list with nothing laid over it, and is logged in edit_history
// (append-only) so the builder can see what changed:
//   a correction   { part_id, part_index, field, from_value, to_value, … }
//   a removal      { kind: 'part_removed', part: {partId, brand, name, …}, reason, … }
//   an addition    { kind: 'part_added',   part: {…}, reason, … }
// Additions and removals carry their part under `part`, never a top-level
// part_id: they are not corrections, and nothing that matches corrections
// to parts (js/part-ids.js, contest_build_part, relink_build_part) may
// treat them as one.
//
// Who sees the log: the builder (their build page, "What Gunforma
// changed") and admins. Nobody else — the public page shows the parts.
// The builder is notified once the build is live, by the database
// (supabase/migrations_archive/admin_part_changes.sql), so a change made through SQL is
// announced the same way as one made here.
//
// RLS lets an admin write any build ("Admins can review and edit any
// build"), and the live-build guard (restrict_owner_edits_on_approved_build)
// admits admins, so there is no database function for this: the same
// conditional UPDATE the rest of this page uses, through writeParts().
// ============================================================
function rerenderBuild(buildId) {
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  if (b) renderDetail(b);
}
function doToggleEdit(buildId, idx) {
  var key = buildId+'-'+idx;
  editOpenKey = (editOpenKey === key) ? null : key;
  removeOpenKey = null;
  rerenderBuild(buildId);
}
function doToggleRemove(buildId, idx) {
  var key = buildId+'-'+idx;
  removeOpenKey = (removeOpenKey === key) ? null : key;
  editOpenKey = null;
  rerenderBuild(buildId);
  var el = removeOpenKey ? document.getElementById('pe-rm-'+key) : null;
  if (el) el.focus();
}
function refreshRemoveBtn(key) {
  var i = document.getElementById('pe-rm-'+key);
  var btn = document.getElementById('pe-rm-btn-'+key);
  if (i && btn) btn.disabled = !i.value.trim();
}

// The builder's sections, grouped and ordered exactly as on their own page
// (js/build-categories.js). A stored key that is not a section (very old
// rows) stays selectable as itself, so opening the editor never rewrites it.
function sectionSelectHtml(id, current, withBlank, onchange) {
  var BC = window.BuildCategories;
  var curKey = BC.sectionKeyFor(current);
  var opts = withBlank ? '<option value="">Choose a section…</option>' : '';
  if (current && !curKey) opts += '<option value="'+escH(current)+'" selected>'+escH(BC.categoryLabel(current))+' (as stored)</option>';
  BC.GROUPED_CATEGORIES.forEach(function (g) {
    opts += '<optgroup label="'+escH(g.group.label)+'">'+g.categories.map(function (c) {
      return '<option value="'+escH(c.key)+'"'+(c.key===curKey?' selected':'')+'>'+escH(c.label)+'</option>';
    }).join('')+'</optgroup>';
  });
  return '<select class="part-edit-select" id="'+id+'"'+(onchange?' onchange="'+onchange+'"':'')+'>'+opts+'</select>';
}

// Who will see a change, said where the reviewer makes it.
function changeAudienceHtml(b) {
  var who = b.profiles && b.profiles.username ? b.profiles.username : 'the builder';
  var text;
  if (!b.user_id) text = 'Nobody is told: this build is not claimed.';
  else if (currentAdmin && currentAdmin.id === b.user_id) text = 'Your own build, so no notification.';
  else if (b.status === 'approved') text = escH(who)+' gets a notification and sees this change on their build page. Nobody else sees the list of changes.';
  else text = escH(who)+' sees this change on their build page, and is notified when the build goes live. Nobody else sees the list of changes.';
  return '<div class="part-edit-note" style="margin-top:8px;">'+text+'</div>';
}

// The part as the log records it: enough to say "Removed Holosun 507C"
// after the part itself is gone.
function partSummary(p) {
  var s = { partId: p.partId, category: p.category, brand: p.brand || '', name: p.name || '' };
  if (p.refId) s.refId = p.refId;
  if (p.variantLabel) s.variantLabel = p.variantLabel;
  if (p.variant) s.variant = p.variant;
  return s;
}

// A new parts_snapshot row, field by field the way the builder pages write
// one (gunforma-post-build.html buildPartsSnapshot). It is on the list
// scripts/check-snapshot-fields.mjs compares, so a field added there and
// not here fails the build rather than silently going missing.
function snapshotRow(p) {
  const row = { category: p.category, refId: p.refId, brand: p.brand, name: p.name, pending: p.pending };
  if (p.variantId)     row.variantId     = p.variantId;
  if (p.variantLabel)  row.variantLabel  = p.variantLabel;
  if (p.variantColor)  row.variantColor  = p.variantColor;
  if (p.variantFinish) row.variantFinish = p.variantFinish;
  if (p.variantSpecs)  row.variantSpecs  = p.variantSpecs;
  if (p.imageUrl)      row.imageUrl      = p.imageUrl;
  if (p.partId)        row.partId        = p.partId;
  if (p.finish) row.finish = p.finish;
  if (p.variant) row.variant = p.variant;
  // The builder's own details for this part (js/part-picker.js PART DETAILS).
  if (p.details) row.details = p.details;
  return row;
}

// Every part change goes through here. `change(parts)` edits a copy of the
// list as just re-read and returns { entries } to log, or a sentence saying
// why it could not.
//
// Same two steps as Approve: ensureUnchanged() first (the reviewer is
// acting on the list they were shown — an index in particular), then an
// UPDATE conditional on status and updated_at, counted. tier follows the
// part count, as the builder pages set it.
async function writeParts(buildId, verb, change) {
  // Every other open panel is keyed by POSITION (edit, remove, and "Link to
  // existing part", whose chosen product would otherwise sit under whatever
  // part moved into that place). After any part change, refused or not,
  // they are closed rather than left pointing at a different part.
  editOpenKey = null;
  removeOpenKey = null;
  LINK = { key: null, q: '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
  const fresh = await ensureUnchanged(buildId, verb);
  if (!fresh) return false;
  var parts = JSON.parse(JSON.stringify(fresh.parts_snapshot || []));
  // Ids first, so the change below can log the id of the part it touches
  // even on a row stored without one (none since part_ids.sql; trg_assign_
  // part_ids would add it anyway, but after this page had logged by position).
  PartIds.ensure(parts);
  var made = change(parts);
  if (typeof made === 'string') { showToast('red', made); return false; }
  PartIds.ensure(parts);
  const { data: written, error } = await sb.from('builds')
    .update({
      parts_snapshot: parts,
      edit_history: (fresh.edit_history || []).concat(made.entries),
      tier: parts.length ? 'full' : 'minimum',
    })
    .eq('id', buildId)
    .eq('status', fresh.status)
    .eq('updated_at', fresh.updated_at)
    .select(BUILD_FIELDS);
  if (error) { console.error(error); showToast('red', 'Not saved — ' + (error.message || 'see console')); return false; }
  if (!Array.isArray(written) || written.length !== 1) {
    showToast('red', 'This build changed while you were saving — reloaded. Nothing was saved.');
    await loadBuilds();
    return false;
  }
  await loadBuilds();
  // The parts changed because of this write, and the pane now shows it.
  // Marked from the row the write RETURNED, not from the reload: a builder
  // edit that landed in between must still trip the next re-check.
  markReviewed(written[0]);
  return true;
}

function logEntryBase(reason) {
  var e = { edited_by: currentAdminUsername, edited_at: new Date().toISOString(), status: 'active' };
  if (reason) e.reason = reason;
  return e;
}

async function doSaveEdit(buildId, idx) {
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  if (!b) return;
  var part = (b.parts_snapshot||[])[idx];
  if (!part) return;
  var key = buildId+'-'+idx;
  function val(prefix) { var el = document.getElementById(prefix+key); return el ? el.value.trim() : null; }
  var next = { category: val('pe-cat-'), brand: val('pe-brand-'), name: val('pe-name-'), variant: val('pe-variant-') };
  var reason = val('pe-reason-') || '';
  if (!part.refId && (!next.brand || !next.name)) { showToast('red', 'A part needs a brand and a name'); return; }

  var BC = window.BuildCategories;
  var changes = [];
  ['category', 'brand', 'name', 'variant'].forEach(function (f) {
    if (part.refId && (f === 'brand' || f === 'name')) return;   // read-only: the catalog's
    var from = part[f] == null ? '' : String(part[f]);
    var to = next[f] == null ? from : next[f];
    // An old key and its section are the same section: no change.
    if (f === 'category' && (BC.sectionKeyFor(to) || to) === (BC.sectionKeyFor(from) || from)) return;
    if (to !== from) changes.push({ field: f, from: from, to: to });
  });
  if (!changes.length) {
    editOpenKey = null;
    renderDetail(b);
    showToast('blue', 'No changes to save');
    return;
  }

  // Closed first: a refusal re-renders the pane, and an edit panel left open
  // over the reloaded list would be pointing at whatever now sits at idx.
  editOpenKey = null;
  var ok = await writeParts(buildId, 'save the correction', function (parts) {
    var at = PartIds.isId(part.partId)
      ? parts.findIndex(function (p) { return p && p.partId === part.partId; })
      : idx;
    var target = parts[at];
    if (!target) return 'That part is no longer on the build — nothing was saved.';
    changes.forEach(function (c) {
      if (c.field === 'variant' && !c.to) delete target.variant;
      else target[c.field] = c.to;
    });
    return { entries: changes.map(function (c) {
      return Object.assign({
        // By the part's own id, so the record stays with the part however the
        // list is reordered later. part_index is where it was.
        part_id: target.partId,
        part_index: at,
        field: c.field,
        from_value: c.from,
        to_value: c.to,
      }, logEntryBase(reason));
    }) };
  });
  if (ok) showToast('blue', 'Correction saved — '+changes.length+' field'+(changes.length!==1?'s':'')+' updated');
}

async function doRemovePart(buildId, idx) {
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  if (!b) return;
  var part = (b.parts_snapshot||[])[idx];
  if (!part) return;
  var input = document.getElementById('pe-rm-'+buildId+'-'+idx);
  var reason = input ? input.value.trim() : '';
  if (!reason) { showToast('red', 'Say why it is coming off — the builder will read it'); return; }
  // A correction written before parts had ids names its part by POSITION.
  // Taking out a part at or before one would move it onto another part.
  // None existed when ids shipped; refused rather than risked.
  if (PartIds.pinnedThrough(b.edit_history) >= idx) {
    showToast('red', 'This build has an old position-based correction — this part cannot be removed here');
    return;
  }
  removeOpenKey = null;
  var ok = await writeParts(buildId, 'remove the part', function (parts) {
    var at = PartIds.isId(part.partId)
      ? parts.findIndex(function (p) { return p && p.partId === part.partId; })
      : idx;
    if (at < 0 || !parts[at]) return 'That part is no longer on the build — nothing was removed.';
    var gone = parts.splice(at, 1)[0];
    return { entries: [Object.assign({ kind: 'part_removed', part: partSummary(gone) }, logEntryBase(reason))] };
  });
  if (ok) showToast('blue', 'Removed ' + [part.brand, part.name].filter(Boolean).join(' '));
}

function resetAdd(buildId) {
  ADD = { buildId: buildId || null, section: '', q: '', productId: null, variantId: null,

async function doToggleAdd(buildId) {
  if (ADD.buildId === buildId) { resetAdd(null); rerenderBuild(buildId); return; }
  resetAdd(buildId);
  rerenderBuild(buildId);
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  if (b && b.platform_id && !FITS[b.platform_id]) {
    try { await loadFits(b.platform_id); }
    catch (e) { ADD.msg = 'Could not load the catalog: ' + e.message + ' — you can still type the part.'; ADD.msgBad = true; }
    if (ADD.buildId === buildId) rerenderBuild(buildId);
  }
}
// Catalog parts that fit this pistol, with their live variants: the builder
// page's own query — discontinued parts included, after the live ones and
// marked, because the builder may well own one (CLAUDE.md, "Discontinued
// parts").
async function loadFits(platformId) {
  if (FITS[platformId]) return FITS[platformId];
  const { data, error } = await sb
    .from('products')
    .select(
      'id, slug, category, name, is_discontinued, manufacturers(name), product_platforms!inner(platform_id), '+
      'product_variants!product_variants_product_id_fkey(id, is_default, primary_image_url, color, finish, variant_label, '+
      'reticle, reticle_color, battery_type, mount_system)'
    )
    .is('product_variants.retired_at', null)
    .eq('product_platforms.platform_id', platformId)
    .order('is_discontinued')
    .order('name');
  if (error) throw new Error(error.message);
  // A row whose address 301s (js/part-redirects.js) is never offered.
  FITS[platformId] = (data || []).filter(function (r) { return !window.isRedirectedPart(r.category, r.slug); }).map(function (r) {
    return {
      id: r.id, category: r.category, name: r.name, discontinued: r.is_discontinued === true,
      brand: r.manufacturers ? r.manufacturers.name : 'Unknown brand',
      // Default variant first, as the builder's colour step offers them.
      variants: (r.product_variants || []).slice().sort(function (a, c) { return (c.is_default ? 1 : 0) - (a.is_default ? 1 : 0); }),
    };
  });
  return FITS[platformId];
}
function addSection(v) {
  ADD.section = v; ADD.q = ''; ADD.productId = null; ADD.variantId = null; ADD.msg = ''; ADD.typed = {};
  rerenderBuild(ADD.buildId);

function addCandidates(b, sec) {
  var rows = FITS[b.platform_id] || [];
  var words = ADD.q.toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter(function (r) {
    if ((sec.dbCategory || []).indexOf(r.category) === -1) return false;
    var hay = (r.brand + ' ' + r.name).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  });
}
function addResultsHtml(b, sec) {

      '<span><strong>' + escH(r.brand) + '</strong> — ' + escH(r.name) + (r.discontinued ? ' <em>(discontinued)</em>' : '') + '</span></label>';

}
function addSearch(q) {

// The typed form: the section's own fields when it has them (Paint Job &

function typedFieldsHtml(sec) {

function addPartHtml(b) {

async function doAddCatalog(buildId) {
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  var row = b && (FITS[b.platform_id] || []).find(function (r) { return r.id === ADD.productId; });
  if (!row || ADD.busy) return;
  var v = row.variants.find(function (x) { return x.id === ADD.variantId; }) || row.variants[0] || null;
  // Field for field what the builder page stores for a catalog pick
  // (gunforma-post-build.html addPartWithVariant).
  await addPart(buildId, snapshotRow({
    category: ADD.section, refId: row.id, brand: row.brand, name: row.name, pending: false,
    variantId:     v ? v.id : null,
    variantLabel:  v ? window.variantLabel(v) : '',
    variantColor:  v ? (v.color  || null) : null,
    variantFinish: v ? (v.finish || null) : null,
    variantSpecs:  v ? window.variantSpecs(v) : '',
    imageUrl:      v ? (v.primary_image_url || null) : null,
  }));
}
async function doAddTyped(buildId) {
  if (ADD.busy) return;
  var sec = window.BuildCategories.categoryByKey(ADD.section);
  if (!sec) return;
  var t = {};
  Object.keys(ADD.typed).forEach(function (k) { t[k] = String(ADD.typed[k] || '').trim(); });
  var row;
  if (sec.custom && sec.custom.fields) {
    // As the builder's form does it (gunforma-post-build.html addCustomPart).
    var missing = sec.custom.fields.some(function (f) { return f.required && !t[f.id]; });
    if (missing || (!t.color && !t.stipple)) { showToast('red', 'Fill in who did it, and the colour or the stipple'); return; }
    row = snapshotRow({
      category: sec.key, refId: null, brand: t.shop,
      name: [t.color, t.stipple ? t.stipple + ' stipple' : ''].filter(Boolean).join(' · '),
      pending: !!sec.custom.pending,
      finish: { shop: t.shop, color: t.color || '', stipple: t.stipple || '' },
    });
  } else {
    if (!t.brand || !t.name) { showToast('red', 'A typed part needs a brand and a name'); return; }
    // Pending, like a part a builder types: it can still be linked to the
    // catalog or added to it from this page.
    row = snapshotRow({ category: sec.key, refId: null, brand: t.brand, name: t.name, pending: true, variant: t.variant || '' });
  }
  await addPart(buildId, row);
}
async function addPart(buildId, row) {
  ADD.busy = true; ADD.msg = '';
  rerenderBuild(buildId);
  var reason = (ADD.reason || '').trim();
  var ok = await writeParts(buildId, 'add the part', function (parts) {
    parts.push(row);
    PartIds.ensure(parts);          // gives the new row its id, keeps the rest
    return { entries: [Object.assign({ kind: 'part_added', part: partSummary(row) }, logEntryBase(reason))] };
  });
  ADD.busy = false;
  if (ok) {
    resetAdd(null);
    showToast('green', 'Added ' + [row.brand, row.name].filter(Boolean).join(' '));
  }
  rerenderBuild(buildId);
}

// ============================================================
// PENDING PARTS → THE CATALOG
// A pending custom part (pending, no refId) gets two actions: "Add to
// catalog" sends it to gunforma-admin-part.html with the build and its
// ORIGINAL index, so Save re-links it; "Link to existing part" swaps it for
// a product already in the catalog through relink_build_part(). A part
// whose section has no catalog category gets a reason line instead.
// ============================================================
function partSection(raw) {
  var BC = window.BuildCategories;
  var key = BC.sectionKeyFor(raw);
  var sec = BC.CATEGORIES.find(function (c) { return c.key === key; });
  return { key: key, label: sec ? sec.label : BC.categoryLabel(raw), dbCategory: (sec && sec.dbCategory) || [],
           anyCategory: !!(sec && sec.anyCategory) };
}
function catalogActionsHtml(b, p, i, history) {
  if (p.pending !== true || p.refId) return '';
  var sec = partSection(p.category);
  if (!sec.dbCategory.length) {
    return '<div class="catalog-reason">No catalog section for ' + escH(sec.label) + ', so this part stays as typed.</div>';
  }
  var key = b.id + '-' + i;
  var open = LINK.key === key;
  var blocked = history.length
    ? '<span class="catalog-note">' + history.length + ' correction' + (history.length > 1 ? 's' : '') + ' on this part, so linking is refused. To swap it for a catalog part: Remove it, then + Add a part.</span>'
    : '';
  return '<div class="catalog-actions">' +
      '<a class="btn-catalog" href="gunforma-admin-part.html?build=' + b.id + '&part=' + i + '">Add to catalog</a>' +
      '<button class="btn-catalog' + (open ? ' primary' : '') + '" onclick="doToggleLink(\'' + b.id + '\',' + i + ')"' + (history.length ? ' disabled' : '') + '>' + (open ? 'Close' : 'Link to existing part') + '</button>' +
      blocked +
    '</div>' +
    (open ? linkPanelHtml(b, p, i, sec) : '');
}
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  var res = await Promise.all([
    sb.from('products').select('id,slug,name,category,brand_id').order('name'),
    sb.from('manufacturers').select('id,name'),
  ]);
  if (res[0].error || res[1].error) throw new Error((res[0].error || res[1].error).message);
  var brands = {};
  res[1].data.forEach(function (m) { brands[m.id] = m.name; });
  CATALOG = { products: res[0].data, brands: brands };
  return CATALOG;
}
async function doToggleLink(buildId, idx) {
  var key = buildId + '-' + idx;
  if (LINK.key === key) { LINK.key = null; rerenderSelected(); return; }
  var b = BUILDS.find(function (x) { return x.id === buildId; });
  var p = (b.parts_snapshot || [])[idx];
  LINK = { key: key, q: p.brand || '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
  try { await loadCatalog(); } catch (e) { LINK.msg = 'Could not load the catalog: ' + e.message; LINK.msgBad = true; }
  rerenderSelected();
}
function rerenderSelected() {
  var b = BUILDS.find(function (x) { return x.id === selectedId; });
  if (b) renderDetail(b);
}
// Products in the part's section only (the ruling), matching every word of
// the search against brand + name. Other Parts (`misc`) is the catch-all, so
// a part typed there may be any catalog part: the whole catalog is offered,
// and linking moves the part into its product's own section.
function linkCandidates(sec) {
  if (!CATALOG) return [];
  var words = LINK.q.toLowerCase().split(/\s+/).filter(Boolean);
  return CATALOG.products.filter(function (pr) {
    if (!sec.anyCategory && sec.dbCategory.indexOf(pr.category) === -1) return false;
    var hay = ((CATALOG.brands[pr.brand_id] || '') + ' ' + pr.name).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  });
}
function linkPanelHtml(b, p, i, sec) {
  var hint = sec.anyCategory
    ? 'Other Parts takes any category, so the whole catalog is searched. Linking moves the part into its product\'s own section (a recoil spring renders under Recoil Springs).'
    : 'Showing ' + escH(sec.dbCategory.map(function (c) { return window.categoryPlural(c).toLowerCase(); }).join(' and ')) + ' only.';
  return '<div class="link-panel">' +
      '<input type="text" id="link-q" placeholder="Search brand and name" value="' + escH(LINK.q) + '" oninput="linkSearch(this.value)" />' +
      '<div class="catalog-reason">' + hint + ' The entry becomes the catalog part: the builder\'s wording ("' + escH(p.name || '') + '") is replaced by the catalog name.</div>' +
      '<div class="link-results" id="link-results">' + linkResultsHtml(sec) + '</div>' +
      '<div id="link-choice">' + linkChoiceHtml(b, i) + '</div>' +
    '</div>';
}
function linkResultsHtml(sec) {
  if (!CATALOG) return LINK.msg ? '' : '<div class="catalog-reason">Loading the catalog…</div>';
  var list = linkCandidates(sec);
  if (!list.length) return '<div class="catalog-reason">Nothing in this section matches. Clear the search, or use "Add to catalog".</div>';
  return list.slice(0, 30).map(function (pr) {
    var on = LINK.productId === pr.id;
    var img = IMAGE_BY_PRODUCT_ID[pr.id];
    return '<label class="link-result' + (on ? ' on' : '') + '"><input type="radio" name="link-product"' + (on ? ' checked' : '') + ' onchange="linkPick(\'' + pr.id + '\')" />' +
      (img ? '<img src="' + escH(img) + '" alt="" />' : '') +
      '<span><strong>' + escH(CATALOG.brands[pr.brand_id] || '') + '</strong> — ' + escH(pr.name) + '<br><span class="catalog-reason">' + escH(window.productPath(pr.category, pr.slug) || pr.slug) + '</span></span></label>';
  }).join('') + (list.length > 30 ? '<div class="catalog-reason">' + (list.length - 30) + ' more: narrow the search.</div>' : '');
}
function linkSearch(q) {
  LINK.q = q;
  var b = BUILDS.find(function (x) { return x.id === selectedId; });
  var idx = Number(LINK.key.split('-').pop());
  var sec = partSection((b.parts_snapshot || [])[idx].category);
  document.getElementById('link-results').innerHTML = linkResultsHtml(sec);
}
async function linkPick(productId) {
  LINK.productId = productId; LINK.variantId = null; LINK.msg = '';
  if (!LINK.variants[productId]) {
    var res = await sb.from('product_variants')
      .select('id,color,finish,variant_label,primary_image_url,is_default,reticle,reticle_color,battery_type,mount_system')
      .eq('product_id', productId).is('retired_at', null).order('is_default', { ascending: false });
    if (res.error) { LINK.msg = 'Could not load its variants: ' + res.error.message; LINK.msgBad = true; rerenderSelected(); return; }
    LINK.variants[productId] = res.data;
  }
  var vs = LINK.variants[productId];
  LINK.variantId = vs.length ? vs[0].id : null;   // the default variant first
  rerenderSelected();
}
function linkVariant(id) { LINK.variantId = id; rerenderSelected(); }
function chosenVariant() {
  var vs = LINK.variants[LINK.productId] || [];
  return vs.find(function (v) { return v.id === LINK.variantId; }) || null;
}
function linkChoiceHtml(b, i) {
  var msg = LINK.msg ? '<div class="link-msg' + (LINK.msgBad ? ' bad' : '') + '">' + escH(LINK.msg) + '</div>' : '';
  if (!LINK.productId) return msg;
  var pr = CATALOG.products.find(function (x) { return x.id === LINK.productId; });
  var vs = LINK.variants[LINK.productId] || [];
  if (!vs.length) return '<div class="link-msg bad">That product has no live variant to link to.</div>' + msg;
  var v = chosenVariant();
  var specs = v ? window.variantSpecs(v) : '';
  return '<div class="link-choice">Variant <select onchange="linkVariant(this.value)">' +
      vs.map(function (x) { return '<option value="' + x.id + '"' + (x.id === LINK.variantId ? ' selected' : '') + '>' + escH(window.variantLabelOr(x, 'Unlabelled')) + (x.is_default ? ' (default)' : '') + '</option>'; }).join('') +
      '</select>' + (specs ? ' · <span class="catalog-reason">' + escH(specs) + '</span>' : '') +
      '<br>Links to <a href="' + escH(window.productPath(pr.category, pr.slug) || '#') + '" target="_blank" rel="noopener">' + escH(window.productPath(pr.category, pr.slug) || pr.slug) + '</a>' +
    '</div>' +
    '<div class="catalog-actions"><button class="btn-catalog primary" onclick="doLink(\'' + b.id + '\',' + i + ')"' + (LINK.busy ? ' disabled' : '') + '>' + (LINK.busy ? 'Linking…' : 'Link') + '</button>' +
    '<button class="btn-catalog" onclick="doToggleLink(\'' + b.id + '\',' + i + ')">Cancel</button></div>' + msg;
}
async function doLink(buildId, idx) {
  var v = chosenVariant();
  if (!v || LINK.busy) return;
  var pr = CATALOG.products.find(function (x) { return x.id === LINK.productId; });
  if (!window.confirm('Link this build\'s part to "' + pr.name + '" (' + window.variantLabelOr(v, 'Unlabelled') + ')? The entry becomes the catalog part.')) return;
  LINK.busy = true; LINK.msg = ''; rerenderSelected();
  // relink_build_part() swaps the part AT THIS INDEX, and checks only that
  // whatever sits there is a pending custom part. If the builder has removed
  // an earlier part since this pane was drawn, that is a different part.
  const unchanged = await ensureUnchanged(buildId, 'link the part');
  if (!unchanged) {
    // Close the panel: its index belongs to the list that was just replaced.
    LINK = { key: null, q: '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
    rerenderSelected();
    return;
  }
  // The spec line is computed here, with js/variant-label.js, so the formula
  // stays in one place; the function stores it only when non-empty.
  var res = await sb.rpc('relink_build_part', {
    p_build_id: buildId, p_part_index: idx, p_product_id: pr.id, p_variant_id: v.id,
    p_variant_specs: window.variantSpecs(v) || null,
  });
  LINK.busy = false;
  if (res.error) {
    LINK.msgBad = true;
    LINK.msg = (res.error.code === 'PGRST202' || /relink_build_part/.test(res.error.message || '') && /not find|does not exist/i.test(res.error.message || ''))
      ? 'Linking is not available yet: relink_build_part() has not been applied to the database.'
      : res.error.message;
    rerenderSelected();
    return;
  }
  LINK = { key: null, q: '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
  showToast('green', 'Linked to ' + pr.name);
  await loadBuilds();
  // The parts changed because of this link, and the pane now shows it.
  markReviewed(BUILDS.find(function (x) { return x.id === buildId; }));
}

// ============================================================
// INIT
// ============================================================
(async function init() {
  var ok = await requireAdmin();
  if (!ok) return;
  await loadBuilds();
})();
</script>
