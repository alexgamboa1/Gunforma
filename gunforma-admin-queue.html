<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/assets/gunforma-mark.png" />
<link rel="icon" type="image/png" href="/favicon-96x96.png?v=12026" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12026" />
<link rel="shortcut icon" href="/favicon.ico?v=12026" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=12026" />
<link rel="manifest" href="/site.webmanifest?v=12026" />
<title>Review Queue — Gunforma Admin</title>
<meta name="description" content="Gunforma admin — review and moderate submitted builds." />
<meta name="robots" content="noindex, nofollow" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f3ee; color: #1a1a1a; min-height: 100vh; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 52px; background: #0e0f11; border-bottom: 0.5px solid #2a2b2e; position: sticky; top: 0; z-index: 300; }
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo img { height: 22px; width: auto; display: block; }
.nav-logo img.nav-logo-mark { display: none; }
@media (max-width: 600px) { .nav-logo img.nav-logo-full { display: none; } .nav-logo img.nav-logo-mark { display: block; } }
.nav-admin-tag { font-size: 9px; font-weight: 700; background: #4a9edd; color: #fff; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 10px; }
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-right-link { font-size: 11px; color: #ffffff; text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; }
.nav-right-link:hover { color: #ffffff; }
/* One line at any width (see gunforma-admin-post.html): the bar is 52px tall. */
.nav-right { min-width: 0; overflow-x: auto; scrollbar-width: none; margin-left: 12px; }
.nav-right .nav-right-link { white-space: nowrap; }
@media (max-width: 600px) { .nav-right { gap: 11px; } .nav-right .nav-right-link { font-size: 10px; letter-spacing: 0.03em; } }

.shell { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 52px); }

/* LEFT PANEL */
.queue-panel { background: #fff; border-right: 0.5px solid #e5e5e5; display: flex; flex-direction: column; overflow: hidden; }
.queue-header { padding: 16px 20px 12px; border-bottom: 0.5px solid #e5e5e5; background: #fafaf8; flex-shrink: 0; }
.queue-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.queue-count { font-size: 11px; color: #888; font-weight: 600; letter-spacing: 0; text-transform: none; }
.filter-tabs { display: flex; gap: 4px; }
.filter-tab { font-size: 11px; font-weight: 600; color: #888; background: none; border: 0.5px solid transparent; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.filter-tab:hover { color: #1a1a1a; background: #f4f3ee; }
.filter-tab.active { color: #1a1a1a; background: #f4f3ee; border-color: #d9d6cc; }
.stats-row { display: flex; border-bottom: 0.5px solid #e5e5e5; flex-shrink: 0; }
.stat-box { flex: 1; padding: 10px 16px; border-right: 0.5px solid #e5e5e5; }
.stat-box:last-child { border-right: none; }
.stat-num { font-size: 18px; font-weight: 700; }
.stat-num.amber { color: #b45309; }
.stat-num.blue  { color: #1d6fb8; }
.stat-num.green { color: #166534; }
.stat-lbl { font-size: 9px; color: #999; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px; }
.queue-list { flex: 1; overflow-y: auto; }

/* QUEUE ITEMS */
.queue-item { padding: 14px 20px; border-bottom: 0.5px solid #efece3; cursor: pointer; transition: background 0.1s; }
.queue-item:hover { background: #fafaf8; }
.queue-item.selected { background: #eaf4fc; border-left: 3px solid #4a9edd; padding-left: 17px; }
.qi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.qi-name { font-size: 13px; font-weight: 700; line-height: 1.3; }
.qi-badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
.qi-badge.full       { background: #e8f5ee; color: #166534; border: 0.5px solid #86cfad; }
.qi-badge.minimum    { background: #fef3e2; color: #b45309; border: 0.5px solid #f9b860; }
.qi-badge.approved   { background: #e8f5ee; color: #166534; border: 0.5px solid #86cfad; }
.qi-badge.rejected   { background: #fde8e2; color: #9b1c1c; border: 0.5px solid #f9c4b6; }
.qi-meta { font-size: 11px; color: #888; margin-bottom: 5px; }
.qi-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.qi-tag { font-size: 9px; color: #666; background: #f4f3ee; border: 0.5px solid #e5e2d8; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.qi-time { font-size: 10px; color: #bbb; margin-top: 5px; }

/* RIGHT PANEL */
.detail-panel { overflow-y: auto; }
.detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #bbb; gap: 10px; padding: 40px; text-align: center; }
.detail-empty-text { font-size: 13px; line-height: 1.6; }
.detail-content { padding: 28px 32px 60px; max-width: 900px; }

.detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
.detail-edit { max-width: 300px; text-align: right; }
.detail-edit .catalog-reason { margin-top: 8px; line-height: 1.5; }
.detail-eyebrow { font-size: 10px; color: #4a9edd; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
.detail-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 8px; }
.detail-submeta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.detail-submeta-item { font-size: 12px; color: #888; }
.detail-submeta-item strong { color: #1a1a1a; }
.tier-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
.tier-badge.full    { background: #e8f5ee; color: #166534; border: 0.5px solid #86cfad; }
.tier-badge.minimum { background: #fef3e2; color: #b45309; border: 0.5px solid #f9b860; }

.detail-section { margin-bottom: 24px; }
.detail-section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 0.5px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; }

/* PHOTOS */
.detail-photos { display: flex; flex-direction: column; gap: 8px; }
.detail-photo-hero { height: 220px; border-radius: 6px; overflow: hidden; background: #f0f2f5; border: 0.5px solid #e5e5e5; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 11px; }
.detail-photo-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-photo-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.detail-photo-thumb { height: 90px; border-radius: 6px; overflow: hidden; background: #f0f2f5; border: 0.5px solid #e5e5e5; }
.detail-photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* PARTS (read-only — parts_snapshot has no persisted verification state) */
.simple-parts-list { border: 0.5px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
.simple-part-row { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid #efece3; background: #fff; }
.simple-part-row:last-child { border-bottom: none; }
.simple-part-cat { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; width: 100px; flex-shrink: 0; }
.simple-part-name { font-size: 13px; font-weight: 700; }
.simple-part-thumb { flex-shrink: 0; width: 56px; height: 56px; background: #f4f3ee; border: 0.5px solid #eee; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.simple-part-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.simple-part-thumb-fallback { font-size: 8px; color: #b8b5ac; letter-spacing: 0.06em; text-align: center; padding: 2px; }
.simple-part-brand { font-size: 10px; color: #2a7bbd; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.simple-part-variant { display: inline-block; margin-left: 6px; font-size: 9.5px; color: #555; background: #f4f3ee; border: 0.5px solid #e5e2d8; padding: 1px 6px; border-radius: 20px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.catalog-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 2px 0; }
.btn-catalog { font: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 10px; border-radius: 4px; border: 0.5px solid #1a1a1a; background: #fff; color: #1a1a1a; text-decoration: none; cursor: pointer; }
.btn-catalog.primary { background: #1a1a1a; color: #fff; }
.btn-catalog:disabled { opacity: 0.35; cursor: not-allowed; }
.catalog-reason { font-size: 11px; color: #777; margin: 6px 0 2px 0; }
.catalog-note { font-size: 11px; color: #8a6a2a; }
.link-panel { border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 12px; margin: 8px 0; background: #fafaf8; }
.link-panel input[type=text] { width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border: 0.5px solid #ccc; border-radius: 4px; }
.link-results { max-height: 260px; overflow-y: auto; margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.link-result { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; padding: 6px; border-radius: 4px; cursor: pointer; }
.link-result.on { background: #eef6fd; }
.link-result img { width: 40px; height: 40px; object-fit: contain; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 3px; flex-shrink: 0; }
.link-choice { font-size: 12px; line-height: 1.6; margin: 8px 0; }
.link-choice select { font: inherit; font-size: 12px; padding: 4px 6px; }
.link-msg { font-size: 11px; line-height: 1.5; margin-top: 6px; }
.link-msg.bad { color: #b03a2e; }
.simple-part-pending-tag { font-size: 9px; color: #b45309; background: #fef3e2; border: 0.5px solid #f9b860; padding: 2px 6px; border-radius: 20px; font-weight: 700; margin-left: 6px; }
.no-parts-note { font-size: 12px; color: #999; padding: 16px; text-align: center; background: #fafaf8; border-radius: 6px; border: 0.5px solid #e5e5e5; }

/* PART EDIT (mock — see partEditHistory; not persisted to Supabase) */
.simple-part-row { align-items: flex-start; flex-wrap: wrap; }
.simple-part-main { display: flex; gap: 14px; align-items: center; flex: 1; min-width: 0; }
.simple-part-actions { flex-shrink: 0; }
.edited-flag { font-size: 9px; color: #4a9edd; font-weight: 700; margin-left: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
.btn-edit-inline { font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; border: 0.5px solid #a7cdec; background: #fff; color: #2a7bbd; transition: all 0.15s; }
.btn-edit-inline:hover { background: #eaf4fc; }
.part-edit-panel { display: none; width: 100%; margin-top: 10px; background: #fafaf8; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 14px; }
.part-edit-panel.open { display: block; animation: slideIn 0.15s ease; }
.part-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.part-edit-label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #888; margin-bottom: 3px; display: block; }
.part-edit-input, .part-edit-select { width: 100%; font-size: 12px; padding: 7px 10px; border: 0.5px solid #e5e5e5; border-radius: 4px; font-family: inherit; background: #fff; }
.part-edit-input:focus, .part-edit-select:focus { outline: none; border-color: #4a9edd; }
.part-edit-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.btn-edit-save { font-size: 11px; color: #fff; background: #4a9edd; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-weight: 700; font-family: inherit; }
.btn-edit-save:hover { background: #2a7bbd; }
.btn-edit-close { font-size: 11px; color: #888; background: none; border: 0.5px solid #d9d6cc; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; }
.part-edit-history { width: 100%; margin-top: 8px; padding-top: 8px; border-top: 0.5px dashed #e5e2d8; font-size: 11px; color: #888; line-height: 1.7; }
.part-edit-history strong { color: #555; }
.contested-tag { font-size: 9px; color: #9b1c1c; background: #fde8e2; border: 0.5px solid #f9c4b6; padding: 2px 6px; border-radius: 20px; font-weight: 700; margin-left: 6px; }
.qi-contested-note { font-size: 10px; color: #9b1c1c; font-weight: 700; margin-top: 3px; }

/* CONSENT */
.consent-row { display: flex; gap: 18px; flex-wrap: wrap; background: #fafaf8; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 12px 16px; }
.consent-item { font-size: 12px; color: #666; }
.consent-item strong { color: #1a1a1a; }

.detail-desc { font-size: 13px; color: #444; line-height: 1.7; background: #fafaf8; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 14px 16px; }

/* REVIEW ACTIONS */
.review-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 8px; padding: 20px; }
.review-card-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.review-card-sub { font-size: 12px; color: #888; margin-bottom: 16px; line-height: 1.5; }
.review-actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.btn-approve { background: #22a06b; color: #fff; border: none; padding: 12px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.15s; }
.btn-approve:hover:not(:disabled) { background: #1a8057; }
.btn-approve:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; }
.btn-reject { background: #fff; color: #9b1c1c; border: 1.5px solid #f9c4b6; padding: 12px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-reject:hover { background: #fde8e2; }

@keyframes slideIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
.reject-form { display: none; background: #fde8e2; border: 0.5px solid #f9c4b6; border-radius: 6px; padding: 16px; margin-top: 2px; }
.reject-form.open { display: block; animation: slideIn 0.15s ease; }
.reject-form-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7f1d1d; margin-bottom: 8px; display: block; }
.reject-reasons { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.reject-reason { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #7f1d1d; cursor: pointer; line-height: 1.4; }
.reject-reason input { accent-color: #e25c3a; margin-top: 2px; flex-shrink: 0; }
.reject-note { width: 100%; font-size: 12px; padding: 8px 10px; border: 0.5px solid #f9c4b6; border-radius: 4px; font-family: inherit; background: #fff; resize: vertical; min-height: 56px; margin-bottom: 10px; }
.reject-note:focus { outline: none; border-color: #e25c3a; }
.reject-row { display: flex; gap: 8px; }
.btn-reject-confirm { background: #c0392b; color: #fff; border: none; padding: 9px 18px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-reject-confirm:hover { background: #a93226; }
.btn-reject-cancel { background: none; border: 0.5px solid #f9c4b6; color: #9b1c1c; padding: 9px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: inherit; }

/* Danger zone — delete. Visually separated from approve/reject on purpose:
   those move a build between states and are undoable from this page, this
   one is not. Sits below everything else so it is never the first thing a
   cursor lands on. */
.danger-zone { background: #fff; border: 0.5px solid #e5e5e5; border-left: 3px solid #c0392b; border-radius: 8px; padding: 18px 20px; margin-top: 14px; }
.danger-zone-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9b1c1c; margin-bottom: 6px; }
.danger-zone-sub { font-size: 12px; color: #888; margin-bottom: 14px; line-height: 1.6; }
.danger-zone-sub code { font-size: 11px; background: #f4f3ee; padding: 1px 5px; border-radius: 3px; }
.btn-delete { background: #fff; color: #9b1c1c; border: 1.5px solid #f9c4b6; padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-delete:hover { background: #fde8e2; }
.delete-form { display: none; background: #fde8e2; border: 0.5px solid #f9c4b6; border-radius: 6px; padding: 16px; margin-top: 12px; }
.delete-form.open { display: block; animation: slideIn 0.15s ease; }
.delete-form-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7f1d1d; margin-bottom: 8px; display: block; }
.delete-cascade-list { font-size: 11.5px; color: #7f1d1d; line-height: 1.7; margin-bottom: 12px; }
.delete-confirm-input { width: 100%; font-size: 12px; padding: 9px 10px; border: 0.5px solid #f9c4b6; border-radius: 4px; font-family: inherit; background: #fff; margin-bottom: 10px; }
.delete-confirm-input:focus { outline: none; border-color: #e25c3a; }
.btn-delete-confirm { background: #c0392b; color: #fff; border: none; padding: 9px 18px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-delete-confirm:hover:not(:disabled) { background: #a93226; }
.btn-delete-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-delete-cancel { background: none; border: 0.5px solid #f9c4b6; color: #9b1c1c; padding: 9px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: inherit; }
/* Orphaned-file report. Persistent, because the build it refers to is gone
   and a toast would take the paths with it. */
.orphan-warn { background: #fef6e7; border: 0.5px solid #f0c674; border-radius: 8px; padding: 18px 20px; }
.orphan-warn-title { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a5a00; margin-bottom: 8px; }
.orphan-warn-body { font-size: 12px; color: #6b4a1e; line-height: 1.7; }
.orphan-warn-body code { font-size: 10.5px; background: #fff; padding: 1px 5px; border-radius: 3px; display: inline-block; margin: 2px 0; }

.notif-preview { background: #fafaf8; border: 0.5px solid #e5e5e5; border-radius: 6px; padding: 14px 16px; margin-top: 14px; }
.notif-preview-label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #bbb; margin-bottom: 8px; }
.notif-preview-body { font-size: 12px; color: #555; line-height: 1.7; }

.reviewed-banner { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
.reviewed-banner.approved { background: #e8f5ee; border: 0.5px solid #86cfad; }
.reviewed-banner.rejected { background: #fde8e2; border: 0.5px solid #f9c4b6; }
.rb-text { font-size: 13px; font-weight: 700; }
.reviewed-banner.approved .rb-text { color: #166534; }
.reviewed-banner.rejected .rb-text { color: #9b1c1c; }
.rb-sub { font-size: 11px; margin-top: 2px; }
.reviewed-banner.approved .rb-sub { color: #15803d; }
.reviewed-banner.rejected .rb-sub  { color: #b91c1c; }
.btn-undo { font-size: 11px; background: none; border: 0.5px solid currentColor; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: 600; }
.reviewed-banner.approved .btn-undo { color: #166534; }
.reviewed-banner.rejected .btn-undo { color: #9b1c1c; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1a1a; color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.toast-dot.green { background: #22a06b; }
.toast-dot.red   { background: #e25c3a; }
.toast-dot.blue  { background: #4a9edd; }
.toast-dot.amber { background: #d97706; }
.nav-toggle { display: none; background: none; border: 0; padding: 8px; margin: 0 -8px 0 0; cursor: pointer; }
.nav-toggle span { display: block; width: 20px; height: 2px; background: #e8e6e1; border-radius: 2px; }
.nav-toggle span + span { margin-top: 4px; }

<script src="js/build-url.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/category-map.js"></script>
<script src="js/build-categories.js"></script>
<script src="js/variant-label.js"></script>
<script>
// admin nav is intentionally NOT the shared nav (distinct admin-only links +
// Admin tag) so nav.js is not loaded here. Same for the footer: admin has none.
var sb = window.sb;
var SUPABASE_URL = 'https://lagjjcpclvzrjlrswojt.supabase.co';  // for photoUrl helper below

// Session watchdog: catches sign-outs (from another tab, or here) and
// silent token-refresh failures so the user doesn't sit on a stale UI.
sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)) {
    window.location.href = 'gunforma-signin.html';
  }
});

let currentAdmin = null;
let BUILDS = [];
// productId -> primary_image_url from the default variant. Populated by
// loadProductImages after loadBuilds so the review pane can show a small
// thumbnail alongside each catalog-picked part.
let IMAGE_BY_PRODUCT_ID = {};
let filterState = 'pending';
let selectedId = null;
let currentAdminUsername = 'Admin';
let editOpenKey = null; // buildId+'-'+partIndex of the currently open edit panel
// "Link to existing part": one panel open at a time, keyed buildId+'-'+index.
// The index is the part's ORIGINAL index in parts_snapshot — parts render in
// stored order here, so the map index IS it.
let LINK = { key: null, q: '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
let CATALOG = null;   // { products: [...], brands: {id: name} } — loaded on first use
let currentDetailUser = '';
let currentDetailName = '';

// edit_history lives on the real build row (builds.edit_history jsonb),
// fetched fresh with every loadBuilds() call — no separate client-side
// store anymore.
function partHistory(build, idx) {
  return (build.edit_history || []).filter(function(e){ return e.part_index === idx; });
}
// Resolves the current value of a field: to_value of the most recent edit
// for that field, falling back to the original parts_snapshot value.
function currentPartValue(build, idx, field, original) {
  var history = partHistory(build, idx);
  for (var i = history.length - 1; i >= 0; i--) {
    if (history[i].field === field) return history[i].to_value;
  }
  return original || '';
}
function buildEditedPartCount(build) {
  var seen = {};
  (build.edit_history || []).forEach(function(e){ seen[e.part_index] = true; });
  return Object.keys(seen).length;
}
function buildHasContestedEdit(build) {
  return (build.edit_history || []).some(function(e){ return e.status === 'contested'; });
}

function photoUrl(path) { return SUPABASE_URL + '/storage/v1/object/public/build-photos/' + path; }

function relTime(iso) {
  if (!iso) return '—';
  var diffMs = Date.now() - new Date(iso).getTime();
  var mins = Math.max(0, Math.round(diffMs/60000));
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins/60);
  if (hrs < 24)  return hrs + ' hr ago';
  var days = Math.round(hrs/24);
  return days + ' day' + (days!==1?'s':'') + ' ago';
}
function escH(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/'/g,'&#39;'); }

// ============================================================
// AUTH GUARD — must be signed in AND profiles.role = 'admin'
// ============================================================
async function requireAdmin() {
  const { data } = await sb.auth.getSession();
  const session = data && data.session;
  if (!session) { window.location.href = 'gunforma-signin.html'; return false; }
  // role is not readable from profiles table-wide; get_my_profile() returns
  // the caller's own row only (audit finding #5).
  const { data: profile } = await sb.rpc('get_my_profile').maybeSingle();
  // Any auth'd user without a completed profile gets bounced through
  // onboarding first — even an admin can't run the queue with no username.
  if (profile && !profile.onboarding_complete) { window.location.href = 'gunforma-complete-profile.html'; return false; }
  if (!profile || profile.role !== 'admin') { window.location.href = 'gunforma-signin.html'; return false; }
  currentAdmin = session.user;
  currentAdminUsername = profile.username || 'Admin';
  return true;
}

// ============================================================
// DATA — real builds, joined with the submitter's profile, the
// pistol platform, and every attached photo.
// ============================================================
// Batch-fetch default-variant image URLs for every catalog-picked part
// across all currently-loaded builds. One query regardless of build count.
async function loadProductImages() {
  const refIds = new Set();
  BUILDS.forEach(function(b) {
    (b.parts_snapshot || []).forEach(function(p) { if (p.refId) refIds.add(p.refId); });
  });
  if (!refIds.size) return;
  const { data, error } = await sb
    // Live variants only, default preferred in JS rather than filtered
    // server-side — a retired default variant would otherwise leave the part
    // with no thumbnail at all.
    .from('product_variants')
    .select('product_id, primary_image_url, is_default')
    .is('retired_at', null)
    .in('product_id', Array.from(refIds));
  if (error) { console.error('loadProductImages', error); return; }
  (data || []).forEach(function(v) {
    if (!v.primary_image_url) return;
    if (!IMAGE_BY_PRODUCT_ID[v.product_id] || v.is_default) {
      IMAGE_BY_PRODUCT_ID[v.product_id] = v.primary_image_url;
    }
  });
}

// One field list for the queue load and for doApprove()'s re-read, so the
// two can never select different things and compare unequal by construction.
// user_id says whether anyone owns the build (it decides "Edit build");
// platform_id and updated_at are there for reviewSignature() and the
// approve guard.
const BUILD_FIELDS = 'id,user_id,platform_id,updated_at,name,tier,status,activities,description,legal_confirmed,content_license_confirmed,builder_agreement_version,created_at,reviewed_at,rejection_reason,parts_snapshot,edit_history,platforms(name),profiles!builds_user_id_fkey(username),build_photos(id,storage_path,thumb_path,is_hero,position)';

// Everything a reviewer is approving, as one comparable string: the words,
// the pistol, the parts and WHICH photos. Two reads of an unchanged build
// produce the same string — parts_snapshot comes back from jsonb in
// Postgres's own key order both times, and photos are sorted by id here
// because PostgREST returns embedded rows in arbitrary order.
//
// Photos are in it by id AND path on purpose. A builder can add or remove a
// photo on a build in review without touching the builds row at all, so
// builds.updated_at alone would not see the one change that most needs a
// second look.
function reviewSignature(b) {
  return JSON.stringify({
    name: b.name || '',
    description: b.description || '',
    activities: b.activities || [],
    platform: b.platform_id || null,
    parts: b.parts_snapshot || [],
    photos: (b.build_photos || []).map(function (p) { return p.id + ':' + (p.storage_path || '') + ':' + (p.is_hero ? 1 : 0); }).sort(),
  });
}

async function loadBuilds() {
  const { data, error } = await sb
    .from('builds')
    .select(BUILD_FIELDS)
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    document.getElementById('queue-list').innerHTML = '<div style="padding:28px;text-align:center;color:#c25d3a;font-size:12px;">Couldn\'t load the queue — refresh to try again.</div>';
    return;
  }

  BUILDS = (data || []).map(function(b) {
    b.build_photos = (b.build_photos || []).slice().sort(function(x,y){ return x.position - y.position; });
    return b;
  });

  await loadProductImages();
  renderQueue();
  if (selectedId) {
    var b = BUILDS.find(function(x){ return x.id===selectedId; });
    if (b) renderDetail(b);
    else { selectedId = null; document.getElementById('detail-panel').innerHTML = emptyDetailHtml(); }
  }
}

function emptyDetailHtml() {
  return '<div class="detail-empty"><div style="font-size:36px;color:#ddd;">←</div><div class="detail-empty-text">Select a build from the queue<br>to start reviewing it.</div></div>';
}

// ============================================================
// QUEUE
// ============================================================
function setFilter(btn, f) {
  document.querySelectorAll('.filter-tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  filterState = f;
  renderQueue();
}

function renderQueue() {
  var filtered = BUILDS.filter(function(b){ return filterState==='all'||b.status===filterState; });
  var pending  = BUILDS.filter(function(b){ return b.status==='pending'; }).length;
  var approved = BUILDS.filter(function(b){ return b.status==='approved'; }).length;
  document.getElementById('queue-count').textContent   = pending+' pending';
  document.getElementById('stat-pending').textContent  = pending;
  document.getElementById('stat-approved').textContent = approved;
  document.getElementById('stat-all').textContent      = BUILDS.length;

  if (!filtered.length) { document.getElementById('queue-list').innerHTML='<div style="padding:28px;text-align:center;color:#bbb;font-size:12px;">Nothing here.</div>'; return; }

  document.getElementById('queue-list').innerHTML = filtered.map(function(b) {
    var isSel = b.id===selectedId;
    var badgeClass, badgeText;
    if      (b.status==='approved') { badgeClass='approved'; badgeText='Approved'; }
    else if (b.status==='rejected') { badgeClass='rejected'; badgeText='Rejected'; }
    else                            { badgeClass=b.tier;     badgeText=b.tier==='full'?'Full':'Minimum'; }
    var partsCount    = (b.parts_snapshot||[]).length;
    var photoCount    = (b.build_photos||[]).length;
    var platformName  = b.platforms ? b.platforms.name : 'Unknown pistol';
    var username      = b.profiles ? b.profiles.username : 'unknown';
    var contestedNote = buildHasContestedEdit(b) ? '<div class="qi-contested-note">⚠ A visitor flagged a correction for review</div>' : '';

    return '<div class="queue-item'+(isSel?' selected':'')+'" onclick="selectBuild(\''+b.id+'\')">'+
      '<div class="qi-top"><span class="qi-name">'+escH(b.name)+'</span><span class="qi-badge '+badgeClass+'">'+badgeText+'</span></div>'+
      '<div class="qi-meta">'+escH(platformName)+' · '+escH(username)+'</div>'+
      '<div class="qi-tags">'+(b.activities||[]).map(function(a){ return '<span class="qi-tag">'+escH(a)+'</span>'; }).join('')+'</div>'+
      '<div class="qi-time">'+relTime(b.created_at)+' · '+photoCount+' photo'+(photoCount!==1?'s':'')+' · '+(partsCount?partsCount+' parts':'no parts')+'</div>'+
      contestedNote+
    '</div>';
  }).join('');
}

// ============================================================
// DETAIL
// ============================================================
function selectBuild(id) {
  selectedId = id;
  renderQueue();
  var b = BUILDS.find(function(x){ return x.id===id; });
  if (b) { markReviewed(b); renderDetail(b); }
}

function renderDetail(b) {
  var isPending    = b.status==='pending';
  var platformName = b.platforms ? b.platforms.name : 'Unknown pistol';
  var username      = b.profiles ? b.profiles.username : 'unknown';
  currentDetailUser = username;
  currentDetailName = b.name;

  var photos  = b.build_photos || [];
  var hero    = photos.find(function(p){ return p.is_hero; }) || photos[0];
  var gallery = photos.filter(function(p){ return p !== hero; });

  var heroHtml = hero
    ? '<div class="detail-photo-hero"><img src="'+photoUrl(hero.storage_path)+'" alt="" /></div>'
    : '<div class="detail-photo-hero">No hero photo</div>';
  var thumbsHtml = gallery.length
    ? '<div class="detail-photo-thumbs">'+gallery.map(function(p){
        return '<div class="detail-photo-thumb"><img src="'+photoUrl(p.thumb_path)+'" alt="" /></div>';
      }).join('')+'</div>'
    : '';

  var parts = b.parts_snapshot || [];
  var partsHtml;
  if (!parts.length) {
    partsHtml = '<div class="no-parts-note">No parts listed — minimum build. You can still approve or reject based on photos and description.</div>';
  } else {
    partsHtml = '<div class="simple-parts-list">'+parts.map(function(p, i) {
      var history = partHistory(b, i);
      var dCat   = currentPartValue(b, i, 'category', p.category);
      var dBrand = currentPartValue(b, i, 'brand', p.brand);
      var dName  = currentPartValue(b, i, 'name', p.name);
      // The builder's free-text variant/colour note. Resolved through
      // currentPartValue() like the other three, which works because
      // partHistory/currentPartValue/doSaveEdit are all data-driven on the
      // field NAME — nothing is hard-coded to the original three.
      var dVar   = currentPartValue(b, i, 'variant', p.variant);
      var isEditOpen = editOpenKey === (b.id+'-'+i);

      var editBtnHtml = isPending
        ? '<button class="btn-edit-inline" onclick="doToggleEdit(\''+b.id+'\','+i+')">'+(isEditOpen?'Close':'Edit')+'</button>'
        : '';

      var historyHtml = history.length
        ? '<div class="part-edit-history">'+history.map(function(h) {
            var contestedTag = h.status==='contested' ? '<span class="contested-tag">⚠ Contested by visitor</span>' : '';
            return '<div><strong>'+escH(h.field)+'</strong> corrected: "'+escH(h.from_value)+'" → "'+escH(h.to_value)+'" — '+escH(h.edited_by)+', '+relTime(h.edited_at)+contestedTag+'</div>';
          }).join('')+'</div>'
        : '';

      var editPanelHtml = isEditOpen
        ? '<div class="part-edit-panel open">'+
            '<div class="part-edit-grid">'+
              '<div><label class="part-edit-label">Category</label><input class="part-edit-input" type="text" id="pe-cat-'+b.id+'-'+i+'" value="'+escH(dCat)+'" /></div>'+
              '<div><label class="part-edit-label">Brand</label><input class="part-edit-input" type="text" id="pe-brand-'+b.id+'-'+i+'" value="'+escH(dBrand)+'" /></div>'+
            '</div>'+
            '<div><label class="part-edit-label">Part name</label><input class="part-edit-input" type="text" id="pe-name-'+b.id+'-'+i+'" value="'+escH(dName)+'" /></div>'+
            '<div style="margin-top:8px;"><label class="part-edit-label">Variant / colour</label><input class="part-edit-input" type="text" maxlength="60" id="pe-variant-'+b.id+'-'+i+'" value="'+escH(dVar)+'" /></div>'+
            '<div class="part-edit-actions">'+
              '<button class="btn-edit-save" onclick="doSaveEdit(\''+b.id+'\','+i+')">Save correction →</button>'+
              '<button class="btn-edit-close" onclick="doToggleEdit(\''+b.id+'\','+i+')">Cancel</button>'+
            '</div>'+
          '</div>'
        : '';

      // Thumbnail from the default variant's primary_image_url. Hand-typed
      // pending parts have no refId → fallback slot lets the admin see at a
      // glance which rows need catalog cross-checking.
      var thumbUrl = p.refId ? IMAGE_BY_PRODUCT_ID[p.refId] : null;
      var alt = ((dBrand ? dBrand+' ' : '') + (dName || '')).replace(/"/g, '&quot;');
      var thumbHtml = thumbUrl
        ? '<div class="simple-part-thumb"><img src="'+thumbUrl+'" alt="'+alt+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;simple-part-thumb-fallback&quot;>No photo</div>\'"/></div>'
        : '<div class="simple-part-thumb"><div class="simple-part-thumb-fallback">'+(p.pending?'Pending':'No photo')+'</div></div>';

      return '<div class="simple-part-row">'+
        '<div class="simple-part-main">'+
          thumbHtml +
          '<div class="simple-part-cat">'+escH(dCat||'—')+'</div>'+
          '<div><div class="simple-part-name">'+escH(dName||'Unnamed part')+(p.pending?'<span class="simple-part-pending-tag">Pending catalog review</span>':'')+(history.length?'<span class="edited-flag">Edited</span>':'')+'</div>'+
          '<div class="simple-part-brand">'+escH(dBrand||'')+
            (dVar ? '<span class="simple-part-variant">'+escH(dVar)+'</span>' : '')+'</div></div>'+
        '</div>'+
        '<div class="simple-part-actions">'+editBtnHtml+'</div>'+
        catalogActionsHtml(b, p, i, history)+
        editPanelHtml+
        historyHtml+
      '</div>';
    }).join('')+'</div>';
  }

  var consentHtml = '<div class="consent-row">'+
    '<span class="consent-item">Legal confirmed: <strong>'+(b.legal_confirmed?'Yes':'No')+'</strong></span>'+
    '<span class="consent-item">Content license confirmed: <strong>'+(b.content_license_confirmed?'Yes':'No')+'</strong></span>'+
    (b.builder_agreement_version ? '<span class="consent-item">Agreement version: <strong>'+escH(b.builder_agreement_version)+'</strong></span>' : '')+
  '</div>';

  var editedPartCount = buildEditedPartCount(b);
  var approveNotif = 'Hi <strong>'+escH(username)+'</strong>, your build <strong>"'+escH(b.name)+'"</strong> has been approved and is now live on Gunforma. Thanks for contributing.'+
    (editedPartCount ? ' We corrected '+editedPartCount+' part'+(editedPartCount!==1?'s':'')+' on your build for accuracy — view what changed.' : '');

  var reviewedBanner = '';
  if (b.status==='approved') reviewedBanner='<div class="reviewed-banner approved"><div><div class="rb-text">Approved — Build is live</div><div class="rb-sub">Reviewed '+relTime(b.reviewed_at)+' · <a href="'+buildPath(b.id, b.name)+'" target="_blank" style="color:inherit;">View public page →</a></div></div><button class="btn-undo" onclick="doUndo(\''+b.id+'\')">Undo</button></div>';
  if (b.status==='rejected') reviewedBanner='<div class="reviewed-banner rejected"><div><div class="rb-text">Rejected — '+escH(b.rejection_reason||'')+'</div><div class="rb-sub">Reviewed '+relTime(b.reviewed_at)+'</div></div><button class="btn-undo" onclick="doUndo(\''+b.id+'\')">Undo</button></div>';

  // WHO CAN EDIT THIS BUILD, said out loud, because the answer differs and
  // an admin staring at a wrong parts list needs to know which it is:
  //
  //   no owner  — posted from gunforma-admin-post.html and not claimed. Only
  //               an admin can change it, so the whole-build editor is
  //               offered here. (It was offered nowhere: the per-part "Edit"
  //               below writes a correction, it cannot add a part or a
  //               photo, and Undo only moved the build back to pending.)
  //   an owner  — theirs to edit, not ours. While it is pending they can
  //               still change it; every write here re-checks for that
  //               (ensureUnchanged).
  //               Once it is live they are limited to name, description and
  //               activity, so "Undo" is how a builder gets their parts list
  //               back: pending again, they fix it, it is approved again.
  var unowned = !b.user_id;
  var editBuildHtml = unowned
    ? '<div class="detail-edit">'+
        '<a class="btn-catalog primary" href="gunforma-post-build.html?id='+encodeURIComponent(b.id)+'&mode=edit">Edit build →</a>'+
        '<div class="catalog-reason">Posted from the admin page and not claimed, so only an admin can edit it. Parts, photos and details; the status stays '+escH(b.status)+'.</div>'+
      '</div>'
    : (isPending
      ? '<div class="detail-edit"><div class="catalog-reason">'+escH(username)+' can still edit this build while it is in review. Approve, reject, corrections and links all re-check it first — if it changed, the queue reloads and asks you to look again.</div></div>'
      : (b.status==='approved'
        ? '<div class="detail-edit"><div class="catalog-reason">Live: '+escH(username)+' can change the name, description and activity. To let them change parts or photos, use Undo — it goes back to pending, they edit it, you approve it again.</div></div>'
        : ''));

  var html =
    '<div class="detail-content">'+
    '<div class="detail-top"><div>'+
      '<div class="detail-eyebrow">'+(unowned ? 'Posted by an admin · not claimed' : 'Submitted by '+escH(username))+' · '+relTime(b.created_at)+'</div>'+
      '<div class="detail-title">'+escH(b.name)+'</div>'+
      '<div class="detail-submeta">'+
        '<span class="detail-submeta-item"><strong>'+escH(platformName)+'</strong></span>'+
        '<span class="detail-submeta-item">'+(b.activities||[]).map(escH).join(', ')+'</span>'+
        '<span class="tier-badge '+b.tier+'">'+b.tier+' build</span>'+
      '</div>'+
    '</div>'+editBuildHtml+'</div>'+
    reviewedBanner+
    '<div class="detail-section"><div class="detail-section-title">Photos ('+photos.length+')</div><div class="detail-photos">'+heroHtml+thumbsHtml+'</div></div>'+

    '<div class="detail-section"><div class="detail-section-title">Consent</div>'+consentHtml+'</div>'+
    '<div class="detail-section"><div class="detail-section-title">Parts ('+parts.length+')</div>'+partsHtml+'</div>';

  if (isPending) {
    html +=
      '<div class="detail-section"><div class="review-card">'+
        '<div class="review-card-title">Final decision</div>'+
        '<div class="review-card-sub">Review the photos, description, and parts above, then approve or reject.</div>'+
        '<div class="review-actions-row">'+
          '<button class="btn-approve" onclick="doApprove(\''+b.id+'\')">Approve &amp; publish →</button>'+
          '<button class="btn-reject" onclick="openRejectForm()">Reject with reason</button>'+
        '</div>'+
        '<div class="reject-form" id="reject-form">'+
          '<label class="reject-form-label">Select a reason</label>'+
          '<div class="reject-reasons">'+
          ['No photos uploaded','Blurry or unusable photos','No parts listed','Incomplete description','Possible prohibited content','Custom parts need verification'].map(function(r){
            return '<label class="reject-reason"><input type="radio" name="rr" value="'+escH(r)+'" onchange="updateNotifPreview(this.value)" /> '+r+'</label>';
          }).join('')+
          '</div>'+
          '<textarea class="reject-note" id="reject-note" placeholder="Optional — add a specific note for the user…"></textarea>'+
          '<div class="reject-row">'+
            '<button class="btn-reject-confirm" onclick="doReject(\''+b.id+'\')">Confirm rejection →</button>'+
            '<button class="btn-reject-cancel" onclick="closeRejectForm()">Cancel</button>'+
          '</div>'+
        '</div>'+
        '<div class="notif-preview"><div class="notif-preview-label">Preview — what '+escH(username)+' would see once notifications are built</div>'+
        '<div class="notif-preview-body" id="notif-text">'+approveNotif+'</div></div>'+
      '</div></div>';
  }

  // Delete is offered for every status, not just pending: test posts,
  // duplicates and takedown requests are mostly already approved.
  html += dangerZoneHtml(b);

  html += '</div>';
  document.getElementById('detail-panel').innerHTML = html;
}

// Delete, behind a typed confirmation. The expected name rides on a data
// attribute rather than being interpolated into an onclick string — build
// names are user-supplied and contain quotes and apostrophes often enough
// that string-building the handler would break on exactly the builds an
// admin most wants to remove.
function dangerZoneHtml(b) {
  var photoCount = (b.build_photos || []).length;
  var fileCount  = (b.build_photos || []).reduce(function (n, p) {
    return n + (p.storage_path ? 1 : 0) + (p.thumb_path ? 1 : 0);
  }, 0);

  return '<div class="detail-section"><div class="danger-zone">'+
    '<div class="danger-zone-title">Danger zone</div>'+
    '<div class="danger-zone-sub">Deleting is permanent and cannot be undone from this page. '+
      'Use it for test posts, duplicates and takedown requests — to take a live build off the '+
      'site without destroying it, use <code>Undo</code> to move it back to pending instead.</div>'+
    '<button class="btn-delete" onclick="openDeleteForm()">Delete this build…</button>'+
    '<div class="delete-form" id="delete-form">'+
      '<label class="delete-form-label">This will permanently delete</label>'+
      '<div class="delete-cascade-list">'+
        '• the build row<br>'+
        '• its ' + photoCount + ' photo record(s), and ' + fileCount + ' file(s) from storage<br>'+
        '• every comment, vote, like, saved-build entry and notification attached to it'+
      '</div>'+
      '<label class="delete-form-label">Type the build name to confirm</label>'+
      '<div class="danger-zone-sub" style="margin-bottom:8px;"><code>'+escH(b.name||'')+'</code></div>'+
      '<input class="delete-confirm-input" id="delete-confirm-input" type="text" autocomplete="off" '+
        'placeholder="Build name" data-expect="'+escH((b.name||'').trim())+'" oninput="refreshDeleteBtn()" />'+
      '<div class="reject-row">'+
        '<button class="btn-delete-confirm" id="delete-confirm-btn" disabled onclick="doDelete(\''+b.id+'\')">Delete permanently</button>'+
        '<button class="btn-delete-cancel" onclick="closeDeleteForm()">Cancel</button>'+
      '</div>'+
    '</div>'+
  '</div></div>';
}

// the point of a typed confirmation is that it cannot be satisfied by

// ============================================================
// ACTIONS — real updates to builds.status, gated by the
// admin-only RLS policy and stamped server-side by the DB trigger.
// ============================================================
// A BUILD IN REVIEW HAS TWO WRITERS, and this page is the slow one.
//
// A builder can edit their build while it is pending (gunforma-post-build
// .html, edit mode). This page loads once and then sits open, so every write
// it makes is made against a copy that may be minutes old:
//
//   Approve              would publish a description, a parts list or a
//                        photo swapped in after the reviewer last looked.
//   Reject               would reject, for the old reason, a build the
//                        builder fixed a moment ago.
//   Save correction,     address a part by its INDEX in parts_snapshot. If
//   Link to existing     the builder removed an earlier part, index 2 is a
//                        different part now, and the correction or the
//                        catalog link lands on it. No error anywhere.
//
// So each of them goes through ensureUnchanged() first, and the two that
// write the builds row directly are also conditional on updated_at.
//
// WHAT "UNCHANGED" IS COMPARED WITH: REVIEWED[id], the build as the reviewer
// was last SHOWN it and told about it — not BUILDS, the copy in memory.
// The difference is the whole point. loadBuilds() runs after every action
// on this page and silently swaps fresh rows into BUILDS, so comparing with
// BUILDS would let "save a correction, then approve" publish whatever the
// builder changed in between: fresh would be compared with fresh.
// REVIEWED moves in exactly three places, each of them a moment the
// reviewer is knowingly looking at new content:
//   selectBuild()        they opened the build
//   ensureUnchanged()    it refused, said so, and re-rendered the pane
//   doLink()             their own link changed the parts
var REVIEWED = {};   // build id -> reviewSignature() of what was shown
function markReviewed(b) { if (b) REVIEWED[b.id] = reviewSignature(b); }

// Re-reads the build and returns the fresh row, or null after saying why
// not. `verb` finishes the sentence the reviewer reads ("…then approve.").
async function ensureUnchanged(id, verb) {
  var seen = BUILDS.find(function(x){ return x.id===id; });
  if (!seen) return null;

  const { data: fresh, error } = await sb.from('builds').select(BUILD_FIELDS).eq('id', id).maybeSingle();
  if (error) { console.error(error); showToast('red','Could not re-check the build — nothing was changed'); return null; }
  if (!fresh) {
    showToast('red','This build no longer exists — queue reloaded');
    await loadBuilds();
    return null;
  }

  var statusMoved = fresh.status !== seen.status;
  var shown = REVIEWED[id] || reviewSignature(seen);
  if (statusMoved || reviewSignature(fresh) !== shown) {
    await loadBuilds();
    // They are being told, and the pane now shows the new version — so this
    // is what they have been shown. Without it the next click would refuse
    // again, forever.
    markReviewed(BUILDS.find(function(x){ return x.id===id; }));
    showToast('red', statusMoved
      ? 'This build is no longer ' + seen.status + ' — queue reloaded. Nothing was changed.'
      : 'This build was edited after you opened it — reloaded. Review it again, then ' + verb + '.');
    return null;
  }
  return fresh;
}

// Both steps, because they catch different things:
//   1. ensureUnchanged() compares content, which is the one that sees a
//      photo change (a photo row can change without touching builds).
//   2. the UPDATE is conditional on status and on the updated_at that
//      re-read returned, and counts the rows it wrote. This closes the gap
//      between the re-read and the write for anything on the builds row.
async function doApprove(id) {
  const fresh = await ensureUnchanged(id, 'approve');
  if (!fresh) return;

  const { data: approved, error } = await sb.from('builds')
    .update({ status: 'approved' })
    .eq('id', id)
    .eq('status', 'pending')
    .eq('updated_at', fresh.updated_at)
    .select('id');
  if (error) { console.error(error); showToast('red','Something went wrong'); return; }
  if (!Array.isArray(approved) || approved.length !== 1) {
    showToast('red','This build changed while you were approving it — reloaded. Nothing was approved.');
    await loadBuilds();
    return;
  }
  showToast('green','Build approved');
  await loadBuilds();
}
async function doReject(id) {
  var sel = document.querySelector('input[name="rr"]:checked');
  if (!sel) { showToast('red','Select a rejection reason first'); return; }
  var note = document.getElementById('reject-note').value.trim();
  var reason = sel.value + (note ? ' — ' + note : '');

  // After the form is read: a refusal re-renders the pane and the form with it.
  const fresh = await ensureUnchanged(id, 'reject');
  if (!fresh) return;

  const { data: rejected, error } = await sb.from('builds')
    .update({ status: 'rejected', rejection_reason: reason })
    .eq('id', id)
    .eq('status', 'pending')
    .eq('updated_at', fresh.updated_at)
    .select('id');
  if (error) { console.error(error); showToast('red','Something went wrong'); return; }
  if (!Array.isArray(rejected) || rejected.length !== 1) {
    showToast('red','This build changed while you were rejecting it — reloaded. Nothing was rejected.');
    await loadBuilds();
    return;
  }
  showToast('red','Build rejected');
  await loadBuilds();
}
async function doUndo(id) {
  const { error } = await sb.from('builds').update({ status: 'pending' }).eq('id', id);
  if (error) { console.error(error); showToast('red','Something went wrong'); return; }
  showToast('blue','Moved back to pending');
  await loadBuilds();
}

// Permanent delete, covered by the "Admins can delete any build" RLS policy
// (DELETE on builds, using is_admin(), to authenticated).
//
// Everything that references builds cascades — build_photos, build_comments,
// build_fires, notifications and saved_builds are all ON DELETE CASCADE — so
// no foreign key can block this and no child rows are left behind. Storage
// objects are the exception: nothing in the database knows about them, so
// they are removed here by hand.
async function doDelete(id) {
  var b = BUILDS.find(function(x){ return x.id===id; });
  if (!b) return;

  var input = document.getElementById('delete-confirm-input');
  var typed = ((input && input.value) || '').trim();
  if (typed !== (b.name || '').trim()) {
    showToast('red','Type the build name exactly to confirm');
    return;
  }

  var btn = document.getElementById('delete-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }

  // Collect the storage paths BEFORE deleting. build_photos cascades away
  // with the build, and once those rows are gone nothing records where the
  // files were — an orphan nobody can name is an orphan nobody can clean up.
  var paths = [];
  (b.build_photos || []).forEach(function(p) {
    if (p.storage_path) paths.push(p.storage_path);
    if (p.thumb_path)   paths.push(p.thumb_path);
  });

  // Row first, files second. The other order risks deleting the photos of a
  // build that then survives the delete, and a live build with broken images
  // is worse than an orphaned object in a bucket.
  //
  // .select('id') so the DELETE returns what it removed. An RLS-filtered
  // DELETE matches zero rows and reports no error, so checking only `error`
  // would show "deleted" for a build that is still there — the same check
  // gunforma-admin-post.html's rollback makes, for the same reason.
  const { data: deleted, error } = await sb.from('builds').delete().eq('id', id).select('id');
  if (error) {
    console.error(error);
    if (btn) { btn.disabled = false; btn.textContent = 'Delete permanently'; }
    showToast('red', 'Delete failed — ' + (error.code ? error.code + ': ' : '') + (error.message || 'see console'));
    return;
  }
  if (!Array.isArray(deleted) || deleted.length !== 1) {
    // No error and no row: RLS refused it. Nothing was deleted, and no files
    // have been touched yet, so there is nothing to clean up.
    console.error('delete matched no rows', { id: id, returned: deleted });
    if (btn) { btn.disabled = false; btn.textContent = 'Delete permanently'; }
    showToast('red', 'Delete refused — no row was removed (admin policy?). Nothing was changed.');
    return;
  }

  // Files. The build is already gone at this point, so a failure here is
  // reported rather than treated as a failed delete.
  var orphans = [];
  var storageErr = null;
  if (paths.length) {
    const { error: sErr } = await sb.storage.from('build-photos').remove(paths);
    if (sErr) { storageErr = sErr; orphans = paths; console.error('storage delete failed', sErr, paths); }
  }

  selectedId = null;
  await loadBuilds();

  if (orphans.length) {
    // Persistent, not a toast: the build is gone, so these paths exist
    // nowhere else now and the admin needs them to finish the job by hand.
    document.getElementById('detail-panel').innerHTML =
      '<div class="detail-section"><div class="orphan-warn">'+
        '<div class="orphan-warn-title">Build deleted — but its files were not</div>'+
        '<div class="orphan-warn-body">'+
          'The build row and everything referencing it are gone. '+
          orphans.length + ' file(s) could not be removed from the <code>build-photos</code> bucket '+
          'and are now orphaned: <br><strong>'+escH(storageErr && storageErr.message || 'unknown storage error')+'</strong><br><br>'+
          'Delete these by hand in the Supabase dashboard — they are listed here because '+
          'nothing records them any more:<br>'+
          orphans.map(function(p){ return '<code>'+escH(p)+'</code>'; }).join('<br>')+
        '</div>'+
      '</div></div>';
    showToast('red', 'Build deleted — ' + orphans.length + ' file(s) left orphaned, see panel');
    return;
  }

  showToast('green', 'Build deleted' + (paths.length ? ' — ' + paths.length + ' file(s) removed' : ''));
}
function doToggleEdit(buildId, idx) {
  var key = buildId+'-'+idx;
  editOpenKey = (editOpenKey === key) ? null : key;
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  if (b) renderDetail(b);
}
// Appends diff entries to the real builds.edit_history column (admin-only
// write, covered by the existing "Admins can review and edit any build"
// RLS policy) — parts_snapshot itself is never touched.
async function doSaveEdit(buildId, idx) {
  var b = BUILDS.find(function(x){ return x.id===buildId; });
  if (!b) return;
  var part = (b.parts_snapshot||[])[idx];
  if (!part) return;

  var fields = [
    { key: 'category', inputId: 'pe-cat-'+buildId+'-'+idx },
    { key: 'brand',     inputId: 'pe-brand-'+buildId+'-'+idx },
    { key: 'name',      inputId: 'pe-name-'+buildId+'-'+idx },
    { key: 'variant',   inputId: 'pe-variant-'+buildId+'-'+idx },
  ];

  var newEntries = [];
  fields.forEach(function(f) {
    var input = document.getElementById(f.inputId);
    if (!input) return;
    var newVal = input.value.trim();
    var curVal = currentPartValue(b, idx, f.key, part[f.key]);
    if (newVal && newVal !== curVal) {
      newEntries.push({
        part_index: idx,
        field: f.key,
        from_value: curVal,
        to_value: newVal,
        edited_by: currentAdminUsername,
        edited_at: new Date().toISOString(),
        status: 'active',
      });
    }
  });

  if (!newEntries.length) {
    editOpenKey = null;
    renderDetail(b);
    showToast('blue', 'No changes to save');
    return;
  }

  // A correction names its part by index, so it is only safe against the
  // list the reviewer is looking at — see ensureUnchanged(). The inputs were
  // read above, before this can re-render the pane.
  // Closed first: a refusal re-renders the pane, and an edit panel left open
  // over the reloaded list would be pointing at whatever now sits at idx.
  editOpenKey = null;
  const fresh = await ensureUnchanged(buildId, 'save the correction');
  if (!fresh) return;

  // Appended to the history just re-read, not the copy in memory, and
  // written only if the row is still that one.
  var updatedHistory = (fresh.edit_history || []).concat(newEntries);
  const { data: written, error } = await sb.from('builds')
    .update({ edit_history: updatedHistory })
    .eq('id', buildId)
    .eq('updated_at', fresh.updated_at)
    .select('id');
  if (error) { console.error(error); showToast('red', 'Something went wrong'); return; }
  if (!Array.isArray(written) || written.length !== 1) {
    editOpenKey = null;
    showToast('red', 'This build changed while you were saving — reloaded. The correction was not saved.');
    await loadBuilds();
    return;
  }

  editOpenKey = null;
  showToast('blue', 'Correction saved — '+newEntries.length+' field'+(newEntries.length!==1?'s':'')+' updated');
  await loadBuilds();
}

function openRejectForm()  { var f=document.getElementById('reject-form'); if(f) f.classList.add('open'); }
function closeRejectForm() { var f=document.getElementById('reject-form'); if(f) f.classList.remove('open'); }

  var el = document.getElementById('notif-text');
  if (el) el.innerHTML='Hi <strong>'+escH(currentDetailUser)+'</strong>, your build <strong>"'+escH(currentDetailName)+'"</strong> needs a small update — <em>'+escH(reason)+'</em>. Use the link below to edit and resubmit.';
}

function showToast(color, msg) {

// ============================================================
// PENDING PARTS → THE CATALOG
// A pending custom part (pending, no refId) gets two actions: "Add to
// catalog" sends it to gunforma-admin-part.html with the build and its
// ORIGINAL index, so Save re-links it; "Link to existing part" swaps it for
// a product already in the catalog through relink_build_part(). A part
// whose section has no catalog category gets a reason line instead.
// ============================================================
function partSection(raw) {
  var BC = window.BuildCategories;
  var key = BC.sectionKeyFor(raw);
  var sec = BC.CATEGORIES.find(function (c) { return c.key === key; });
  return { key: key, label: sec ? sec.label : BC.categoryLabel(raw), dbCategory: (sec && sec.dbCategory) || [],
           anyCategory: !!(sec && sec.anyCategory) };
}
function catalogActionsHtml(b, p, i, history) {
  if (p.pending !== true || p.refId) return '';
  var sec = partSection(p.category);
  if (!sec.dbCategory.length) {
    return '<div class="catalog-reason">No catalog section for ' + escH(sec.label) + ', so this part stays as typed.</div>';
  }
  var key = b.id + '-' + i;
  var open = LINK.key === key;
  var blocked = history.length
    ? '<span class="catalog-note">' + history.length + ' correction' + (history.length > 1 ? 's' : '') + ' on this part: linking is refused while they stand.</span>'
    : '';
  return '<div class="catalog-actions">' +
      '<a class="btn-catalog" href="gunforma-admin-part.html?build=' + b.id + '&part=' + i + '">Add to catalog</a>' +
      '<button class="btn-catalog' + (open ? ' primary' : '') + '" onclick="doToggleLink(\'' + b.id + '\',' + i + ')"' + (history.length ? ' disabled' : '') + '>' + (open ? 'Close' : 'Link to existing part') + '</button>' +
      blocked +
    '</div>' +
    (open ? linkPanelHtml(b, p, i, sec) : '');
}
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  var res = await Promise.all([
    sb.from('products').select('id,slug,name,category,brand_id').order('name'),
    sb.from('manufacturers').select('id,name'),
  ]);
  if (res[0].error || res[1].error) throw new Error((res[0].error || res[1].error).message);
  var brands = {};
  res[1].data.forEach(function (m) { brands[m.id] = m.name; });
  CATALOG = { products: res[0].data, brands: brands };
  return CATALOG;
}
async function doToggleLink(buildId, idx) {
  var key = buildId + '-' + idx;
  if (LINK.key === key) { LINK.key = null; rerenderSelected(); return; }
  var b = BUILDS.find(function (x) { return x.id === buildId; });
  var p = (b.parts_snapshot || [])[idx];
  LINK = { key: key, q: p.brand || '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
  try { await loadCatalog(); } catch (e) { LINK.msg = 'Could not load the catalog: ' + e.message; LINK.msgBad = true; }
  rerenderSelected();
}
function rerenderSelected() {
  var b = BUILDS.find(function (x) { return x.id === selectedId; });
  if (b) renderDetail(b);
}
// Products in the part's section only (the ruling), matching every word of
// the search against brand + name. Other Parts (`misc`) is the catch-all, so
// a part typed there may be any catalog part: the whole catalog is offered,
// and linking moves the part into its product's own section.
function linkCandidates(sec) {
  if (!CATALOG) return [];
  var words = LINK.q.toLowerCase().split(/\s+/).filter(Boolean);
  return CATALOG.products.filter(function (pr) {
    if (!sec.anyCategory && sec.dbCategory.indexOf(pr.category) === -1) return false;
    var hay = ((CATALOG.brands[pr.brand_id] || '') + ' ' + pr.name).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  });
}
function linkPanelHtml(b, p, i, sec) {
  var hint = sec.anyCategory
    ? 'Other Parts takes any category, so the whole catalog is searched. Linking moves the part into its product\'s own section (a recoil spring renders under Recoil Springs).'
    : 'Showing ' + escH(sec.dbCategory.map(function (c) { return window.categoryPlural(c).toLowerCase(); }).join(' and ')) + ' only.';
  return '<div class="link-panel">' +
      '<input type="text" id="link-q" placeholder="Search brand and name" value="' + escH(LINK.q) + '" oninput="linkSearch(this.value)" />' +
      '<div class="catalog-reason">' + hint + ' The entry becomes the catalog part: the builder\'s wording ("' + escH(p.name || '') + '") is replaced by the catalog name.</div>' +
      '<div class="link-results" id="link-results">' + linkResultsHtml(sec) + '</div>' +
      '<div id="link-choice">' + linkChoiceHtml(b, i) + '</div>' +
    '</div>';
}
function linkResultsHtml(sec) {
  if (!CATALOG) return LINK.msg ? '' : '<div class="catalog-reason">Loading the catalog…</div>';
  var list = linkCandidates(sec);
  if (!list.length) return '<div class="catalog-reason">Nothing in this section matches. Clear the search, or use "Add to catalog".</div>';
  return list.slice(0, 30).map(function (pr) {
    var on = LINK.productId === pr.id;
    var img = IMAGE_BY_PRODUCT_ID[pr.id];
    return '<label class="link-result' + (on ? ' on' : '') + '"><input type="radio" name="link-product"' + (on ? ' checked' : '') + ' onchange="linkPick(\'' + pr.id + '\')" />' +
      (img ? '<img src="' + escH(img) + '" alt="" />' : '') +
      '<span><strong>' + escH(CATALOG.brands[pr.brand_id] || '') + '</strong> — ' + escH(pr.name) + '<br><span class="catalog-reason">' + escH(window.productPath(pr.category, pr.slug) || pr.slug) + '</span></span></label>';
  }).join('') + (list.length > 30 ? '<div class="catalog-reason">' + (list.length - 30) + ' more: narrow the search.</div>' : '');
}
function linkSearch(q) {
  LINK.q = q;
  var b = BUILDS.find(function (x) { return x.id === selectedId; });
  var idx = Number(LINK.key.split('-').pop());
  var sec = partSection((b.parts_snapshot || [])[idx].category);
  document.getElementById('link-results').innerHTML = linkResultsHtml(sec);
}
async function linkPick(productId) {
  LINK.productId = productId; LINK.variantId = null; LINK.msg = '';
  if (!LINK.variants[productId]) {
    var res = await sb.from('product_variants')
      .select('id,color,finish,variant_label,primary_image_url,is_default,reticle,reticle_color,battery_type,mount_system')
      .eq('product_id', productId).is('retired_at', null).order('is_default', { ascending: false });
    if (res.error) { LINK.msg = 'Could not load its variants: ' + res.error.message; LINK.msgBad = true; rerenderSelected(); return; }
    LINK.variants[productId] = res.data;
  }
  var vs = LINK.variants[productId];
  LINK.variantId = vs.length ? vs[0].id : null;   // the default variant first
  rerenderSelected();
}
function linkVariant(id) { LINK.variantId = id; rerenderSelected(); }
function chosenVariant() {
  var vs = LINK.variants[LINK.productId] || [];
  return vs.find(function (v) { return v.id === LINK.variantId; }) || null;
}
function linkChoiceHtml(b, i) {
  var msg = LINK.msg ? '<div class="link-msg' + (LINK.msgBad ? ' bad' : '') + '">' + escH(LINK.msg) + '</div>' : '';
  if (!LINK.productId) return msg;
  var pr = CATALOG.products.find(function (x) { return x.id === LINK.productId; });
  var vs = LINK.variants[LINK.productId] || [];
  if (!vs.length) return '<div class="link-msg bad">That product has no live variant to link to.</div>' + msg;
  var v = chosenVariant();
  var specs = v ? window.variantSpecs(v) : '';
  return '<div class="link-choice">Variant <select onchange="linkVariant(this.value)">' +
      vs.map(function (x) { return '<option value="' + x.id + '"' + (x.id === LINK.variantId ? ' selected' : '') + '>' + escH(window.variantLabelOr(x, 'Unlabelled')) + (x.is_default ? ' (default)' : '') + '</option>'; }).join('') +
      '</select>' + (specs ? ' · <span class="catalog-reason">' + escH(specs) + '</span>' : '') +
      '<br>Links to <a href="' + escH(window.productPath(pr.category, pr.slug) || '#') + '" target="_blank" rel="noopener">' + escH(window.productPath(pr.category, pr.slug) || pr.slug) + '</a>' +
    '</div>' +
    '<div class="catalog-actions"><button class="btn-catalog primary" onclick="doLink(\'' + b.id + '\',' + i + ')"' + (LINK.busy ? ' disabled' : '') + '>' + (LINK.busy ? 'Linking…' : 'Link') + '</button>' +
    '<button class="btn-catalog" onclick="doToggleLink(\'' + b.id + '\',' + i + ')">Cancel</button></div>' + msg;
}
async function doLink(buildId, idx) {
  var v = chosenVariant();
  if (!v || LINK.busy) return;
  var pr = CATALOG.products.find(function (x) { return x.id === LINK.productId; });
  if (!window.confirm('Link this build\'s part to "' + pr.name + '" (' + window.variantLabelOr(v, 'Unlabelled') + ')? The entry becomes the catalog part.')) return;
  LINK.busy = true; LINK.msg = ''; rerenderSelected();
  // relink_build_part() swaps the part AT THIS INDEX, and checks only that
  // whatever sits there is a pending custom part. If the builder has removed
  // an earlier part since this pane was drawn, that is a different part.
  const unchanged = await ensureUnchanged(buildId, 'link the part');
  if (!unchanged) {
    // Close the panel: its index belongs to the list that was just replaced.
    LINK = { key: null, q: '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
    rerenderSelected();
    return;
  }
  // The spec line is computed here, with js/variant-label.js, so the formula
  // stays in one place; the function stores it only when non-empty.
  var res = await sb.rpc('relink_build_part', {
    p_build_id: buildId, p_part_index: idx, p_product_id: pr.id, p_variant_id: v.id,
    p_variant_specs: window.variantSpecs(v) || null,
  });
  LINK.busy = false;
  if (res.error) {
    LINK.msgBad = true;
    LINK.msg = (res.error.code === 'PGRST202' || /relink_build_part/.test(res.error.message || '') && /not find|does not exist/i.test(res.error.message || ''))
      ? 'Linking is not available yet: relink_build_part() has not been applied to the database.'
      : res.error.message;
    rerenderSelected();
    return;
  }
  LINK = { key: null, q: '', productId: null, variantId: null, variants: {}, busy: false, msg: '', msgBad: false };
  showToast('green', 'Linked to ' + pr.name);
  await loadBuilds();
  // The parts changed because of this link, and the pane now shows it.
  markReviewed(BUILDS.find(function (x) { return x.id === buildId; }));
}

// ============================================================
// INIT
// ============================================================
(async function init() {
  var ok = await requireAdmin();
  if (!ok) return;
  await loadBuilds();
})();
</script>
