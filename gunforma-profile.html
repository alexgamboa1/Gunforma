<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile — Gunforma</title>
<link rel="canonical" href="https://gunforma.com/gunforma-profile.html" />
<link rel="icon" type="image/png" href="/assets/gunforma-mark.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafaf8; color: #1a1a1a; min-height: 100vh; }

/* NAV — same shell as builds.html / index.html */
.nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 52px; border-bottom: 0.5px solid #2a2b2e; background: #0e0f11; }
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo img { height: 22px; width: auto; display: block; }
.nav-logo img.nav-logo-mark { display: none; }
@media (max-width: 600px) { .nav-logo img.nav-logo-full { display: none; } .nav-logo img.nav-logo-mark { display: block; } }
.nav-links { display: flex; gap: 28px; }
.nav-link { font-size: 12px; color: #ffffff; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; transition: color 0.15s; }
.nav-link:hover, .nav-link.active { color: #ffffff; }
.nav-link.active { border-bottom: 2px solid #4a9edd; padding-bottom: 2px; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-btn { font-size: 11px; color: #ffffff; border: 0.5px solid #2a2b2e; padding: 5px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
.nav-btn.cta { color: #4a9edd; border-color: #4a9edd; }
@media (max-width: 760px) { .nav-links { display: none; } }

/* PROFILE HEADER STRIP */
.profile-hero { background: #0e0f11; padding: 36px 28px 0; }
.profile-hero-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-bottom: 24px; }
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar { width: 76px; height: 76px; border-radius: 50%; background: #1e1f22; border: 2px solid #2a7bbd; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #4a9edd; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-edit-btn { position: absolute; bottom: -2px; right: -2px; width: 26px; height: 26px; border-radius: 50%; background: #4a9edd; border: 2px solid #0e0f11; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.avatar-edit-btn:hover { background: #2a7bbd; }
.avatar-edit-btn.uploading { background: #888; cursor: default; }

/* SOCIAL LINKS ROW */
.social-links { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.social-link { font-size: 11px; font-weight: 600; color: #7ec1f0; background: rgba(74,158,221,0.1); border: 0.5px solid rgba(74,158,221,0.35); padding: 4px 10px; border-radius: 20px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.social-link:hover { background: rgba(74,158,221,0.2); }

/* AVATAR PICKER IN ACCOUNT TAB */
.avatar-account-row { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
.avatar-account-preview { width: 64px; height: 64px; border-radius: 50%; background: #f4f3ee; border: 0.5px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #999; overflow: hidden; flex-shrink: 0; }
.avatar-account-preview img { width: 100%; height: 100%; object-fit: cover; }
.btn-secondary-sm { font-size: 11px; font-weight: 600; color: #333; background: #fafaf8; border: 0.5px solid #d5d3ca; padding: 7px 13px; border-radius: 6px; cursor: pointer; font-family: inherit; }
.btn-secondary-sm:hover { border-color: #4a9edd; color: #2a7bbd; }
.btn-text-sm { font-size: 11px; color: #a25334; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; text-decoration: underline; }
.profile-id { flex: 1; min-width: 200px; }
.profile-username { font-size: 22px; font-weight: 700; color: #e8e6e1; letter-spacing: -0.01em; margin-bottom: 4px; }
.profile-meta { font-size: 12px; color: #888780; margin-bottom: 10px; }
.profile-bio { font-size: 12.5px; color: #c8c6c0; line-height: 1.6; max-width: 520px; }
.profile-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat-pill { text-align: left; }
.stat-num { font-size: 18px; font-weight: 700; color: #e8e6e1; }
.stat-label { font-size: 10px; color: #888780; letter-spacing: 0.06em; text-transform: uppercase; }
.profile-edit-btn { font-size: 11px; color: #e8e6e1; background: transparent; border: 0.5px solid #3a3b3e; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; letter-spacing: 0.04em; text-decoration: none; white-space: nowrap; }
.profile-edit-btn:hover { border-color: #4a9edd; color: #4a9edd; }

/* TABS */
.tabs-bar { background: #0e0f11; border-top: 0.5px solid #2a2b2e; }
.tabs-inner { max-width: 1000px; margin: 0 auto; display: flex; gap: 4px; padding: 0 28px; overflow-x: auto; }
.tab-btn { font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #888780; background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 14px; cursor: pointer; white-space: nowrap; }
.tab-btn:hover { color: #c8c6c0; }
.tab-btn.active { color: #e8e6e1; border-bottom-color: #4a9edd; }

/* PAGE BODY */
.page { max-width: 1000px; margin: 0 auto; padding: 28px 28px 64px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.panel-title { font-size: 13px; font-weight: 700; color: #1a1a1a; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }

/* BUILD CARD GRID (matches gunforma-builds.html card language) */
.builds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
/* Owner delete lives on the card, not inside the link — a <button> nested in
   an <a> is invalid and a stray click on a destructive control should never
   be one the router handles. */
.build-card-wrap { position: relative; }
.build-card-delete { position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid #e5e5e5; background: rgba(255,255,255,0.94); color: #9b1c1c; font-size: 13px; line-height: 1; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s, background 0.15s; }
.build-card-wrap:hover .build-card-delete,
.build-card-delete:focus-visible { opacity: 1; }
.build-card-delete:hover { background: #fde8e2; border-color: #f9c4b6; }

/* Confirm dialog. Explicit Delete / Cancel, never a bare confirm(): the
   browser dialog cannot say what is destroyed, and this has to. */
.del-scrim { position: fixed; inset: 0; z-index: 400; background: rgba(14,15,17,0.55); opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.del-scrim.open { opacity: 1; pointer-events: auto; }
.del-modal { position: fixed; z-index: 401; top: 50%; left: 50%; transform: translate(-50%, -48%); width: calc(100% - 32px); max-width: 460px; background: #fff; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,0.25); padding: 22px; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; }
.del-modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
.del-modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.del-modal-sub { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 14px; }
.del-modal-list { font-size: 12.5px; color: #7f1d1d; background: #fde8e2; border: 0.5px solid #f9c4b6; border-radius: 6px; padding: 12px 14px; line-height: 1.75; margin-bottom: 14px; }
.del-modal-url { font-size: 12px; color: #8a5a00; background: #fef6e7; border: 0.5px solid #f0c674; border-radius: 6px; padding: 10px 12px; line-height: 1.6; margin-bottom: 18px; }
.del-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.del-btn-cancel { background: #fff; border: 0.5px solid #d5d3ca; color: #333; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.del-btn-confirm { background: #c0392b; border: none; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.del-btn-confirm:hover:not(:disabled) { background: #a93226; }
.del-btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

.build-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: border-color 0.15s, transform 0.15s; }
.build-card:hover { border-color: #cfcdc4; transform: translateY(-1px); }
.build-card.disabled { cursor: default; }
.build-card.disabled:hover { transform: none; border-color: #e5e5e5; }
.build-card-photo { position: relative; aspect-ratio: 16/10; background: #f4f3ee; overflow: hidden; }
.build-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.build-card-nophoto { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 11px; color: #b8b5ac; letter-spacing: 0.06em; }
.status-badge { position: absolute; top: 10px; left: 10px; font-size: 9px; padding: 3px 8px; border-radius: 20px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.status-badge.approved { color: #166534; background: #e8f5ee; border: 0.5px solid #86cfad; }
.status-badge.pending  { color: #b45309; background: #fef3e2; border: 0.5px solid #f9b860; }
.status-badge.draft    { color: #555; background: #f0efe9; border: 0.5px solid #d5d3ca; }
.status-badge.rejected { color: #9b1c1c; background: #fde8e2; border: 0.5px solid #f9c4b6; }
.build-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.build-card-name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
.build-card-sub { font-size: 11px; color: #888; }
.build-card-rejection { font-size: 11px; color: #9b1c1c; line-height: 1.4; }
.build-card-rejection-meta { font-size: 10.5px; color: #b46a5e; }
.build-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; border-top: 0.5px solid #eee; }
.build-card-total { font-size: 12px; font-weight: 700; }
.remove-btn { font-family: inherit; font-size: 10px; color: #a25334; background: #fafaf8; border: 0.5px solid #eec2ae; padding: 4px 9px; border-radius: 20px; cursor: pointer; }
.remove-btn:hover { background: #fde8e2; }

/* PART CARD (matches parts-catalog.html card language, trimmed) */
.parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.part-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 6px; overflow: hidden; }
.part-card-img { aspect-ratio: 4/3; background: #f4f3ee; display: flex; align-items: center; justify-content: center; }
.part-card-img img { width: 100%; height: 100%; object-fit: cover; }
.part-card-img-fallback { font-size: 10px; color: #b8b5ac; }
.part-card-body { padding: 10px 12px 12px; }
.part-card-brand { font-size: 9.5px; color: #888; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
.part-card-name { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
.part-card-footer { display: flex; align-items: center; justify-content: space-between; }
.part-card-price { font-size: 12px; font-weight: 700; color: #2a7bbd; }

/* EMPTY STATE */
.empty { text-align: center; padding: 48px 20px; background: #fff; border: 0.5px dashed #d5d3ca; border-radius: 6px; }
.empty-title { font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
.empty-sub { font-size: 12px; color: #666; line-height: 1.6; margin-bottom: 16px; max-width: 380px; margin-left: auto; margin-right: auto; }
.empty-cta { display: inline-block; font-size: 12px; font-weight: 700; padding: 9px 16px; color: #fff; background: #2a7bbd; border-radius: 4px; text-decoration: none; }

/* ACCOUNT FORM */
.account-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 8px; padding: 24px; max-width: 480px; }
.field { margin-bottom: 16px; }
.field-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #555; margin-bottom: 6px; display: block; }
.field-input, .field-textarea { width: 100%; font-size: 13px; padding: 10px 12px; border: 0.5px solid #e5e5e5; border-radius: 6px; font-family: inherit; color: #1a1a1a; }
.field-input:focus, .field-textarea:focus { outline: none; border-color: #4a9edd; }
.field-textarea { resize: vertical; min-height: 76px; }
.field-static { font-size: 13px; color: #666; padding: 10px 0; }
.field-help { font-size: 11px; color: #999; margin-top: 5px; }
.btn-save { font-size: 12px; font-weight: 700; background: #4a9edd; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; letter-spacing: 0.04em; }
.btn-save:hover { background: #2a7bbd; }
.btn-danger-ghost { font-size: 12px; color: #a25334; background: transparent; border: 0.5px solid #eec2ae; padding: 9px 16px; border-radius: 6px; cursor: pointer; margin-top: 24px; }
.btn-danger-ghost:hover { background: #fde8e2; }
.save-msg { font-size: 12px; margin-top: 10px; display: none; }
.save-msg.ok { color: #22a06b; display: block; }
.save-msg.err { color: #e25c3a; display: block; }

/* GATE / LOADING */
.gate { text-align: center; padding: 80px 20px; font-size: 12px; color: #888; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1b1e; color: #fff; font-size: 12px; padding: 10px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: all 0.2s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast a { color: #7ec1f0; margin-left: 6px; }
.nav-toggle { display: none; background: none; border: 0; padding: 8px; margin: 0 -8px 0 0; cursor: pointer; }
.nav-toggle span { display: block; width: 20px; height: 2px; background: #e8e6e1; border-radius: 2px; }
.nav-toggle span + span { margin-top: 4px; }
.nav-profile { display: none; align-items: center; justify-content: center; width: 34px; height: 34px; border: 0.5px solid #2a2b2e; border-radius: 50%; color: #ffffff; text-decoration: none; }
.nav-profile svg { width: 19px; height: 19px; }
.nav-menu { display: none; }
@media (max-width: 820px) {
  .nav-links { display: none; }
  .nav-signin-inline { display: none; }
  .nav-profile { display: flex; }
  .nav-toggle { display: block; }
  .nav-menu { position: absolute; top: 52px; left: 0; right: 0; background: #0e0f11; border-bottom: 0.5px solid #2a2b2e; flex-direction: column; padding: 8px 0; z-index: 99; }
  .nav-menu.open { display: flex; }
  .nav-menu a { padding: 13px 28px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff; text-decoration: none; border-bottom: 0.5px solid #1a1b1e; }
  .nav-menu a.signout { color: #ffffff; }
}
</style>

<!-- Owner delete confirmation. Deliberately not confirm(): the browser dialog
     cannot list what is destroyed or warn that the URL dies, and those are
     the two things someone needs to read before agreeing. -->

<script>
// ============================================================
// SUPABASE — client comes from js/supabase-client.js (window.sb),
// nav from js/nav.js. SB_URL is kept only for the photoUrl helper.
// ============================================================
const sb = window.sb;
const SB_URL = 'https://lagjjcpclvzrjlrswojt.supabase.co';

sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)) {
    // Only bounce off the *private* dashboard — a public /u/<username> or
    // ?u= view should survive someone else's session hiccups.
    if (!viewedUsername()) window.location.href = 'gunforma-signin.html';
  }
});

function photoUrl(path) { return SB_URL + '/storage/v1/object/public/build-photos/' + path; }
function escH(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(iso) { return new Date(iso).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }
function showToast(msg, linkHref, linkText) {
  const t = document.getElementById('toast');
  t.innerHTML = escH(msg) + (linkHref ? ' <a href="'+escH(linkHref)+'">'+escH(linkText||'Sign in →')+'</a>' : '');
  t.classList.add('show');
  clearTimeout(window._ttoast);
  window._ttoast = setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

// ============================================================
// STATE
// ============================================================
let CURRENT_USER = null;      // session user, or null if signed out
let VIEW_PROFILE = null;      // the profile row being displayed (self or ?u=)
let IS_OWN_PROFILE = false;   // true only on the bare, no-?u= dashboard
let MY_BUILDS = [];
let SAVED_BUILDS = [];
let FAVORITE_PARTS = [];

// Which profile is being viewed. /u/<username> is the canonical public URL
// (rewritten to the profile-og function, which injects OG meta and serves
// this same page); ?u=<username> is still honored so older links keep working.
// Neither present = the signed-in user's own private dashboard.
function viewedUsername() {
  const m = location.pathname.match(/^\/u\/([^/]+)\/?$/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('u');
}

// ============================================================
// BOOTSTRAP — nav.js owns the nav (username, sign-out, auth-state
// refresh); this page only needs the session to decide whether it's
// rendering the private dashboard or a public ?u= view.
// ============================================================
async function init() {
  const { data: sess } = await sb.auth.getSession();
  CURRENT_USER = (sess && sess.session && sess.session.user) || null;

  const qsUsername = viewedUsername();
  IS_OWN_PROFILE = !qsUsername;

  if (IS_OWN_PROFILE && !CURRENT_USER) {
    window.location.href = 'gunforma-signin.html?next=gunforma-profile.html';
    return;
  }

  if (IS_OWN_PROFILE) {
    const { data, error } = await sb.from('profiles').select('id,username,bio,avatar_url,instagram_url,youtube_url,created_at').eq('id', CURRENT_USER.id).maybeSingle();
    if (error || !data) { renderGateError('Could not load your profile.'); return; }
    VIEW_PROFILE = data;
  } else {
    const { data, error } = await sb.from('profiles').select('id,username,bio,avatar_url,instagram_url,youtube_url,created_at').eq('username', qsUsername).maybeSingle();
    if (error || !data) { renderGateError('No profile found for "'+qsUsername+'".'); return; }
    VIEW_PROFILE = data;
  }

  await renderShell();
}

function renderGateError(msg) {
  document.getElementById('page-root').innerHTML = '<div class="gate">'+escH(msg)+'</div>';
}

// ============================================================
// SHELL — header + tabs + panel containers
// ============================================================
async function renderShell() {
  const p = VIEW_PROFILE;
  const initial = (p.username || '?').charAt(0).toUpperCase();
  const avatarHtml = p.avatar_url
    ? '<img src="'+escH(p.avatar_url)+'" alt=""/>'
    : initial;

  // Stat counts — fetched once, up front, so the header renders complete.
  const [buildsCountRes, firesReceivedRes] = await Promise.all([
    sb.from('builds').select('id', { count: 'exact', head: true }).eq('user_id', p.id).eq('status', 'approved'),

// ============================================================
// AVATAR UPLOAD — same shape as post-build's photo pipeline: re-encode
// through a canvas (normalizes format + strips EXIF/GPS), single size
// since avatars are small and always shown near-thumbnail scale.
// ============================================================
const AVATAR_MAX_BYTES = 5 * 1024 * 1024;
const AVATAR_MAX_DIMENSION = 480;
const AVATAR_JPEG_QUALITY = 0.85;

function normalizeAvatarImage(file) {
  return new Promise(function(resolve, reject) {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(objectUrl);
      const w0 = img.naturalWidth, h0 = img.naturalHeight;
      if (!w0 || !h0) { reject(new Error('Image has no dimensions')); return; }
      // Center-crop to square so avatars aren't stretched/squashed in the
      // circular frame, then scale to the target dimension.
      const side = Math.min(w0, h0);
      const sx = (w0 - side) / 2, sy = (h0 - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = AVATAR_MAX_DIMENSION; canvas.height = AVATAR_MAX_DIMENSION;
      canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, AVATAR_MAX_DIMENSION, AVATAR_MAX_DIMENSION);
      canvas.toBlob(function(blob) {
        if (!blob) { reject(new Error('Could not encode image')); return; }
        resolve(blob);
      }, 'image/jpeg', AVATAR_JPEG_QUALITY);
    };
    img.onerror = function() { URL.revokeObjectURL(objectUrl); reject(new Error('Unsupported image')); };
    img.src = objectUrl;
  });
}

window.onAvatarFileSelected = async function(event) {
  const file = event.target.files[0];
  event.target.value = '';   // allow re-selecting the same file later
  if (!file) return;

  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
    showToast('Please choose a JPEG, PNG, or WebP photo.');
    return;
  }
  if (file.size > AVATAR_MAX_BYTES) {
    showToast('That photo is too large — please choose one under 5MB.');
    return;
  }

  const btn = document.getElementById('avatar-edit-btn');
  if (btn) { btn.classList.add('uploading'); btn.textContent = '…'; }

  let blob;
  try {
    blob = await normalizeAvatarImage(file);
  } catch (e) {
    console.error(e);
    showToast("Couldn't read that image — try a different file.");
    if (btn) { btn.classList.remove('uploading'); btn.textContent = '📷'; }
    return;
  }

  // Instant local preview while the upload is in flight.
  const previewUrl = URL.createObjectURL(blob);
  const displayEl = document.getElementById('avatar-display');
  if (displayEl) displayEl.innerHTML = '<img src="'+previewUrl+'" alt=""/>';
  const acctPreview = document.getElementById('acct-avatar-preview');
  if (acctPreview) acctPreview.innerHTML = '<img src="'+previewUrl+'" alt=""/>';

  const oldPath = avatarUrlToPath(VIEW_PROFILE.avatar_url);
  const path = CURRENT_USER.id + '/avatar-' + Date.now() + '.jpg';

  const { error: upErr } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (upErr) {
    console.error(upErr);
    showToast('Upload failed — try again.');
    if (btn) { btn.classList.remove('uploading'); btn.textContent = '📷'; }
    return;
  }

  const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
  const publicUrl = pub.publicUrl;

  const { error: dbErr } = await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', CURRENT_USER.id);
  if (dbErr) {
    console.error(dbErr);
    showToast('Photo uploaded but could not save to your profile — try again.');
    sb.storage.from('avatars').remove([path]);
    if (btn) { btn.classList.remove('uploading'); btn.textContent = '📷'; }
    return;
  }

  // Clean up the previous avatar file now that the new one is live.
  if (oldPath) sb.storage.from('avatars').remove([oldPath]);

  VIEW_PROFILE.avatar_url = publicUrl;
  if (btn) { btn.classList.remove('uploading'); btn.textContent = '📷'; }
  showToast('Profile photo updated');
};

window.removeAvatar = async function() {
  const oldPath = avatarUrlToPath(VIEW_PROFILE.avatar_url);
  const { error } = await sb.from('profiles').update({ avatar_url: null }).eq('id', CURRENT_USER.id);
  if (error) { showToast('Could not remove photo — try again'); return; }
  if (oldPath) sb.storage.from('avatars').remove([oldPath]);
  VIEW_PROFILE.avatar_url = null;
  await renderShell();
  switchTab('account');
};

// Storage stores paths, profiles.avatar_url stores the full public URL —
// this reverses that so we can delete the old file when a new one lands.
function avatarUrlToPath(url) {
  if (!url) return null;
  const marker = '/storage/v1/object/public/avatars/';
  const idx = url.indexOf(marker);
  return idx === -1 ? null : url.slice(idx + marker.length);
}

window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  var panel = document.getElementById('panel-'+tab);
  if (panel) panel.classList.add('active');
};

// Where a build card points.
//
// A draft that is nothing but a parts list opens in the Armory, which is
// built for exactly that. Anything else keeps going to post-build.
//
// The test is deliberately NOT "did this come from the Armory?" — there is no
// origin column, and every field an Armory draft sets can also occur on a
// post-build draft (post-build's saveDraft only requires a platform and a
// name, so it too can have no photos and no description). Instead the test is
// "can the Armory represent this build without losing anything?", which is the
// property that actually matters and can't be fooled by a renamed draft.
//
// name is intentionally not part of the rule: the Armory's UPDATE never writes
// name, so a post-build draft opened there keeps its title.
//
// rejected builds always go to post-build — they need resubmission, which only
// that page can do.
function routeForBuild(b) {
  if (b.status === 'approved') {
    return 'gunforma-build-detail.html?id=' + encodeURIComponent(b.id);
  }
  if (b.status === 'draft' && isPartsOnlyDraft(b)) {
    return 'gunforma-armory.html?build=' + encodeURIComponent(b.id);
  }
  return 'gunforma-post-build.html?id=' + encodeURIComponent(b.id) + '&mode=edit';
}

// True only when the draft holds nothing post-build owns. Conservative by
// construction: any photo, any story, or any activity tag keeps it in
// post-build so nothing a user wrote becomes unreachable.
function isPartsOnlyDraft(b) {
  const photos = Array.isArray(b.build_photos) ? b.build_photos.length : 0;
  const hasStory = typeof b.description === 'string' && b.description.trim() !== '';
  const tags = Array.isArray(b.activities) ? b.activities.length : 0;
  return photos === 0 && !hasStory && tags === 0;
}

function renderStatusBuildCard(b) {
  const photos = b.build_photos || [];
  const hero = photos.find(function(p){ return p.is_hero; }) || photos[0];
  const photoHtml = hero
    ? '<img src="'+escH(photoUrl(hero.thumb_path || hero.storage_path))+'" alt=""/>'
    : '<div class="build-card-nophoto">No photo</div>';
  const platform = b.platforms ? b.platforms.name : '';
  const partsCount = Array.isArray(b.parts_snapshot) ? b.parts_snapshot.length : 0;
  const statusLabel = { approved: 'Live', pending: 'In review', draft: 'Draft', rejected: 'Needs changes' }[b.status] || b.status;
  // Draft and rejected are owner-editable; approved routes to the public
  // detail page; only pending stays locked while the admin queue works it.
  const editable = b.status === 'draft' || b.status === 'rejected';
  const clickable = b.status === 'approved' || editable;
  const rejectionHtml = b.status === 'rejected'
    ? '<div class="build-card-rejection">'+escH(b.rejection_reason || 'Needs changes — open to edit and resubmit')+'</div>'+
      '<div class="build-card-rejection-meta">Reviewed '+escH(relTime(b.reviewed_at))+'</div>'
    : '';
  const inner =
      '<div class="build-card-photo">'+photoHtml+'<div class="status-badge '+escH(b.status)+'">'+escH(statusLabel)+'</div></div>'+
      '<div class="build-card-body">'+
        '<div class="build-card-name">'+escH(b.name)+'</div>'+
        rejectionHtml+
        '<div class="build-card-sub">'+escH(platform)+' · '+partsCount+' part'+(partsCount!==1?'s':'')+'</div>'+
      '</div>';
  const href = routeForBuild(b);
  const card = clickable
    ? '<a class="build-card" href="'+href+'">'+inner+'</a>'
    : '<div class="build-card disabled">'+inner+'</div>';

  // Owner-only, and every status — the DB policy is now
  // "Owners can delete their own builds" using auth.uid() = user_id, with no
  // status clause. The id rides on a data attribute rather than an inline
  // argument so a build named with a quote can still be deleted.
  if (!IS_OWN_PROFILE) return card;
  return '<div class="build-card-wrap">'+card+
    '<button class="build-card-delete" type="button" title="Delete this build" '+
      'aria-label="Delete '+escH(b.name||'')+'" data-build-id="'+escH(b.id)+'" '+
      'onclick="openDeleteBuild(this.dataset.buildId)">🗑</button>'+
  '</div>';
}

// ============================================================
// OWNER DELETE
// ============================================================
// Lives here, on the profile, rather than on gunforma-build-detail.html:
//   • the profile is the owner's management surface — it already carries the
//     per-status cards and the edit routing, and it is where someone goes to
//     administer their own things rather than to read one;
//   • the profile still exists afterwards. Deleting from the build page
//     destroys the page you are standing on, which then has to redirect
//     somewhere and explain itself;
//   • the build page is the one owners share. A destructive control there is
//     one misclick away from an audience.
let DELETE_TARGET = null;

function openDeleteBuild(buildId) {
  const b = (MY_BUILDS || []).find(function(x){ return x.id === buildId; });
  if (!b) return;
  DELETE_TARGET = b;

  const live = b.status === 'approved';
  const photos = (b.build_photos || []).length;

  document.getElementById('del-modal-title').textContent = 'Delete “' + (b.name || 'this build') + '”?';
  document.getElementById('del-modal-sub').textContent =
    'This cannot be undone. There is no trash and no restore.';
  document.getElementById('del-modal-list').innerHTML =
    'Deleting this build permanently removes:' +
    '<br>• the build page itself' +
    '<br>• its ' + photos + ' photo' + (photos === 1 ? '' : 's') + ', including the image files' +
    '<br>• every comment and reply on it' +
    '<br>• every like and every save by other people';
  // Only worth saying for a build that has a live URL someone might hold.
  document.getElementById('del-modal-url').style.display = live ? '' : 'none';
  document.getElementById('del-modal-url').innerHTML =
    'This build is <strong>live</strong>. Its address stops working the moment it is deleted, ' +
    'so any link you have shared — in a message, a forum post or a bio — will break.';

  document.getElementById('del-scrim').classList.add('open');
  document.getElementById('del-modal').classList.add('open');
  const cancel = document.getElementById('del-btn-cancel');
  if (cancel) cancel.focus();
}

// Escape closes it, like any dialog. Guarded on DELETE_TARGET so this does
// nothing when the modal is not up.
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && DELETE_TARGET) closeDeleteBuild();
});

function closeDeleteBuild() {
  DELETE_TARGET = null;
  document.getElementById('del-scrim').classList.remove('open');
  document.getElementById('del-modal').classList.remove('open');
  const btn = document.getElementById('del-btn-confirm');
  if (btn) { btn.disabled = false; btn.textContent = 'Delete build'; }
}

async function confirmDeleteBuild() {
  const b = DELETE_TARGET;
  if (!b) return;
  const btn = document.getElementById('del-btn-confirm');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }

  // Paths BEFORE the row goes. build_photos cascades with the build, and
  // once those rows are gone nothing records where the files were — an
  // orphan nobody can name is one nobody can clean up.
  const paths = [];
  (b.build_photos || []).forEach(function(p) {
    if (p.storage_path) paths.push(p.storage_path);
    if (p.thumb_path)   paths.push(p.thumb_path);
  });

  // Row first, files second: deleting the files of a build that then survives
  // leaves a live page with broken images, which is worse than an orphan.
  //
  // .select('id') and a row-count check, because an RLS-filtered DELETE
  // matches zero rows and returns no error — the silent success that has
  // bitten this project three times this week.
  const { data: deleted, error } = await sb.from('builds')
    .delete().eq('id', b.id).eq('user_id', CURRENT_USER.id).select('id');

  if (error) {
    console.error(error);
    if (btn) { btn.disabled = false; btn.textContent = 'Delete build'; }
    showToast('Delete failed — ' + (error.code ? error.code + ': ' : '') + (error.message || 'see console'));
    return;
  }
  if (!Array.isArray(deleted) || deleted.length !== 1) {
    console.error('delete matched no rows', { id: b.id, returned: deleted });
    if (btn) { btn.disabled = false; btn.textContent = 'Delete build'; }
    showToast('Delete refused — nothing was removed. Reload and try again.');
    return;
  }

  // The build is gone by here, so a storage failure is reported, not fatal.
  let orphaned = 0;
  if (paths.length) {
    const { error: sErr } = await sb.storage.from('build-photos').remove(paths);
    if (sErr) { orphaned = paths.length; console.error('storage delete failed', sErr, paths); }
  }

  closeDeleteBuild();
  await loadMyBuilds();
  showToast(orphaned
    ? 'Build deleted — ' + orphaned + ' image file(s) could not be removed'
    : 'Build deleted');
}

// Cheap relative-time formatter for owner-facing "Reviewed X ago" copy.
function relTime(iso) {
  if (!iso) return '—';
  var diffMs = Date.now() - new Date(iso).getTime();
  var mins = Math.max(0, Math.round(diffMs/60000));
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins/60);
  if (hrs < 24)  return hrs + ' hr ago';
  var days = Math.round(hrs/24);
  return days + ' day' + (days!==1?'s':'') + ' ago';
}

};

// ============================================================
// FAVORITE PARTS TAB — reads from the existing live table part_favorites
// (not a table this migration creates — it already exists and is already
// wired to the heart button in the parts catalog / Armory).
// ============================================================
async function loadFavoriteParts() {
  const panel = document.getElementById('panel-favorites');
  const { data, error } = await sb
    .from('part_favorites')
    .select('product_id, products!inner(id,name,description,manufacturers(name),product_variants!product_variants_product_id_fkey(is_default,msrp,primary_image_url))')
    // Two levels down: part_favorites -> products -> product_variants.
    .is('products.product_variants.retired_at', null)
    .eq('user_id', CURRENT_USER.id)
    .order('created_at', { ascending: false });

  if (error) {
    panel.innerHTML = '<div class="empty"><div class="empty-title">Could not load favorite parts</div>'+
      '<div class="empty-sub">'+escH(error.message)+'</div></div>';
    return;
  }
  FAVORITE_PARTS = data || [];

  panel.innerHTML =
    '<div class="panel-title">Favorite parts ('+FAVORITE_PARTS.length+')</div>'+
    (FAVORITE_PARTS.length
      ? '<div class="parts-grid">'+FAVORITE_PARTS.map(function(r){ return renderFavoritePartCard(r.products); }).join('')+'</div>'
      : '<div class="empty"><div class="empty-title">No favorite parts yet</div>'+
          '<div class="empty-sub">Tap the heart on any part in the catalog to save it here.</div>'+
          '<a class="empty-cta" href="gunforma-parts-catalog.html">Browse the catalog</a></div>');
}

function renderFavoritePartCard(p) {
  const dv = (p.product_variants || []).find(function(v){ return v.is_default; }) || (p.product_variants || [])[0];
  const img = dv && dv.primary_image_url
    ? '<img src="'+escH(dv.primary_image_url)+'" alt=""/>'
    : '<div class="part-card-img-fallback">No photo</div>';
  const price = dv && dv.msrp != null ? '$'+Number(dv.msrp).toFixed(2) : '—';
  const brand = p.manufacturers ? p.manufacturers.name : 'Unknown brand';
  return '<div class="part-card">'+
      '<div class="part-card-img">'+img+'</div>'+
      '<div class="part-card-body">'+
        '<div class="part-card-brand">'+escH(brand)+'</div>'+
        '<div class="part-card-name">'+escH(p.name)+'</div>'+
        '<div class="part-card-footer"><div class="part-card-price">'+price+'</div>'+
          '<button class="remove-btn" onclick="unfavoritePart(\''+p.id+'\')">Remove</button>'+
        '</div>'+
      '</div>'+
    '</div>';
}

window.unfavoritePart = async function(productId) {
  const { error } = await sb.from('part_favorites').delete().eq('product_id', productId).eq('user_id', CURRENT_USER.id);
  if (error) { showToast('Could not remove — try again'); return; }
  await loadFavoriteParts();
};

// ============================================================
// ACCOUNT TAB — username / bio / avatar_url / marketing consent / sign out
// ============================================================
function renderAccountPanel() {
  const panel = document.getElementById('panel-account');
  const p = VIEW_PROFILE;
  const initial = (p.username || '?').charAt(0).toUpperCase();
  const acctAvatarHtml = p.avatar_url ? '<img src="'+escH(p.avatar_url)+'" alt=""/>' : initial;

  panel.innerHTML =
    '<div class="panel-title">Account</div>'+
    '<div class="account-card">'+
      '<div class="field">'+
        '<label class="field-label">Profile photo</label>'+
        '<div class="avatar-account-row">'+
          '<div class="avatar-account-preview" id="acct-avatar-preview">'+acctAvatarHtml+'</div>'+
          '<button class="btn-secondary-sm" onclick="document.getElementById(\'avatar-file-input-acct\').click()">Change photo</button>'+
          (p.avatar_url ? '<button class="btn-text-sm" onclick="removeAvatar()">Remove</button>' : '')+
        '</div>'+
        '<input type="file" id="avatar-file-input-acct" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="onAvatarFileSelected(event)"/>'+
        '<div class="field-help">JPEG, PNG, or WebP, under 5MB. We crop it square and strip location data automatically.</div>'+
      '</div>'+
      '<div class="field"><label class="field-label">Email</label><div class="field-static">'+escH(CURRENT_USER.email || '—')+'</div></div>'+
      '<div class="field"><label class="field-label">Username</label>'+
        '<input class="field-input" id="acct-username" type="text" value="'+escH(p.username || '')+'"/>'+
        '<div class="field-help">Letters, numbers, and underscores only. Changing this changes your public build URLs.</div>'+
      '</div>'+
      '<div class="field"><label class="field-label">Bio</label>'+
        '<textarea class="field-textarea" id="acct-bio" maxlength="280" placeholder="What you run, what you shoot, what you build...">'+escH(p.bio || '')+'</textarea>'+
      '</div>'+
      '<div class="field"><label class="field-label">Instagram</label>'+
        '<input class="field-input" id="acct-instagram" type="text" value="'+escH(p.instagram_url || '')+'" placeholder="@yourhandle or full profile link"/>'+
      '</div>'+
      '<div class="field"><label class="field-label">YouTube</label>'+
        '<input class="field-input" id="acct-youtube" type="text" value="'+escH(p.youtube_url || '')+'" placeholder="@yourchannel or full channel link"/>'+
      '</div>'+
      '<button class="btn-save" onclick="saveAccount()">Save changes</button>'+
      '<div class="save-msg" id="acct-msg"></div>'+
    '</div>'+
    '<button class="btn-danger-ghost" onclick="signOutAccount()">Sign out</button>';
}

// Lets people paste either a bare handle ("@name" / "name") or a full URL
// into the social fields — normalizes to a full URL either way so the
// public profile can always render a clean, clickable link.
function normalizeSocialUrl(input, platform) {
  var v = (input || '').trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return v;
  var handle = v.replace(/^@/, '');
  return platform === 'instagram'
    ? 'https://instagram.com/' + handle
    : 'https://youtube.com/@' + handle;
}

window.saveAccount = async function() {
  const username = document.getElementById('acct-username').value.trim();
  const bio = document.getElementById('acct-bio').value.trim();
  const instagramUrl = normalizeSocialUrl(document.getElementById('acct-instagram').value, 'instagram');
  const youtubeUrl = normalizeSocialUrl(document.getElementById('acct-youtube').value, 'youtube');
  const msg = document.getElementById('acct-msg');

  if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
    msg.textContent = 'Username must be 3–24 characters: letters, numbers, underscores only.';
    msg.className = 'save-msg err';
    return;
  }

  const { error } = await sb.from('profiles').update({
    username: username,
    bio: bio || null,
    instagram_url: instagramUrl,
    youtube_url: youtubeUrl,
  }).eq('id', CURRENT_USER.id);

  if (error) {
    msg.textContent = (error.code === '23505' || /duplicate|unique/i.test(error.message))
      ? 'That username is already taken.' : (error.message || 'Something went wrong.');
    msg.className = 'save-msg err';
    return;
  }
  msg.textContent = 'Saved.';
  msg.className = 'save-msg ok';
  VIEW_PROFILE.username = username;
  VIEW_PROFILE.bio = bio;
  VIEW_PROFILE.instagram_url = instagramUrl;
  VIEW_PROFILE.youtube_url = youtubeUrl;
  await renderShell();
  switchTab('account');
};

window.signOutAccount = async function() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
};

init();
</script>
