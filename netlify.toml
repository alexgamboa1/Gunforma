[build]
  # There is no compile step — the repo root IS the artifact, and publish = "."
  # reproduces exactly what the site published before this command existed.
  # The command exists solely to run the PGRST201 embed guard, which exits
  # non-zero and so fails the deploy. See scripts/check-embeds.sh.
  command = "bash scripts/check-embeds.sh"
  publish = "."

[build.environment]
  # No .nvmrc or .node-version in the repo and no UI env var, so without this
  # the build floats on whatever the Noble image happens to default to.
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# profile-og server-renders OG meta into the profile page, so it needs the
# page itself available at runtime.
[functions."profile-og"]
  included_files = ["gunforma-profile.html"]

# ---------------------------------------------------------------------------
# Not-the-website paths. publish = "." serves the whole repo root, so source
# that happens to live next to the pages is reachable over HTTP. None of it is
# secret — the scripts read SUPABASE_SERVICE_ROLE_KEY from the environment and
# hold no literals — but none of it is site content either.
#
# force = true is required: without it a rule only applies when no file exists
# at that path, which is precisely the case we need to override.
#
# These sit ABOVE every rewrite below because matching is first-match-wins.
# None of the prefixes can collide with a real route: pages live at the root,
# /parts/* and /u/* have their own prefixes, and the functions endpoint is
# /.netlify/ (leading dot) which is a different path from /netlify/.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# /netlify/* only — NOT /.netlify/*, which is how functions and edge functions
# are actually invoked. Blocking that would take the site down.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# _scratch/ is deleted in this same commit; the rule stays so the path cannot
# quietly become live again.
[[redirects]]
  from = "/_scratch/*"
  to = "/404.html"
  status = 404
  force = true

# Extension wildcards do NOT work here. Netlify only treats "*" as a splat at
# the END of a path, so "/*.md" matches nothing — verified on deploy preview
# 13, where both .md files still returned 200 under such a rule. (It does not
# over-match either: every real route stayed 200.) Root-level files therefore
# have to be listed individually.
#
# Anything with a .sql or .sh extension currently lives under /supabase/ or
# /scripts/, which the directory rules above already cover. A NEW .md, .sql or
# .sh added at the repo root will be publicly served until it gets a rule here.
# Prefer putting such files in an already-blocked directory.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PARTS_BUILDER_COMPATIBILITY_LOGIC.md"
  to = "/404.html"
  status = 404
  force = true

# Shareable profile URLs. status = 200 is a rewrite, not a redirect — the
# address bar keeps /u/:username, which is what the canonical tag points at.
#
# :splat rather than a named :username placeholder — production does not
# substitute named placeholders into a rewrite target's query string (netlify
# dev does, which hides it locally). The function also falls back to parsing
# the path and x-nf-original-path, so routing changes can't silently break it.
[[redirects]]
  from = "/u/*"
  to = "/.netlify/functions/profile-og?username=:splat"
  status = 200

[[redirects]]
  from = "/field-notes"
  to = "/field-notes.html"
  status = 200

# Per-product pages, server-rendered so crawlers see real content instead of
# the "Loading parts…" shell the client-side catalog shows before Supabase
# resolves. :splat carries "category/slug" (or just "slug" — the function
# takes the last path segment either way); status = 200 is a rewrite, not a
# redirect, so the address bar and the page's own canonical tag both stay on
# /parts/:category/:slug. Same reasoning as the /u/* rewrite above re: using
# :splat instead of named placeholders.
[[redirects]]
  from = "/parts/*"
  to = "/.netlify/functions/product-page?splat=:splat"
  status = 200

[[redirects]]
  from = "/field-notes/"
  to = "/field-notes.html"
  status = 200

# Runs on every request so it can branch on Host, which Netlify's redirect
# conditions can't do. Redirects the production *.netlify.app hostnames to the
# apex and marks previews noindex; the apex passes through untouched.
[[edge_functions]]
  path = "/*"
  function = "canonical-host"
